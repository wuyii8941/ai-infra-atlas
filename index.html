=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>j\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>c\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmover>\u003cmi>x\u003c/mi>\u003cmo accent=\"true\">̃\u003c/mo>\u003c/mover>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\tilde x_{r+1}=Update(x_r,+\\nabla_x\\Delta),\\quad x_{r+1}=Project(\\tilde x_{r+1}).\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这里Project是最近邻token映射，不是简单把数值裁剪到[-1,1]。常规Adam优化器默认下降，若代码直接把Delta作为loss，还要正确处理上升方向；论文写法描述的是maximize。\u003c/p>\n\u003ch2 id=\"h03\">投影为什么要每轮做\u003c/h2>\n\u003cp>连续向量不一定对应任何真实token。若只报告连续对抗embedding的误差，测试对象已经不是合法token输入。交替连续更新与离散投影，是为了利用局部梯度同时保持实际可执行输入。\u003c/p>\n\u003cp>论文对最近邻搜索的具体索引实现、两侧不同embedding表如何共享搜索表示等细节没有在当前稿件中完全展开，本站不编造。它说明Stage 2固定配置并加载Stage 1峰值时刻的两侧checkpoint。\u003c/p>\n\u003ch2 id=\"h04\">一个重要归因边界\u003c/h2>\n\u003cp>两侧checkpoint来自已经分歧的训练轨迹，并非保证参数完全相同。因此Stage 2的偏差包含既有状态差异与新输入的共同作用，不等同于“同权重、单算子local error最大化”。面试时应按论文定义表述，不把更强结论加进去。\u003c/p>\n\u003ch2 id=\"h05\">实验怎样证明作用\u003c/h2>\n\u003cp>100轮、步长0.01，对照同checkpoint、同初始输入下100轮随机token mutation。Liger RMSNorm由Stage1的0.00277到Stage2的0.0262，越过tau=0.01。相对Stage1增加约846%；相对随机mutation的0.00298是8.79倍。这两个百分比/倍率的分母不同。\u003c/p>\n\u003cp>Megatron bias_gelu最终0.979，相对Stage2随机0.301约3.25倍；不是算子运行快3.25倍。某些算子几乎无改进，论文解释其差异梯度很小，这是搜索的局限而不是需要删除的行。\u003c/p>\n\u003ch2 id=\"h06\">如何读结论\u003c/h2>\n\u003cp>输出是预算内观测到的最大偏差。它支持“输入选择影响数值风险”和“两阶段互补”，不支持“证明全局最坏值”或“优化实现必然训练失败”。\u003c/p>\n","toc":[{"id":"h01","title":"第一阶段之后还缺什么","level":2},{"id":"h02","title":"连续表示如何帮助离散搜索","level":2},{"id":"h03","title":"投影为什么要每轮做","level":2},{"id":"h04","title":"一个重要归因边界","level":2},{"id":"h05","title":"实验怎样证明作用","level":2},{"id":"h06","title":"如何读结论","level":2}],"plain":"第一阶段之后还缺什么 配置已固定，但输入仍影响激活分布和误差传播。同一学习率、dtype、结构下，不同token组合可能使某些算子落入更敏感的数值区域。词表V、序列长S产生V^S种输入，穷举不可行。 连续表示如何帮助离散搜索 token ID本身是整数索引，对ID做普通梯度没有意义；Embedding向量是连续的。Stage 2用当前输入的embedding计算偏差梯度，执行Adam形式的上升更新，再把更新后的向量映射到embedding table中最近的合法token，重新取得对应embedding评价。 概念上： x ̃ r + 1 = U p d a t e ( x r , + ∇ x Δ ) , x r + 1 = P r o j e c t ( x ̃ r + 1 ) . 这里Project是最近邻token映射，不是简单把数值裁剪到[-1,1]。常规Adam优化器默认下降，若代码直接把Delta作为loss，还要正确处理上升方向；论文写法描述的是maximize。 投影为什么要每轮做 连续向量不一定对应任何真实token。若只报告连续对抗embedding的误差，测试对象已经不是合法token输入。交替连续更新与离散投影，是为了利用局部梯度同时保持实际可执行输入。 论文对最近邻搜索的具体索引实现、两侧不同embedding表如何共享搜索表示等细节没有在当前稿件中完全展开，本站不编造。它说明Stage 2固定配置并加载Stage 1峰值时刻的两侧checkpoint。 一个重要归因边界 两侧checkpoint来自已经分歧的训练轨迹，并非保证参数完全相同。因此Stage 2的偏差包含既有状态差异与新输入的共同作用，不等同于“同权重、单算子local error最大化”。面试时应按论文定义表述，不把更强结论加进去。 实验怎样证明作用 100轮、步长0.01，对照同checkpoint、同初始输入下100轮随机token mutation。Liger RMSNorm由Stage1的0.00277到Stage2的0.0262，越过tau=0.01。相对Stage1增加约846%；相对随机mutation的0.00298是8.79倍。这两个百分比/倍率的分母不同。 Megatron bias_gelu最终0.979，相对Stage2随机0.301约3.25倍；不是算子运行快3.25倍。某些算子几乎无改进，论文解释其差异梯度很小，这是搜索的局限而不是需要删除的行。 如何读结论 输出是预算内观测到的最大偏差。它支持“输入选择影响数值风险”和“两阶段互补”，不支持“证明全局最坏值”或“优化实现必然训练失败”。","charCount":1056},{"id":"dfuzz-megatron","title":"DFuzz的Megatron案例：近似公式、cast与运算顺序","section":"reliability","summary":"把bias_gelu、bias_dropout、cross_entropy的风险分成不同机制。","prereq":["dfuzz-input","floating-point","tokens-loss"],"sources":["dfuzz"],"tags":["Megatron","bias_gelu","CrossEntropy","DFuzz"],"level":3,"kind":"论文案例","checks":[{"q":"为什么GeLU案例不能只称浮点非结合律？","a":"两条路径采用不同数学近似函数，根因层次不同；对齐变体的控制实验才支持归因。"},{"q":"相同seed是否保证fused/unfused dropout mask相同？","a":"不一定。不同执行路径可能消耗不同RNG序列，需要检查实现与实际随机状态。"}],"lab":null,"raw":"## 真实测试范围\n论文在Megatron-LM的GPT-2上测试9项fusion/optimization，优化开关ON/OFF形成差分对照。最终3项超过tau=0.01：bias_gelu为0.979，bias_dropout为0.222，cross_entropy为0.0698。它们是稿件版本与条件下的loss deviation，不是所有Megatron版本的普遍缺陷断言。\n\n## bias_gelu：数学函数已经不同\n精确形式为 $GeLU(x)=x\\Phi(x)$，Phi是标准正态CDF。融合路径采用tanh近似：\n\n$$\\frac{x}{2}\\left[1+\\tanh\\left(\\sqrt{2/\\pi}(x+0.044715x^3)\\right)\\right].$$\n\n未融合路径使用默认exact GeLU。这个差异不只是有限精度重排，而是algorithmic approximation。论文报告把两边GeLU变体对齐后偏差降为0，支持将此案例归因于函数形式差异；“exact”也不是无限精度的实数实现。\n\n## cross_entropy：额外精度转换\nCross entropy对logits的梯度为 $p_i-1[i=y]$。论文指出对应fused backward对gradient硬编码BF16 cast，而unfused保留native dtype。额外downcast改变后续训练数值，不能只用“fusion减少launch”描述开关的全部行为。\n\n这也解释为什么你的Qwen优化需要记录compute、storage、accumulation与communication dtype，而不只标一个BF16。\n\n## bias_dropout：顺序和随机性要分开\n该fusion将bias add、dropout、residual组合。论文归为运算重排引入的舍入差异。教学上，Dropout mask若为M，输出可写为 $M\\odot(x+b)/(1-p)+residual$。不同中间cast或加法顺序可能不同。\n\n做因果分析还要控制RNG。相同seed不必然保证不同融合路径消耗同样随机数；需检查实际mask/随机状态。当前论文不是完整RNG审计代码，本站不声称这一步已经独立复核。\n\n## 三类“错误”的措辞\n数值重排是同一数学目标的有限精度差异；近似是函数改变；实现缺陷如漏loss项则是公式不匹配。论文的额外LLM-generated baseline错误包括SimPO漏NLL、ORPO归约方式与TVD reduction不一致，这些发生在参考baseline中，不应计为三个训练框架都被发现了这些生产bug。\n\n44项中16项超阈值、其中12项此前未记录，是论文定义下的数值风险发现。它们不能与DeepOpFuzz的54个silent compiler bugs直接相加成一个统一“70多个bug”指标。\n","html":"\u003ch2 id=\"h01\">真实测试范围\u003c/h2>\n\u003cp>论文在Megatron-LM的GPT-2上测试9项fusion/optimization，优化开关ON/OFF形成差分对照。最终3项超过tau=0.01：bias_gelu为0.979，bias_dropout为0.222，cross_entropy为0.0698。它们是稿件版本与条件下的loss deviation，不是所有Megatron版本的普遍缺陷断言。\u003c/p>\n\u003ch2 id=\"h02\">bias_gelu：数学函数已经不同\u003c/h2>\n\u003cp>精确形式为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>U\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>Φ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">GeLU(x)=x\\Phi(x)\u003c/annotation>\u003c/semantics>\u003c/math>，Phi是标准正态CDF。融合路径采用tanh近似：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmo>tanh\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>/\u003c/mi>\u003cmi>π\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>0.044715\u003c/mn>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{x}{2}\\left[1+\\tanh\\left(\\sqrt{2/\\pi}(x+0.044715x^3)\\right)\\right].\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>未融合路径使用默认exact GeLU。这个差异不只是有限精度重排，而是algorithmic approximation。论文报告把两边GeLU变体对齐后偏差降为0，支持将此案例归因于函数形式差异；“exact”也不是无限精度的实数实现。\u003c/p>\n\u003ch2 id=\"h03\">cross_entropy：额外精度转换\u003c/h2>\n\u003cp>Cross entropy对logits的梯度为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">p_i-1[i=y]\u003c/annotation>\u003c/semantics>\u003c/math>。论文指出对应fused backward对gradient硬编码BF16 cast，而unfused保留native dtype。额外downcast改变后续训练数值，不能只用“fusion减少launch”描述开关的全部行为。\u003c/p>\n\u003cp>这也解释为什么你的Qwen优化需要记录compute、storage、accumulation与communication dtype，而不只标一个BF16。\u003c/p>\n\u003ch2 id=\"h04\">bias_dropout：顺序和随机性要分开\u003c/h2>\n\u003cp>该fusion将bias add、dropout、residual组合。论文归为运算重排引入的舍入差异。教学上，Dropout mask若为M，输出可写为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>⊙\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>/\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>u\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">M\\odot(x+b)/(1-p)+residual\u003c/annotation>\u003c/semantics>\u003c/math>。不同中间cast或加法顺序可能不同。\u003c/p>\n\u003cp>做因果分析还要控制RNG。相同seed不必然保证不同融合路径消耗同样随机数；需检查实际mask/随机状态。当前论文不是完整RNG审计代码，本站不声称这一步已经独立复核。\u003c/p>\n\u003ch2 id=\"h05\">三类“错误”的措辞\u003c/h2>\n\u003cp>数值重排是同一数学目标的有限精度差异；近似是函数改变；实现缺陷如漏loss项则是公式不匹配。论文的额外LLM-generated baseline错误包括SimPO漏NLL、ORPO归约方式与TVD reduction不一致，这些发生在参考baseline中，不应计为三个训练框架都被发现了这些生产bug。\u003c/p>\n\u003cp>44项中16项超阈值、其中12项此前未记录，是论文定义下的数值风险发现。它们不能与DeepOpFuzz的54个silent compiler bugs直接相加成一个统一“70多个bug”指标。\u003c/p>\n","toc":[{"id":"h01","title":"真实测试范围","level":2},{"id":"h02","title":"bias_gelu：数学函数已经不同","level":2},{"id":"h03","title":"cross_entropy：额外精度转换","level":2},{"id":"h04","title":"bias_dropout：顺序和随机性要分开","level":2},{"id":"h05","title":"三类“错误”的措辞","level":2}],"plain":"真实测试范围 论文在Megatron-LM的GPT-2上测试9项fusion/optimization，优化开关ON/OFF形成差分对照。最终3项超过tau=0.01：bias_gelu为0.979，bias_dropout为0.222，cross_entropy为0.0698。它们是稿件版本与条件下的loss deviation，不是所有Megatron版本的普遍缺陷断言。 bias_gelu：数学函数已经不同 精确形式为 G e L U ( x ) = x Φ ( x ) ，Phi是标准正态CDF。融合路径采用tanh近似： x 2 [ 1 + tanh ( 2 / π ( x + 0.044715 x 3 ) ) ] . 未融合路径使用默认exact GeLU。这个差异不只是有限精度重排，而是algorithmic approximation。论文报告把两边GeLU变体对齐后偏差降为0，支持将此案例归因于函数形式差异；“exact”也不是无限精度的实数实现。 cross_entropy：额外精度转换 Cross entropy对logits的梯度为 p i − 1 [ i = y ] 。论文指出对应fused backward对gradient硬编码BF16 cast，而unfused保留native dtype。额外downcast改变后续训练数值，不能只用“fusion减少launch”描述开关的全部行为。 这也解释为什么你的Qwen优化需要记录compute、storage、accumulation与communication dtype，而不只标一个BF16。 bias_dropout：顺序和随机性要分开 该fusion将bias add、dropout、residual组合。论文归为运算重排引入的舍入差异。教学上，Dropout mask若为M，输出可写为 M ⊙ ( x + b ) / ( 1 − p ) + r e s i d u a l 。不同中间cast或加法顺序可能不同。 做因果分析还要控制RNG。相同seed不必然保证不同融合路径消耗同样随机数；需检查实际mask/随机状态。当前论文不是完整RNG审计代码，本站不声称这一步已经独立复核。 三类“错误”的措辞 数值重排是同一数学目标的有限精度差异；近似是函数改变；实现缺陷如漏loss项则是公式不匹配。论文的额外LLM-generated baseline错误包括SimPO漏NLL、ORPO归约方式与TVD reduction不一致，这些发生在参考baseline中，不应计为三个训练框架都被发现了这些生产bug。 44项中16项超阈值、其中12项此前未记录，是论文定义下的数值风险发现。它们不能与DeepOpFuzz的54个silent compiler bugs直接相加成一个统一“70多个bug”指标。","charCount":1115},{"id":"deepop-method","title":"DeepOpFuzz：Operation Target → Artifact → Oracle","section":"reliability","summary":"从reachability与observability组织测试，并解释目标未命中也要验证。","prereq":["inductor","triton-codegen","oracles"],"sources":["deepop","artifact-repro"],"tags":["DeepOpFuzz","operation target","artifact","reachability"],"level":3,"kind":"论文解读","checks":[{"q":"没命中目标是否跳过oracle？","a":"不跳过。论文明确oracles独立于target命中派发，非目标路径也可能暴露bug。"},{"q":"kernel fingerprint数可直接叫编译器coverage吗？","a":"不能。它是生成产物的诊断信号，不能保证对应独立语义路径或完整代码覆盖。"}],"lab":null,"raw":"## 为什么随机graph不够\n同一个pool→flatten→sum，在不同channel、stride、dtype或autograd context下，可能产生不同reduction artifact。Operator出现过，不代表目标schedule或融合被执行；pass运行过，也不代表最终构造了目标kernel。\n\n论文将问题拆成reachability和observability。前者问“怎样到达特定编译产物”，后者问“它错了，哪个检查能看到”。forward-only检查不一定发现gradient或metadata问题。\n\n## 目标如何表达\nOperation target包含进入路径的entry、具体编译条件与operator composition约束。entry可能是操作族或执行上下文；condition包括shape、dtype、layout、device与配置；composition说明依赖关系。它还需要matcher说明怎样从artifact判断命中。\n\n\u003cdiv class=\"flow\">\u003cspan>选低频target\u003c/span>\u003cspan>构造程序与条件\u003c/span>\u003cspan>编译/执行\u003c/span>\u003cspan>观察artifact\u003c/span>\u003cspan>更新hit\u003c/span>\u003cspan>执行并验证oracles\u003c/span>\u003c/div>\n\n## 观察什么才算反馈\n论文的PyTorch实现从Triton heuristic selector、split-scan与extern dispatch等内部源头构建目标，用delegating wrapper记录heuristic trace，观察fused patterns、extern variants与kernel-name hashes。它们是诊断和探索信号，不是严格代码覆盖率。\n\n目标构建使用compiler source，不用评测bug答案或oracle结果来反向制作目标，以避免evaluation leakage。测试工具当然可能受手写目标taxonomy的覆盖范围限制。\n\n## 一个容易画错的箭头\n**目标没命中也要执行适用oracle。** 论文明确oracle dispatch不依赖target hit，因为偏离目标的程序仍可能暴露其他失败。若把流程写成“命中才检查”，会漏掉论文实际设计。\n\n每次候选失败需要fresh-process复测、dtype-aware数值筛查、nondeterminism控制、minimization与去重。matcher可能只看可见artifact的一部分，因此hit不等于已经覆盖某operation内部全部状态。\n\n## 从PyTorch到其他栈\nTensorFlow/XLA观察optimized HLO与fusion信息；IREE/TVM是portability case studies，不能说四个栈都有完全相同深度的instrumentation。MLIR operation与论文operation的测试抽象也不是同一名词定义。\n\n## 项目重要性\n方法把测试目标从“生成很多source程序”推进到“在具体条件下构造并核验编译选择”。它与你手写Triton优化互补：前者质疑自动生成执行路径是否正确，后者设计并验证特定执行路径是否更高效。\n","html":"\u003ch2 id=\"h01\">为什么随机graph不够\u003c/h2>\n\u003cp>同一个pool→flatten→sum，在不同channel、stride、dtype或autograd context下，可能产生不同reduction artifact。Operator出现过，不代表目标schedule或融合被执行；pass运行过，也不代表最终构造了目标kernel。\u003c/p>\n\u003cp>论文将问题拆成reachability和observability。前者问“怎样到达特定编译产物”，后者问“它错了，哪个检查能看到”。forward-only检查不一定发现gradient或metadata问题。\u003c/p>\n\u003ch2 id=\"h02\">目标如何表达\u003c/h2>\n\u003cp>Operation target包含进入路径的entry、具体编译条件与operator composition约束。entry可能是操作族或执行上下文；condition包括shape、dtype、layout、device与配置；composition说明依赖关系。它还需要matcher说明怎样从artifact判断命中。\u003c/p>\n\u003cdiv class=\"flow\">\n\u003cspan>选低频target\u003c/span>\u003cspan>构造程序与条件\u003c/span>\u003cspan>编译/执行\u003c/span>\u003cspan>观察artifact\u003c/span>\u003cspan>更新hit\u003c/span>\u003cspan>执行并验证oracles\u003c/ me hashes。它们是诊断和探索信号，不是严格代码覆盖率。 目标构建使用compiler source，不用评测bug答案或oracle结果来反向制作目标，以避免evaluation leakage。测试工具当然可能受手写目标taxonomy的覆盖范围限制。 一个容易画错的箭头 目标没命中也要执行适用oracle。 论文明确oracle dispatch不依赖target hit，因为偏离目标的程序仍可能暴露其他失败。若把流程写成“命中才检查”，会漏掉论文实际设计。 每次候选失败需要fresh-process复测、dtype-aware数值筛查、nondeterminism控制、minimization与去重。matcher可能只看可见artifact的一部分，因此hit不等于已经覆盖某operation内部全部状态。 从PyTorch到其他栈 TensorFlow/XLA观察optimized HLO与fusion信息；IREE/TVM是portability case studies，不能说四个栈都有完全相同深度的instrumentation。MLIR operation与论文operation的测试抽象也不是同一名词定义。 项目重要性 方法把测试目标从“生成很多source程序”推进到“在具体条件下构造并核验编译选择”。它与你手写Triton优化互补：前者质疑自动生成执行路径是否正确，后者设计并验证特定执行路径是否更高效。","charCount":1241},{"id":"pool-bug","title":"案例复盘：3185与3200，怎样定位错误的Batch Stride","section":"reliability","summary":"从每个batch的内存范围推导症状，并说明隔离补丁能证明什么。","prereq":["tensor-layout","compiler-debug","deepop-method"],"sources":["bug-pool","deepop"],"tags":["stride bug","Inductor","Triton","minimized repro"],"level":3,"kind":"源码与论文案例","checks":[{"q":"为什么batch0正确是有价值的诊断线索？","a":"outer stride乘以batch index；index为0时错误值被消掉，而后续batch发生系统性偏移。"},{"q":"为什么r的mask正确还可能越界？","a":"mask只约束行内索引，不约束已经算错的base地址。"}],"lab":null,"raw":"## 程序为什么本来很简单\n```python\ndef program(x):\n    y = torch.nn.functional.adaptive_avg_pool2d(x, 7)\n    return y.flatten(1).sum(dim=-1)\n```\n\n以pool输出 `[B,65,7,7]` 为例，一个batch有65×7×7=3185个元素。连续buffer的batch stride应该是3185，flatten只是把后三维解释为一维。\n\n## 错误地址如何产生症状\n报告中的生成reduction kernel使用 `r + 3200*b`，而不是 `r + 3185*b`。3200等于3185向上对齐到32的倍数。**逻辑归约的tile对齐长度不可以冒充真实buffer stride。**\n\nb=0时，错误stride乘以0，地址恰好相同。b=1时，实际有效数据从3185开始，而kernel从3200开始，偏15个元素。若B=2，最后一些读取还会超过逻辑buffer有效范围；实际越界是否崩溃受分配与相邻内存影响，silent结果也可能波动。\n\n## 为什么mask没救\n`r \u003c 3185`只验证行内逻辑r的范围；若base本来错误，base+r仍可能越界。局部tail mask不能修复错误的外层寻址。\n\n## 证据链\n仓库给出eager/compiled差异、不同batch与shape的规律、FP64复现、生成代码中的buffer stride和索引表达式。再把相同Triton kernel抽出来，在相同输入buffer和launch条件下只改3200→3185，误差回到正常浮点量级。\n\n这有力支持错误机制位于生成索引表达式，而不是GPU随机算错。它不等于已经审计所有上游layout来源，也不代表当前最新版本仍然受影响；状态要按报告与上游issue日期。\n\n## 不要沿用过度简化的描述\n仓库case展示pool输出buffer以及消费它的fused view/reduction kernel，不能自动说pool+flatten+sum三个阶段全部在同一个kernel内。论文概念示例与具体artifact分解需分别描述。\n\n较小C=65是否选择故障reduction路径依赖GPU与版本。大的复现shape有助于触发相应路径，但不能仅凭经验宣称在所有架构都必然选择相同schedule。\n\n## 和fuzzing设计的关系\n需要B>1才看出outer stride偏移；需要对齐边界与特定schedule才命中。它说明编译条件与artifact观测是重要搜索维度，但不证明所有graph fuzzing永远找不到这个bug。\n","html":"\u003ch2 id=\"h01\">程序为什么本来很简单\u003c/h2>\n\u003cpre class=\"python\">\u003ccode>def program(x):\n    y = torch.nn.functional.adaptive_avg_pool2d(x, 7)\n    return y.flatten(1).sum(dim=-1)\u003c/code>\u003c/pre>\n\u003cp>以pool输出 \u003ccode>[B,65,7,7]\u003c/code> 为例，一个batch有65×7×7=3185个元素。连续buffer的batch stride应该是3185，flatten只是把后三维解释为一维。\u003c/p>\n\u003ch2 id=\"h02\">错误地址如何产生症状\u003c/h2>\n\u003cp>报告中的生成reduction kernel使用 \u003ccode>r + 3200*b\u003c/code>，而不是 \u003ccode>r + 3185*b\u003c/code>。3200等于3185向上对齐到32的倍数。\u003cstrong>逻辑归约的tile对齐长度不可以冒充真实buffer stride。\u003c/strong>\u003c/p>\n\u003cp>b=0时，错误stride乘以0，地址恰好相同。b=1时，实际有效数据从3185开始，而kernel从3200开始，偏15个元素。若B=2，最后一些读取还会超过逻辑buffer有效范围；实际越界是否崩溃受分配与相邻内存影响，silent结果也可能波动。\u003c/p>\n\u003ch2 id=\"h03\">为什么mask没救\u003c/h2>\n\u003cp>\u003ccode>r &lt; 3185\u003c/code>只验证行内逻辑r的范围；若base本来错误，base+r仍可能越界。局部tail mask不能修复错误的外层寻址。\u003c/p>\n\u003ch2 id=\"h04\">证据链\u003c/h2>\n\u003cp>仓库给出eager/compiled差异、不同batch与shape的规律、FP64复现、生成代码中的buffer stride和索引表达式。再把相同Triton kernel抽出来，在相同输入buffer和launch条件下只改3200→3185，误差回到正常浮点量级。\u003c/p>\n\u003cp>这有力支持错误机制位于生成索引表达式，而不是GPU随机算错。它不等于已经审计所有上游layout来源，也不代表当前最新版本仍然受影响；状态要按报告与上游issue日期。\u003c/p>\n\u003ch2 id=\"h05\">不要沿用过度简化的描述\u003c/h2>\n\u003cp>仓库case展示pool输出buffer以及消费它的fused view/reduction kernel，不能自动说pool+flatten+sum三个阶段全部在同一个kernel内。论文概念示例与具体artifact分解需分别描述。\u003c/p>\n\u003cp>较小C=65是否选择故障reduction路径依赖GPU与版本。大的复现shape有助于触发相应路径，但不能仅凭经验宣称在所有架构都必然选择相同schedule。\u003c/p>\n\u003ch2 id=\"h06\">和fuzzing设计的关系\u003c/h2>\n\u003cp>需要B&gt;1才看出outer stride偏移；需要对齐边界与特定schedule才命中。它说明编译条件与artifact观测是重要搜索维度，但不证明所有graph fuzzing永远找不到这个bug。\u003c/p>\n","toc":[{"id":"h01","title":"程序为什么本来很简单","level":2},{"id":"h02","title":"错误地址如何产生症状","level":2},{"id":"h03","title":"为什么mask没救","level":2},{"id":"h04","title":"证据链","level":2},{"id":"h05","title":"不要沿用过度简化的描述","level":2},{"id":"h06","title":"和fuzzing设计的关系","level":2}],"plain":"程序为什么本来很简单 def program(x): y = torch.nn.functional.adaptive_avg_pool2d(x, 7) return y.flatten(1).sum(dim=-1) 以pool输出 [B,65,7,7] 为例，一个batch有65×7×7=3185个元素。连续buffer的batch stride应该是3185，flatten只是把后三维解释为一维。 错误地址如何产生症状 报告中的生成reduction kernel使用 r + 3200*b ，而不是 r + 3185*b 。3200等于3185向上对齐到32的倍数。 逻辑归约的tile对齐长度不可以冒充真实buffer stride。 b=0时，错误stride乘以0，地址恰好相同。b=1时，实际有效数据从3185开始，而kernel从3200开始，偏15个元素。若B=2，最后一些读取还会超过逻辑buffer有效范围；实际越界是否崩溃受分配与相邻内存影响，silent结果也可能波动。 为什么mask没救 r \u003c 3185 只验证行内逻辑r的范围；若base本来错误，base+r仍可能越界。局部tail mask不能修复错误的外层寻址。 证据链 仓库给出eager/compiled差异、不同batch与shape的规律、FP64复现、生成代码中的buffer stride和索引表达式。再把相同Triton kernel抽出来，在相同输入buffer和launch条件下只改3200→3185，误差回到正常浮点量级。 这有力支持错误机制位于生成索引表达式，而不是GPU随机算错。它不等于已经审计所有上游layout来源，也不代表当前最新版本仍然受影响；状态要按报告与上游issue日期。 不要沿用过度简化的描述 仓库case展示pool输出buffer以及消费它的fused view/reduction kernel，不能自动说pool+flatten+sum三个阶段全部在同一个kernel内。论文概念示例与具体artifact分解需分别描述。 较小C=65是否选择故障reduction路径依赖GPU与版本。大的复现shape有助于触发相应路径，但不能仅凭经验宣称在所有架构都必然选择相同schedule。 和fuzzing设计的关系 需要B>1才看出outer stride偏移；需要对齐边界与特定schedule才命中。它说明编译条件与artifact观测是重要搜索维度，但不证明所有graph fuzzing永远找不到这个bug。","charCount":1035},{"id":"backward-bug","title":"案例复盘：Forward正确，为什么x.grad全零","section":"reliability","summary":"解析slice_scatter梯度与stride-0 metadata，避免只凭数值比较猜层次。","prereq":["aotautograd","tensor-layout","deepop-method"],"sources":["bug-bwd","deepop"],"tags":["gradient bug","slice_scatter","stride 0","AOTAutograd"],"level":3,"kind":"源码与论文案例","checks":[{"q":"为什么不能仅凭forward一致判定训练编译正确？","a":"反向图包含不同操作、metadata和kernel，可能独立出现错误。"},{"q":"functional输出一定要contiguous吗？","a":"不一定。必须正确表达独立逻辑元素的值与alias语义，而非强制某一种布局。"}],"lab":null,"raw":"## 先独立推导预期梯度\n令x形状 `[4,13,33]`，y为 `[4,6,33]`，把x的dim1前6个位置替换成y，再沿dim1求和。\n\n$$out_{b,h}=\\sum_{i\u003c6}y_{b,i,h}+\\sum_{i\\ge6}x_{b,i,h}.$$\n\n接收上游梯度g[b,h]后：x的前6个位置梯度为0，后7个位置为g；y的每个位置为g。这个解析关系不依赖输入随机值，是比单纯eager对照更强的参考。\n\n## 报告中的错误\n对应Inductor路径forward正常、y.grad正常，却把x.grad变为全0。FP64也有相同结构性错误，说明不能用低精度误差解释。只检查forward的fuzzer会漏掉。\n\n## stride-0从哪来\nsum的backward把 `[B,H]` 上游梯度unsqueeze并expand为 `[B,13,H]`，中间维stride为0。作为broadcast输入，这是合法的；但scatter输出需要不同位置有0或g的数值，不能继续让整维都指向同一物理位置。\n\n报告的AOT metadata仍给slice_scatter输出stride-0。Inductor据此把iteration space从4×13×33折成4×1×33=132，并把dim1索引当成0。判断0是否落在[0,6)为真，最后全写0。\n\n## 控制实验为何有说服力\n把slice换成[5,12)，折叠坐标0不在其中，判断为假，于是所有20个位置都保留g，而预期只有13个。报告对应维度20的案例梯度总和比例为20/13，符合错误机制的预测。\n\n`aot_eager`执行正常，因为真实ATen执行可以物化满足语义的输出，错误注释不一定影响eager结果。不能据此简单说“AOT图完全正确”，更准确是元信息与后端使用方式的交互需要定位。\n\n## 输出必须contiguous吗\n不必。functional输出并非一律要求contiguous；只要layout能忠实表达语义即可。这里问题是有不同值的位置被错误地表示为同一地址。前稿若把修复说成“所有functional op必须contiguous”，会过度泛化。\n\n## 从这个bug得到的方法论\n先写解析梯度，后用backend与metadata缩小范围，再检查generated code；在输入/shape变化下看根因是否预测新症状。梯度值、shape、stride、alias与可继续求导性都属于训练正确性的可能表面，不只是loss一个标量。\n","html":"\u003ch2 id=\"h01\">先独立推导预期梯度\u003c/h2>\n\u003cp>令x形状 \u003ccode>[4,13,33]\u003c/code>，y为 \u003ccode>[4,6,33]\u003c/code>，把x的dim1前6个位置替换成y，再沿dim1求和。\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>o\u003c/mi>\u003cmi>u\u003c/mi>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>≥\u003c/mo>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">out_{b,h}=\\sum_{i&lt;6}y_{b,i,h}+\\sum_{i\\ge6}x_{b,i,h}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>接收上游梯度g[b,h]后：x的前6个位置梯度为0，后7个位置为g；y的每个位置为g。这个解析关系不依赖输入随机值，是比单纯eager对照更强的参考。\u003c/p>\n\u003ch2 id=\"h02\">报告中的错误\u003c/h2>\n\u003cp>对应Inductor路径forward正常、y.grad正常，却把x.grad变为全0。FP64也有相同结构性错误，说明不能用低精度误差解释。只检查forward的fuzzer会漏掉。\u003c/p>\n\u003ch2 id=\"h03\">stride-0从哪来\u003c/h2>\n\u003cp>sum的backward把 \u003ccode>[B,H]\u003c/code> 上游梯度unsqueeze并expand为 \u003ccode>[B,13,H]\u003c/code>，中间维stride为0。作为broadcast输入，这是合法的；但scatter输出需要不同位置有0或g的数值，不能继续让整维都指向同一物理位置。\u003c/p>\n\u003cp>报告的AOT metadata仍给slice_scatter输出stride-0。Inductor据此把iteration space从4×13×33折成4×1×33=132，并把dim1索引当成0。判断0是否落在[0,6)为真，最后全写0。\u003c/p>\n\u003ch2 id=\"h04\">控制实验为何有说服力\u003c/h2>\n\u003cp>把slice换成[5,12)，折叠坐标0不在其中，判断为假，于是所有20个位置都保留g，而预期只有13个。报告对应维度20的案例梯度总和比例为20/13，符合错误机制的预测。\u003c/p>\n\u003cp>\u003ccode>aot_eager\u003c/code>执行正常，因为真实ATen执行可以物化满足语义的输出，错误注释不一定影响eager结果。不能据此简单说“AOT图完全正确”，更准确是元信息与后端使用方式的交互需要定位。\u003c/p>\n\u003ch2 id=\"h05\">输出必须contiguous吗\u003c/h2>\n\u003cp>不必。functional输出并非一律要求contiguous；只要layout能忠实表达语义即可。这里问题是有不同值的位置被错误地表示为同一地址。前稿若把修复说成“所有functional op必须contiguous”，会过度泛化。\u003c/p>\n\u003ch2 id=\"h06\">从这个bug得到的方法论\u003c/h2>\n\u003cp>先写解析梯度，后用backend与metadata缩小范围，再检查generated code；在输入/shape变化下看根因是否预测新症状。梯度值、shape、stride、alias与可继续求导性都属于训练正确性的可能表面，不只是loss一个标量。\u003c/p>\n","toc":[{"id":"h01","title":"先独立推导预期梯度","level":2},{"id":"h02","title":"报告中的错误","level":2},{"id":"h03","title":"stride-0从哪来","level":2},{"id":"h04","title":"控制实验为何有说服力","level":2},{"id":"h05","title":"输出必须contiguous吗","level":2},{"id":"h06","title":"从这个bug得到的方法论","level":2}],"plain":"先独立推导预期梯度 令x形状 [4,13,33] ，y为 [4,6,33] ，把x的dim1前6个位置替换成y，再沿dim1求和。 o u t b , h = ∑ i \u003c 6 y b , i , h + ∑ i ≥ 6 x b , i , h . 接收上游梯度g[b,h]后：x的前6个位置梯度为0，后7个位置为g；y的每个位置为g。这个解析关系不依赖输入随机值，是比单纯eager对照更强的参考。 报告中的错误 对应Inductor路径forward正常、y.grad正常，却把x.grad变为全0。FP64也有相同结构性错误，说明不能用低精度误差解释。只检查forward的fuzzer会漏掉。 stride-0从哪来 sum的backward把 [B,H] 上游梯度unsqueeze并expand为 [B,13,H] ，中间维stride为0。作为broadcast输入，这是合法的；但scatter输出需要不同位置有0或g的数值，不能继续让整维都指向同一物理位置。 报告的AOT metadata仍给slice_scatter输出stride-0。Inductor据此把iteration space从4×13×33折成4×1×33=132，并把dim1索引当成0。判断0是否落在[0,6)为真，最后全写0。 控制实验为何有说服力 把slice换成[5,12)，折叠坐标0不在其中，判断为假，于是所有20个位置都保留g，而预期只有13个。报告对应维度20的案例梯度总和比例为20/13，符合错误机制的预测。 aot_eager 执行正常，因为真实ATen执行可以物化满足语义的输出，错误注释不一定影响eager结果。不能据此简单说“AOT图完全正确”，更准确是元信息与后端使用方式的交互需要定位。 输出必须contiguous吗 不必。functional输出并非一律要求contiguous；只要layout能忠实表达语义即可。这里问题是有不同值的位置被错误地表示为同一地址。前稿若把修复说成“所有functional op必须contiguous”，会过度泛化。 从这个bug得到的方法论 先写解析梯度，后用backend与metadata缩小范围，再检查generated code；在输入/shape变化下看根因是否预测新症状。梯度值、shape、stride、alias与可继续求导性都属于训练正确性的可能表面，不只是loss一个标量。","charCount":972},{"id":"project-qwen","title":"项目档案 · Qwen3-Triton：三条工作流，一套证据规则","section":"projects","summary":"推理、训练与分片分别解释目标、源码、测量范围和未证明的结论。","prereq":["qk-fusion","cuda-graph","adamw","tied-grad","block-fsdp","profiling"],"sources":["qsummary","qresume","qe2e","qstatic","qcompile","qconvergence","qreplication","qfsdp","qdeploy"],"tags":["项目","Qwen3","证据","性能"],"level":3,"kind":"项目证据档案","checks":[{"q":"Qwen项目最适合的三个成果维度是什么？","a":"推理latency、单卡训练step/完整作业成本、多卡全分片功能与容量验证。三者分别有baseline和边界。"},{"q":"面试官问2.8倍是否Triton本身贡献，怎样答？","a":"主要来自static decode+CUDA Graph降低调度开销；packing/direct write等是Graph上的增量，不把全部收益归给kernel。"}],"lab":null,"raw":"## 项目出发点\nQwen模型定义给出数学计算，现有框架选择一种具体执行方式。项目研究不同执行方式能否减少延迟和内存开销，并维持规定的数值契约。按资料，应分成推理性能、单卡训练性能和多卡分片三条工作流，而不是虚构“先失败再顿悟”的研发时间线。\n\n## 工作流一：Attention前处理与Decode runtime\n**问题来自哪里：** Q/K projection后重复进行Norm/RoPE，并有布局转换与特定HF GQA adapter的复制。它们FLOPs少，却可能有中间物化和启动成本。\n\n**选择为什么合理：** per-head norm与RoPE具有连续依赖，head内计算可放入一个program；stride-aware读写避免为了接口整理数据；compact GQA保持原生Flash；固定decode拓扑适合Graph重放。\n\n**实际实现：** `_qk_norm_rope`、`make_attention_forward`、`StaticDecodeCache/Runner`。直接写K/V cache与packed QKV作为独立开关；Graph只捕获decode forward和LM Head。\n\n| 实验层次 | 报告结果 | baseline与范围 |\n|---|---|---|\n| Q布局消融 |55.4→29.1μs；12→4MiB|特定BF16 Q分支，GPU时间及新增峰值分配|\n| QK fusion+compact GQA |decode约25–32%下降|FP16固定配置，相对此前优化路径，非Graph|\n| Static Graph pipeline |约2.4–2.8×|旧优化eager vs Graph组合；prefill+16步|\n| 强compile对照 |B1/S128近似持平|同static cache/Flash/Graph条件；不能复用eager倍率|\n\n**结论边界：** 不替换成熟Flash attention；不是生产服务吞吐；BF16有旧反例；不同阶段和dtype的数据不可相加。\n\n## 工作流二：Optimizer与Autograd数据流\n**问题来自哪里：** 完整训练step含optimizer与共享参数反向流，单kernel最快不等于全作业最快。\n\n**实际实现：** TritonAdamW以native fused AdamW为对照，处理舍入边界；TiedEmbedding合并lookup/head梯度；consume_proxy缩短临时引用生命周期。\n\n| 证据 | 观察 | 不能推导 |\n|---|---|---|\n| 单对完整训练作业 |同验证目标7208→5912s，约18%减少|不是跨种子收敛速度保证|\n| 完整进程 |8320→7682s，约7.7%减少|终点步数不同，不是同工作量kernel倍率|\n| 新强基线稳态step |5.5–6.6%减少，allocated少1.29GiB|不是新的完整收敛实验|\n| 16GiB预算实验 |吞吐12.7–13.4%提升，microbatch2→4|仅README报告短程budget结果，原始artifacts未公开|\n\n**负结果同样重要：** S2048内存回退、训练compact GQA梯度gate失败、训练Graph在更强基线下收益不足、量化生成分歧。它们限定采用范围，而不是说明相关算法普遍无效。\n\n## 工作流三：Block-level full sharding\n**问题来自哪里：** 8.19B模型BF16权重约15.26GiB，但FP32 master/gradient/m/v可达约122GiB，还不含activation。DDP复制状态不能解决每卡容量。\n\n**实际实现：** CPU初始化、本地FP32 shard、BF16 all-gather、functional_call执行block、backward重算、FP32 reduce-scatter SUM与本地平均，最后只更新本地shard。NCCL负责跨卡，Triton负责本地cast/scale。\n\n**验证：** 四张A6000，真实DeepSeek-R1-0528-Qwen3-8B，S512、每卡B1、三次全参数更新；每卡allocated峰值35.7568GiB；HF导出重载有限测试logits最大差0。第一层Q projection约18.63%BF16元素变化说明确实更新。\n\n**边界：** 同步、单节点、无overlap；不是比官方FSDP快的benchmark；未验证真实8B完整optimizer恢复；不是原版Qwen3-8B，也不证明收敛或长上下文质量。\n\n## 学习依赖图与最终呈现\n推理线：GEMM成本→Norm/RoPE依赖→layout/fusion→GQA→Graph→消融。训练线：梯度→AdamW状态→数值政策→共享梯度→生命周期→完整step与作业。分片线：显存账本→collectives→unit sharding→recompute→恢复/导出。\n\n面试介绍应先选与岗位最相关的一条，再用一个源码点和一组同口径数据展开。不要把全部结果压成“用Triton把Qwen加速2.8倍并训练8B”，那会隐藏真正贡献与比较边界。\n","html":"\u003ch2 id=\"h01\">项目出发点\u003c/h2>\n\u003cp>Qwen模型定义给出数学计算，现有框架选择一种具体执行方式。项目研究不同执行方式能否减少延迟和内存开销，并维持规定的数值契约。按资料，应分成推理性能、单卡训练性能和多卡分片三条工作流，而不是虚构“先失败再顿悟”的研发时间线。\u003c/p>\n\u003ch2 id=\"h02\">工作流一：Attention前处理与Decode runtime\u003c/h2>\n\u003cp>\u003cstrong>问题来自哪里：\u003c/strong> Q/K projection后重复进行Norm/RoPE，并有布局转换与特定HF GQA adapter的复制。它们FLOPs少，却可能有中间物化和启动成本。\u003c/p>\n\u003cp>\u003cstrong>选择为什么合理：\u003c/strong> per-head norm与RoPE具有连续依赖，head内计算可放入一个program；stride-aware读写避免为了接口整理数据；compact GQA保持原生Flash；固定decode拓扑适合Graph重放。\u003c/p>\n\u003cp>\u003cstrong>实际实现：\u003c/strong> \u003ccode>_qk_norm_rope\u003c/code>、\u003ccode>make_attention_forward\u003c/code>、\u003ccode>StaticDecodeCache/Runner\u003c/code>。直接写K/V cache与packed QKV作为独立开关；Graph只捕获decode forward和LM Head。\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>实验层次\u003c/th>\n\u003cth>报告结果\u003c/th>\n\u003cth>baseline与范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Q布局消融\u003c/td>\n\u003ctd>55.4→29.1μs；12→4MiB\u003c/td>\n\u003ctd>特定BF16 Q分支，GPU时间及新增峰值分配\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>QK fusion+compact GQA\u003c/td>\n\u003ctd>decode约25–32%下降\u003c/td>\n\u003ctd>FP16固定配置，相对此前优化路径，非Graph\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Static Graph pipeline\u003c/td>\n\u003ctd>约2.4–2.8×\u003c/td>\n\u003ctd>旧优化eager vs Graph组合；prefill+16步\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>强compile对照\u003c/td>\n\u003ctd>B1/S128近似持平\u003c/td>\n\u003ctd>同static cache/Flash/Graph条件；不能复用eager倍率\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>结论边界：\u003c/strong> 不替换成熟Flash attention；不是生产服务吞吐；BF16有旧反例；不同阶段和dtype的数据不可相加。\u003c/p>\n\u003ch2 id=\"h03\">工作流二：Optimizer与Autograd数据流\u003c/h2>\n\u003cp>\u003cstrong>问题来自哪里：\u003c/strong> 完整训练step含optimizer与共享参数反向流，单kernel最快不等于全作业最快。\u003c/p>\n\u003cp>\u003cstrong>实际实现：\u003c/strong> TritonAdamW以native fused AdamW为对照，处理舍入边界；TiedEmbedding合并lookup/head梯度；consume_proxy缩短临时引用生命周期。\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>证据\u003c/th>\n\u003cth>观察\u003c/th>\n\u003cth>不能推导\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>单对完整训练作业\u003c/td>\n\u003ctd>同验证目标7208→5912s，约18%减少\u003c/td>\n\u003ctd>不是跨种子收敛速度保证\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>完整进程\u003c/td>\n\u003ctd>8320→7682s，约7.7%减少\u003c/td>\n\u003ctd>终点步数不同，不是同工作量kernel倍率\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>新强基线稳态step\u003c/td>\n\u003ctd>5.5–6.6%减少，allocated少1.29GiB\u003c/td>\n\u003ctd>不是新的完整收敛实验\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>16GiB预算实验\u003c/td>\n\u003ctd>吞吐12.7–13.4%提升，microbatch2→4\u003c/td>\n\u003ctd>仅README报告短程budget结果，原始artifacts未公开\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>负结果同样重要：\u003c/strong> S2048内存回退、训练compact GQA梯度gate失败、训练Graph在更强基线下收益不足、量化生成分歧。它们限定采用范围，而不是说明相关算法普遍无效。\u003c/p>\n\u003ch2 id=\"h04\">工作流三：Block-level full sharding\u003c/h2>\n\u003cp>\u003cstrong>问题来自哪里：\u003c/strong> 8.19B模型BF16权重约15.26GiB，但FP32 master/gradient/m/v可达约122GiB，还不含activation。DDP复制状态不能解决每卡容量。\u003c/p>\n\u003cp>\u003cstrong>实际实现：\u003c/strong> CPU初始化、本地FP32 shard、BF16 all-gather、functional_call执行block、backward重算、FP32 reduce-scatter SUM与本地平均，最后只更新本地shard。NCCL负责跨卡，Triton负责本地cast/scale。\u003c/p>\n\u003cp>\u003cstrong>验证：\u003c/strong> 四张A6000，真实DeepSeek-R1-0528-Qwen3-8B，S512、每卡B1、三次全参数更新；每卡allocated峰值35.7568GiB；HF导出重载有限测试logits最大差0。第一层Q projection约18.63%BF16元素变化说明确实更新。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong> 同步、单节点、无overlap；不是比官方FSDP快的benchmark；未验证真实8B完整optimizer恢复；不是原版Qwen3-8B，也不证明收敛或长上下文质量。\u003c/p>\n\u003ch2 id=\"h05\">学习依赖图与最终呈现\u003c/h2>\n\u003cp>推理线：GEMM成本→Norm/RoPE依赖→layout/fusion→GQA→Graph→消融。训练线：梯度→AdamW状态→数值政策→共享梯度→生命周期→完整step与作业。分片线：显存账本→collectives→unit sharding→recompute→恢复/导出。\u003c/p>\n\u003cp>面试介绍应先选与岗位最相关的一条，再用一个源码点和一组同口径数据展开。不要把全部结果压成“用Triton把Qwen加速2.8倍并训练8B”，那会隐藏真正贡献与比较边界。\u003c/p>\n","toc":[{"id":"h01","title":"项目出发点","level":2},{"id":"h02","title":"工作流一：Attention前处理与Decode runtime","level":2},{"id":"h03","title":"工作流二：Optimizer与Autograd数据流","level":2},{"id":"h04","title":"工作流三：Block-level full sharding","level":2},{"id":"h05","title":"学习依赖图与最终呈现","level":2}],"plain":"项目出发点 Qwen模型定义给出数学计算，现有框架选择一种具体执行方式。项目研究不同执行方式能否减少延迟和内存开销，并维持规定的数值契约。按资料，应分成推理性能、单卡训练性能和多卡分片三条工作流，而不是虚构“先失败再顿悟”的研发时间线。 工作流一：Attention前处理与Decode runtime 问题来自哪里： Q/K projection后重复进行Norm/RoPE，并有布局转换与特定HF GQA adapter的复制。它们FLOPs少，却可能有中间物化和启动成本。 选择为什么合理： per-head norm与RoPE具有连续依赖，head内计算可放入一个program；stride-aware读写避免为了接口整理数据；compact GQA保持原生Flash；固定decode拓扑适合Graph重放。 实际实现： _qk_norm_rope 、 make_attention_forward 、 StaticDecodeCache/Runner 。直接写K/V cache与packed QKV作为独立开关；Graph只捕获decode forward和LM Head。 实验层次 报告结果 baseline与范围 Q布局消融 55.4→29.1μs；12→4MiB 特定BF16 Q分支，GPU时间及新增峰值分配 QK fusion+compact GQA decode约25–32%下降 FP16固定配置，相对此前优化路径，非Graph Static Graph pipeline 约2.4–2.8× 旧优化eager vs Graph组合；prefill+16步 强compile对照 B1/S128近似持平 同static cache/Flash/Graph条件；不能复用eager倍率 结论边界： 不替换成熟Flash attention；不是生产服务吞吐；BF16有旧反例；不同阶段和dtype的数据不可相加。 工作流二：Optimizer与Autograd数据流 问题来自哪里： 完整训练step含optimizer与共享参数反向流，单kernel最快不等于全作业最快。 实际实现： TritonAdamW以native fused AdamW为对照，处理舍入边界；TiedEmbedding合并lookup/head梯度；consume_proxy缩短临时引用生命周期。 证据 观察 不能推导 单对完整训练作业 同验证目标7208→5912s，约18%减少 不是跨种子收敛速度保证 完整进程 8320→7682s，约7.7%减少 终点步数不同，不是同工作量kernel倍率 新强基线稳态step 5.5–6.6%减少，allocated少1.29GiB 不是新的完整收敛实验 16GiB预算实验 吞吐12.7–13.4%提升，microbatch2→4 仅README报告短程budget结果，原始artifacts未公开 负结果同样重要： S2048内存回退、训练compact GQA梯度gate失败、训练Graph在更强基线下收益不足、量化生成分歧。它们限定采用范围，而不是说明相关算法普遍无效。 工作流三：Block-level full sharding 问题来自哪里： 8.19B模型BF16权重约15.26GiB，但FP32 master/gradient/m/v可达约122GiB，还不含activation。DDP复制状态不能解决每卡容量。 实际实现： CPU初始化、本地FP32 shard、BF16 all-gather、functional_call执行block、backward重算、FP32 reduce-scatter SUM与本地平均，最后只更新本地shard。NCCL负责跨卡，Triton负责本地cast/scale。 验证： 四张A6000，真实DeepSeek-R1-0528-Qwen3-8B，S512、每卡B1、三次全参数更新；每卡allocated峰值35.7568GiB；HF导出重载有限测试logits最大差0。第一层Q projection约18.63%BF16元素变化说明确实更新。 边界： 同步、单节点、无overlap；不是比官方FSDP快的benchmark；未验证真实8B完整optimizer恢复；不是原版Qwen3-8B，也不证明收敛或长上下文质量。 学习依赖图与最终呈现 推理线：GEMM成本→Norm/RoPE依赖→layout/fusion→GQA→Graph→消融。训练线：梯度→AdamW状态→数值政策→共享梯度→生命周期→完整step与作业。分片线：显存账本→collectives→unit sharding→recompute→恢复/导出。 面试介绍应先选与岗位最相关的一条，再用一个源码点和一组同口径数据展开。不要把全部结果压成“用Triton把Qwen加速2.8倍并训练8B”，那会隐藏真正贡献与比较边界。","charCount":1970},{"id":"project-dfuzz","title":"项目档案 · DFuzz：数值风险、搜索收益与根因证据","section":"projects","summary":"用论文页码追溯44/16/12、Megatron 3/9与两阶段收益。","prereq":["dfuzz-config","dfuzz-input","dfuzz-megatron"],"sources":["dfuzz"],"tags":["项目","DFuzz","Megatron","论文"],"level":3,"kind":"项目证据档案","checks":[{"q":"44项优化是否均独立实现了一个GPU kernel？","a":"不是必然。表中有融合、compile和组合开关等测试对象，应该沿论文的operator optimization口径解释。"},{"q":"哪些结论不能从本文直接推出？","a":"全局最坏误差、所有低于阈值方案安全、每个超阈值都是代码缺陷、最终任务质量必然下降。"}],"lab":null,"raw":"## 研究对象与动机\n研究对象是LLM训练框架中的operator optimizations，不是泛泛的API异常。一个fusion可能改变求和顺序、cast政策或数学近似，单步差异小仍可能让后续参数与moment状态偏离。论文用RMSNorm训练轨迹和不同配置的巨大偏差跨度支持多步、跨条件测试的必要性。\n\n这些观察说明风险可能存在，不证明所有差异必然是有害bias或训练失败。本文按照稿件自身的trajectory metric解释结果。\n\n## 方法为什么是两阶段\n配置空间混合离散/连续变量，合法性约束复杂，多步评价昂贵，因此Stage1用GA。输入是离散token组合，Stage2借连续embedding梯度导航，再最近邻投影回合法token。两个阶段利用不同搜索结构，不是重复做两次随机测试。\n\n论文p3的主要objective是loss轨迹最大绝对差；p5给Megatron每配置200步、20种群、5代与Nsys辅助，Liger/Unsloth使用不同N/P、lambda=0。Stage2固定峰值checkpoint，100轮搜索与同预算随机token变异对照。\n\n## 结果按分母排列\n| 结论 | 数值 | 分母与解释 |\n|---|---|---|\n| 测试范围 |44项|Megatron9、Liger25、Unsloth10|\n| 超过tau |16项|3/9、7/25、6/10；tau=0.01|\n| 此前未记录 |12项|超阈值中的未文档化差异，非自动等价12个代码缺陷|\n| Stage1最大收益 |13.33×|超阈值配置命中率vs随机，不是训练速度|\n| Stage2最大收益 |8.79×|Liger RMSNorm偏差vs随机输入变异|\n\n这些数字来自上传稿件p5–8。不同实验的“倍数”不能放到同一加速图中。\n\n## 最有解释力的案例\nMegatron bias_gelu最终loss差0.979：融合使用tanh GeLU，reference为默认exact形式。对齐变体后的控制实验支持公式差异归因。Megatron cross_entropy最终0.0698：对应backward额外BF16 cast。bias_dropout最终0.222：论文归于融合运算顺序差异。\n\n额外发现的LLM-generated baseline错误（SimPO/ORPO/TVD）是baseline构造问题，不能直接写成这些生产框架的同名operator都有相同缺陷，也不能无条件和16项重复相加。\n\n## 必须保留的资料局限\n稿件将tau作为经验显著性阈值，且讨论了搜索不完备。关于“BF16噪声通常小于1e−6”的文字不能当通用浮点精度界；数值误差依赖尺度、算子和轨迹，本站不以其作为数学保证。\n\n方法概述和实验设置对GA选择方式的细节表达不完全一致；Stage2对两侧embedding/状态的完整实现细节没有全部展开。当前没有DFuzz专项源码与原始日志的完整独立审计，因此不填造这些空缺。\n\n## 如何呈现贡献\n可以说：构建训练配置与合法输入的两阶段差分搜索，跨三个框架系统量化优化引入的loss轨迹偏差，并通过源代码与控制实验区分重排、cast和近似。不要改写为“优化Megatron的TP通信”或“训练速度提升13.33倍”。\n\n论文作为用户上传稿件提供依据，网站不标成已正式出版或已录用。原PDF未打包，避免未经确认公开研究材料。\n","html":"\u003ch2 id=\"h01\">研究对象与动机\u003c/h2>\n\u003cp>研究对象是LLM训练框架中的operator optimizations，不是泛泛的API异常。一个fusion可能改变求和顺序、cast政策或数学近似，单步差异小仍可能让后续参数与moment状态偏离。论文用RMSNorm训练轨迹和不同配置的巨大偏差跨度支持多步、跨条件测试的必要性。\u003c/p>\n\u003cp>这些观察说明风险可能存在，不证明所有差异必然是有害bias或训练失败。本文按照稿件自身的trajectory metric解释结果。\u003c/p>\n\u003ch2 id=\"h02\">方法为什么是两阶段\u003c/h2>\n\u003cp>配置空间混合离散/连续变量，合法性约束复杂，多步评价昂贵，因此Stage1用GA。输入是离散token组合，Stage2借连续embedding梯度导航，再最近邻投影回合法token。两个阶段利用不同搜索结构，不是重复做两次随机测试。\u003c/p>\n\u003cp>论文p3的主要objective是loss轨迹最大绝对差；p5给Megatron每配置200步、20种群、5代与Nsys辅助，Liger/Unsloth使用不同N/P、lambda=0。Stage2固定峰值checkpoint，100轮搜索与同预算随机token变异对照。\u003c/p>\n\u003ch2 id=\"h03\">结果按分母排列\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>结论\u003c/th>\n\u003cth>数值\u003c/th>\n\u003cth>分母与解释\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>测试范围\u003c/td>\n\u003ctd>44项\u003c/td>\n\u003ctd>Megatron9、Liger25、Unsloth10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>超过tau\u003c/td>\n\u003ctd>16项\u003c/td>\n\u003ctd>3/9、7/25、6/10；tau=0.01\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>此前未记录\u003c/td>\n\u003ctd>12项\u003c/td>\n\u003ctd>超阈值中的未文档化差异，非自动等价12个代码缺陷\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Stage1最大收益\u003c/td>\n\u003ctd>13.33×\u003c/td>\n\u003ctd>超阈值配置命中率vs随机，不是训练速度\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Stage2最大收益\u003c/td>\n\u003ctd>8.79×\u003c/td>\n\u003ctd>Liger RMSNorm偏差vs随机输入变异\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这些数字来自上传稿件p5–8。不同实验的“倍数”不能放到同一加速图中。\u003c/p>\n\u003ch2 id=\"h04\">最有解释力的案例\u003c/h2>\n\u003cp>Megatron bias_gelu最终loss差0.979：融合使用tanh GeLU，reference为默认exact形式。对齐变体后的控制实验支持公式差异归因。Megatron cross_entropy最终0.0698：对应backward额外BF16 cast。bias_dropout最终0.222：论文归于融合运算顺序差异。\u003c/p>\n\u003cp>额外发现的LLM-generated baseline错误（SimPO/ORPO/TVD）是baseline构造问题，不能直接写成这些生产框架的同名operator都有相同缺陷，也不能无条件和16项重复相加。\u003c/p>\n\u003ch2 id=\"h05\">必须保留的资料局限\u003c/h2>\n\u003cp>稿件将tau作为经验显著性阈值，且讨论了搜索不完备。关于“BF16噪声通常小于1e−6”的文字不能当通用浮点精度界；数值误差依赖尺度、算子和轨迹，本站不以其作为数学保证。\u003c/p>\n\u003cp>方法概述和实验设置对GA选择方式的细节表达不完全一致；Stage2对两侧embedding/状态的完整实现细节没有全部展开。当前没有DFuzz专项源码与原始日志的完整独立审计，因此不填造这些空缺。\u003c/p>\n\u003ch2 id=\"h06\">如何呈现贡献\u003c/h2>\n\u003cp>可以说：构建训练配置与合法输入的两阶段差分搜索，跨三个框架系统量化优化引入的loss轨迹偏差，并通过源代码与控制实验区分重排、cast和近似。不要改写为“优化Megatron的TP通信”或“训练速度提升13.33倍”。\u003c/p>\n\u003cp>论文作为用户上传稿件提供依据，网站不标成已正式出版或已录用。原PDF未打包，避免未经确认公开研究材料。\u003c/p>\n","toc":[{"id":"h01","title":"研究对象与动机","level":2},{"id":"h02","title":"方法为什么是两阶段","level":2},{"id":"h03","title":"结果按分母排列","level":2},{"id":"h04","title":"最有解释力的案例","level":2},{"id":"h05","title":"必须保留的资料局限","level":2},{"id":"h06","title":"如何呈现贡献","level":2}],"plain":"研究对象与动机 研究对象是LLM训练框架中的operator optimizations，不是泛泛的API异常。一个fusion可能改变求和顺序、cast政策或数学近似，单步差异小仍可能让后续参数与moment状态偏离。论文用RMSNorm训练轨迹和不同配置的巨大偏差跨度支持多步、跨条件测试的必要性。 这些观察说明风险可能存在，不证明所有差异必然是有害bias或训练失败。本文按照稿件自身的trajectory metric解释结果。 方法为什么是两阶段 配置空间混合离散/连续变量，合法性约束复杂，多步评价昂贵，因此Stage1用GA。输入是离散token组合，Stage2借连续embedding梯度导航，再最近邻投影回合法token。两个阶段利用不同搜索结构，不是重复做两次随机测试。 论文p3的主要objective是loss轨迹最大绝对差；p5给Megatron每配置200步、20种群、5代与Nsys辅助，Liger/Unsloth使用不同N/P、lambda=0。Stage2固定峰值checkpoint，100轮搜索与同预算随机token变异对照。 结果按分母排列 结论 数值 分母与解释 测试范围 44项 Megatron9、Liger25、Unsloth10 超过tau 16项 3/9、7/25、6/10；tau=0.01 此前未记录 12项 超阈值中的未文档化差异，非自动等价12个代码缺陷 Stage1最大收益 13.33× 超阈值配置命中率vs随机，不是训练速度 Stage2最大收益 8.79× Liger RMSNorm偏差vs随机输入变异 这些数字来自上传稿件p5–8。不同实验的“倍数”不能放到同一加速图中。 最有解释力的案例 Megatron bias_gelu最终loss差0.979：融合使用tanh GeLU，reference为默认exact形式。对齐变体后的控制实验支持公式差异归因。Megatron cross_entropy最终0.0698：对应backward额外BF16 cast。bias_dropout最终0.222：论文归于融合运算顺序差异。 额外发现的LLM-generated baseline错误（SimPO/ORPO/TVD）是baseline构造问题，不能直接写成这些生产框架的同名operator都有相同缺陷，也不能无条件和16项重复相加。 必须保留的资料局限 稿件将tau作为经验显著性阈值，且讨论了搜索不完备。关于“BF16噪声通常小于1e−6”的文字不能当通用浮点精度界；数值误差依赖尺度、算子和轨迹，本站不以其作为数学保证。 方法概述和实验设置对GA选择方式的细节表达不完全一致；Stage2对两侧embedding/状态的完整实现细节没有全部展开。当前没有DFuzz专项源码与原始日志的完整独立审计，因此不填造这些空缺。 如何呈现贡献 可以说：构建训练配置与合法输入的两阶段差分搜索，跨三个框架系统量化优化引入的loss轨迹偏差，并通过源代码与控制实验区分重排、cast和近似。不要改写为“优化Megatron的TP通信”或“训练速度提升13.33倍”。 论文作为用户上传稿件提供依据，网站不标成已正式出版或已录用。原PDF未打包，避免未经确认公开研究材料。","charCount":1330},{"id":"project-deepop","title":"项目档案 · DeepOpFuzz：三组评测不能混成一个覆盖率","section":"projects","summary":"区分新发现86个bug、30根因回放与48历史bug效率实验。","prereq":["deepop-method","pool-bug","backward-bug"],"sources":["deepop","artifact-repro","bug-pool","bug-bwd"],"tags":["项目","DeepOpFuzz","Benchmark","bug"],"level":3,"kind":"项目证据档案","checks":[{"q":"13/30和13.0/48能直接当作同一实验指标吗？","a":"不能。前者为特定发现根因回放，后者为独立历史benchmark多seed均值。"},{"q":"Random触达更多kernel fingerprint，为什么可能发现更少bug？","a":"fingerprint多样性不等于进入关键条件的深度；也取决于oracle能观察哪些失败。"}],"lab":null,"raw":"## 研究问题\nSource program只是编译行为的输入之一。shape/dtype/layout/context与compiler options共同决定具体operation和artifact。方法需要同时解决到达目标和观察错误，而不只增加operator列表多样性。\n\n## 方法的工程组成\n从compiler internals抽象目标；path entries/conditions/composition构造程序；观察heuristic/fusion/extern/backward等artifact；按under-reached状态反馈；对适用表面执行oracle，即使没命中目标；最后复现、最小化与去重。\n\n论文说明目标构建不使用评测失败trace或oracle答案，减少target construction与evaluation泄漏。对其他栈的移植使用对应可观察产物，不要求都生成Triton。\n\n## 证据一：主要发现活动\n| 栈 | Silent | Crash | 合计 | 已修复（稿件统计） |\n|---|---:|---:|---:|---:|\n|PyTorch/Inductor|15|16|31|20|\n|TensorFlow/XLA|28|3|31|5|\n|IREE|3|4|7|2|\n|TVM|8|9|17|16|\n|总计|54|32|86|43|\n\n这来自上传稿件p7 Table I，不代表本站重新验证每条issue，也不代表当前上游状态永远不变。\n\n## 证据二：30个根因的四小时回放\n论文将PyTorch的31项发现按root cause分成30个目标，Table II中DeepOpFuzz到达13，Random5，四个baseline的并集为6。这个实验回答“对相应可复现版本，谁能触达这些根因及编译阶段”。\n\n## 证据三：独立48个历史bug的效率\n另一个benchmark建立在历史PyTorch/Inductor版本，包含48个可复现bug，用于RQ2/RQ3。Table III报告5个seed、4小时每轮均值：DeepOpFuzz bugs reached13.0，Random8.0；kernels stressed317与77。它与前面的30根因实验独立，不能把13/30和13.0/48混为同一比例。\n\n“Kernels reached”指至少命中一次，“stressed”指至少被10个不同程序命中。它们是诊断探索信号，不是形式化代码或语义覆盖率。随机方法可能触达更多不同fingerprints，却更少触达深层缺陷。\n\n## 两个案例的角色\npool stride案例说明shape、batch与schedule决定是否暴露错误；slice_scatter案例说明forward正确不能保证backward正确。前者帮助理解reachability，后者帮助理解observability；两者都有source、generated code与控制实验的定位链。\n\n仓库个别issue draft包含强语气或泛化判断，网站只采用最小可支持结论：指定版本、输入与artifact的失败机制。正式修复位置和最新上游状态不由草稿标题推定。\n\n## 面试表述\n最有价值的不是“我会fuzzing”，而是能解释如何把编译条件映射为测试输入、如何确认实际生成的代码、如何通过解析或差分oracle定位错误。讨论AI Compiler时，应沿lowering、metadata、scheduling和codegen展开，而不是堆没有实现证据的关键词。\n","html":"\u003ch2 id=\"h01\">研究问题\u003c/h2>\n\u003cp>Source program只是编译行为的输入之一。shape/dtype/layout/context与compiler options共同决定具体operation和artifact。方法需要同时解决到达目标和观察错误，而不只增加operator列表多样性。\u003c/p>\n\u003ch2 id=\"h02\">方法的工程组成\u003c/h2>\n\u003cp>从compiler internals抽象目标；path entries/conditions/composition构造程序；观察heuristic/fusion/extern/backward等artifact；按under-reached状态反馈；对适用表面执行oracle，即使没命中目标；最后复现、最小化与去重。\u003c/p>\n\u003cp>论文说明目标构建不使用评测失败trace或oracle答案，减少target construction与evaluation泄漏。对其他栈的移植使用对应可观察产物，不要求都生成Triton。\u003c/p>\n\u003ch2 id=\"h03\">证据一：主要发现活动\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>栈\u003c/th>\n\u003cth style=\"text-align: right;\">Silent\u003c/th>\n\u003cth style=\"text-align: right;\">Crash\u003c/th>\n\u003cth style=\"text-align: right;\">合计\u003c/th>\n\u003cth style=\"text-align: right;\">已修复（稿件统计）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>PyTorch/Inductor\u003c/td>\n\u003ctd style=\"text-align: right;\">15\u003c/td>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003ctd style=\"text-align: right;\">31\u003c/td>\n\u003ctd style=\"text-align: right;\">20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>TensorFlow/XLA\u003c/td>\n\u003ctd style=\"text-align: right;\">28\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">31\u003c/td>\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>IREE\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd style=\"text-align: right;\">7\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>TVM\u003c/td>\n\u003ctd style=\"text-align: right;\">8\u003c/td>\n\u003ctd style=\"text-align: right;\">9\u003c/td>\n\u003ctd style=\"text-align: right;\">17\u003c/td>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>总计\u003c/td>\n\u003ctd style=\"text-align: right;\">54\u003c/td>\n\u003ctd style=\"text-align: right;\">32\u003c/td>\n\u003ctd style=\"text-align: right;\">86\u003c/td>\n\u003ctd style=\"text-align: right;\">43\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这来自上传稿件p7 Table I，不代表本站重新验证每条issue，也不代表当前上游状态永远不变。\u003c/p>\n\u003ch2 id=\"h04\">证据二：30个根因的四小时回放\u003c/h2>\n\u003cp>论文将PyTorch的31项发现按root cause分成30个目标，Table II中DeepOpFuzz到达13，Random5，四个baseline的并集为6。这个实验回答“对相应可复现版本，谁能触达这些根因及编译阶段”。\u003c/p>\n\u003ch2 id=\"h05\">证据三：独立48个历史bug的效率\u003c/h2>\n\u003cp>另一个benchmark建立在历史PyTorch/Inductor版本，包含48个可复现bug，用于RQ2/RQ3。Table III报告5个seed、4小时每轮均值：DeepOpFuzz bugs reached13.0，Random8.0；kernels stressed317与77。它与前面的30根因实验独立，不能把13/30和13.0/48混为同一比例。\u003c/p>\n\u003cp>“Kernels reached”指至少命中一次，“stressed”指至少被10个不同程序命中。它们是诊断探索信号，不是形式化代码或语义覆盖率。随机方法可能触达更多不同fingerprints，却更少触达深层缺陷。\u003c/p>\n\u003ch2 id=\"h06\">两个案例的角色\u003c/h2>\n\u003cp>pool stride案例说明shape、batch与schedule决定是否暴露错误；slice_scatter案例说明forward正确不能保证backward正确。前者帮助理解reachability，后者帮助理解observability；两者都有source、generated code与控制实验的定位链。\u003c/p>\n\u003cp>仓库个别issue draft包含强语气或泛化判断，网站只采用最小可支持结论：指定版本、输入与artifact的失败机制。正式修复位置和最新上游状态不由草稿标题推定。\u003c/p>\n\u003ch2 id=\"h07\">面试表述\u003c/h2>\n\u003cp>最有价值的不是“我会fuzzing”，而是能解释如何把编译条件映射为测试输入、如何确认实际生成的代码、如何通过解析或差分oracle定位错误。讨论AI Compiler时，应沿lowering、metadata、scheduling和codegen展开，而不是堆没有实现证据的关键词。\u003c/p>\n","toc":[{"id":"h01","title":"研究问题","level":2},{"id":"h02","title":"方法的工程组成","level":2},{"id":"h03","title":"证据一：主要发现活动","level":2},{"id":"h04","title":"证据二：30个根因的四小时回放","level":2},{"id":"h05","title":"证据三：独立48个历史bug的效率","level":2},{"id":"h06","title":"两个案例的角色","level":2},{"id":"h07","title":"面试表述","level":2}],"plain":"研究问题 Source program只是编译行为的输入之一。shape/dtype/layout/context与compiler options共同决定具体operation和artifact。方法需要同时解决到达目标和观察错误，而不只增加operator列表多样性。 方法的工程组成 从compiler internals抽象目标；path entries/conditions/composition构造程序；观察heuristic/fusion/extern/backward等artifact；按under-reached状态反馈；对适用表面执行oracle，即使没命中目标；最后复现、最小化与去重。 论文说明目标构建不使用评测失败trace或oracle答案，减少target construction与evaluation泄漏。对其他栈的移植使用对应可观察产物，不要求都生成Triton。 证据一：主要发现活动 栈 Silent Crash 合计 已修复（稿件统计） PyTorch/Inductor 15 16 31 20 TensorFlow/XLA 28 3 31 5 IREE 3 4 7 2 TVM 8 9 17 16 总计 54 32 86 43 这来自上传稿件p7 Table I，不代表本站重新验证每条issue，也不代表当前上游状态永远不变。 证据二：30个根因的四小时回放 论文将PyTorch的31项发现按root cause分成30个目标，Table II中DeepOpFuzz到达13，Random5，四个baseline的并集为6。这个实验回答“对相应可复现版本，谁能触达这些根因及编译阶段”。 证据三：独立48个历史bug的效率 另一个benchmark建立在历史PyTorch/Inductor版本，包含48个可复现bug，用于RQ2/RQ3。Table III报告5个seed、4小时每轮均值：DeepOpFuzz bugs reached13.0，Random8.0；kernels stressed317与77。它与前面的30根因实验独立，不能把13/30和13.0/48混为同一比例。 “Kernels reached”指至少命中一次，“stressed”指至少被10个不同程序命中。它们是诊断探索信号，不是形式化代码或语义覆盖率。随机方法可能触达更多不同fingerprints，却更少触达深层缺陷。 两个案例的角色 pool stride案例说明shape、batch与schedule决定是否暴露错误；slice_scatter案例说明forward正确不能保证backward正确。前者帮助理解reachability，后者帮助理解observability；两者都有source、generated code与控制实验的定位链。 仓库个别issue draft包含强语气或泛化判断，网站只采用最小可支持结论：指定版本、输入与artifact的失败机制。正式修复位置和最新上游状态不由草稿标题推定。 面试表述 最有价值的不是“我会fuzzing”，而是能解释如何把编译条件映射为测试输入、如何确认实际生成的代码、如何通过解析或差分oracle定位错误。讨论AI Compiler时，应沿lowering、metadata、scheduling和codegen展开，而不是堆没有实现证据的关键词。","charCount":1365},{"id":"interview","title":"把知识变成技术论证：项目介绍、追问与学习检验","section":"projects","summary":"不背“满分答案”，用可核对的因果链回答。","prereq":["project-qwen","project-dfuzz","project-deepop"],"sources":["qreadme","dfuzz","deepop"],"tags":["面试","学习路线","技术表达"],"level":1,"kind":"复盘与检验","checks":[{"q":"面试官质疑结论，最先补充什么？","a":"实验对象、baseline、shape/dtype/backend、计时边界、原始样本/复测与数值gate，而不是加更多形容词。"},{"q":"怎样避免“知识点正确但项目故事虚构”？","a":"把通用原理、真实实现、报告数据与推断分开标注；用技术依赖图而不编造未记录的研发时间线。"}],"lab":null,"raw":"## 一段技术介绍必须有主语和证据\n先讲研究对象和问题，再说你改变了什么，为什么这种改动合理，测了什么、没测什么。源码能证明实现结构；消融能支持性能归因；论文统计能支持特定评测结果。这些证据不可互相替代。\n\n三条可用的叙事依赖如下，而非未经记录的真实研发时间线。\n\n\u003cdiv class=\"flow\">\u003cspan>Qwen计算结构\u003c/span>\u003cspan>执行开销假设\u003c/span>\u003cspan>Kernel/Runtime方案\u003c/span>\u003cspan>数值gate\u003c/span>\u003cspan>消融与端到端\u003c/span>\u003c/div>\n\u003cdiv class=\"flow\">\u003cspan>DFuzz数值差异\u003c/span>\u003cspan>训练动态\u003c/span>\u003cspan>配置搜索\u003c/span>\u003cspan>输入搜索\u003c/span>\u003cspan>阈值与根因\u003c/span>\u003c/div>\n\u003cdiv class=\"flow\">\u003cspan>DeepOp编译条件\u003c/span>\u003cspan>目标operation\u003c/span>\u003cspan>artifact观测\u003c/span>\u003cspan>oracle\u003c/span>\u003cspan>隔离复现\u003c/span>\u003c/div>\n\n## 从一个数字展开，而不是背整个目录\n被问“Q分支为什么55.4到29.1μs”，应先界定BF16布局消融的GPU时间；解释view/stride与physical copy；指出源码如何消费stride；说明该数据不等于FP16整模型或Graph收益。\n\n被问“8B为什么能在4卡训练”，先做master/grad/m/v显存账本；再说明按block聚合、重算、reduce-scatter；最后用真实checkpoint三步更新与导出证据收束，而不是只说“用了FSDP”。\n\n被问“Megatron工作是什么”，先说DFuzz测试9项优化与两阶段搜索；再用GeLU近似和CrossEntropy cast展开。TP理论可以作为追问知识，不把它包装成论文中的主要实现贡献。\n\n## 如何检查是否真的会\n拿一个未见shape，算出M/K/N与Q/K/V shape；拿一个Tensor，写出地址；拿一段forward，推导一个输入/参数梯度；拿一张结果表，找出baseline与时间范围；拿一个失败，提出能区分两个根因的控制实验。\n\n若只能复述“减少memory traffic”，但说不出哪个buffer被写读、有没有实际counter、是否只是逻辑流量估计，就还没有到可深入面试的程度。\n\n## 有边界的回答更可信\n“这段是我读过的通用机制，仓库未实现”“这个数字是报告结果，我没有在当前环境重跑”“这项只通过短程gate，不证明质量无损”都比补造经历好。不要用under review等未经本轮核实的状态替代技术内容。\n\n## 建议阅读路线\n从零：Tensor→FLOPs→Roofline→Autograd→Tokens→Transformer→Attention→Norm/RoPE。推理：GPU→Triton→QK Fusion→Flash→Decode→Graph→Serving。训练：AdamW→混合精度→累积/重算→Collectives→FSDP→源码→Checkpoint。编译/研究：Dynamo→AOT→Inductor→Codegen→Oracle→DFuzz/DeepOp。\n\n这份站点重点覆盖上述项目依赖及常见AI Infra基础。硬件特定的极限PTX优化、完整RLHF平台、生产级多租户调度与故障恢复不是这里已经实现的系统。扩展章节提供原理入口，不把范围外能力冒充成项目成果。\n","html":"\u003ch2 id=\"h01\">一段技术介绍必须有主语和证据\u003c/h2>\n\u003cp>先讲研究对象和问题，再说你改变了什么，为什么这种改动合理，测了什么、没测什么。源码能证明实现结构；消融能支持性能归因；论文统计能支持特定评测结果。这些证据不可互相替代。\u003c/p>\n\u003cp>三条可用的叙事依赖如下，而非未经记录的真实研发时间线。\u003c/p>\n\u003cdiv class=\"flow\">\n\u003cspan>Qwen计算结构\u003c/span>\u003cspan>执行开销假设\u003c/span>\u003cspan>Kernel/Runtime方案\u003c/span>\u003cspan>数值gate\u003c/span>\u003cspan>消融与端到端\u003c/span>\n\u003c/div>\n\u003cdiv class=\"flow\">\n\u003cspan>DFuzz数值差异\u003c/span>\u003cspan>训练动态\u003c/span>\u003cspan>配置搜索\u003c/span>\u003cspan>输入搜索\u003c/span>\u003cspan>阈值与根因\u003c/span>\n\u003c/div>\n\u003cdiv class=\"flow\">\n\u003cspan>DeepOp编译条件\u003c/span>\u003cspan>目标operation\u003c/span>\u003cspan>artifact观测\u003c/span>\u003cspan>oracle\u003c/span>\u003cspan>隔离复现\u003c/span>\n\u003c/div>\n\u003ch2 id=\"h02\">从一个数字展开，而不是背整个目录\u003c/h2>\n\u003cp>被问“Q分支为什么55.4到29.1μs”，应先界定BF16布局消融的GPU时间；解释view/stride与physical copy；指出源码如何消费stride；说明该数据不等于FP16整模型或Graph收益。\u003c/p>\n\u003cp>被问“8B为什么能在4卡训练”，先做master/grad/m/v显存账本；再说明按block聚合、重算、reduce-scatter；最后用真实checkpoint三步更新与导出证据收束，而不是只说“用了FSDP”。\u003c/p>\n\u003cp>被问“Megatron工作是什么”，先说DFuzz测试9项优化与两阶段搜索；再用GeLU近似和CrossEntropy cast展开。TP理论可以作为追问知识，不把它包装成论文中的主要实现贡献。\u003c/p>\n\u003ch2 id=\"h03\">如何检查是否真的会\u003c/h2>\n\u003cp>拿一个未见shape，算出M/K/N与Q/K/V shape；拿一个Tensor，写出地址；拿一段forward，推导一个输入/参数梯度；拿一张结果表，找出baseline与时间范围；拿一个失败，提出能区分两个根因的控制实验。\u003c/p>\n\u003cp>若只能复述“减少memory traffic”，但说不出哪个buffer被写读、有没有实际counter、是否只是逻辑流量估计，就还没有到可深入面试的程度。\u003c/p>\n\u003ch2 id=\"h04\">有边界的回答更可信\u003c/h2>\n\u003cp>“这段是我读过的通用机制，仓库未实现”“这个数字是报告结果，我没有在当前环境重跑”“这项只通过短程gate，不证明质量无损”都比补造经历好。不要用under review等未经本轮核实的状态替代技术内容。\u003c/p>\n\u003ch2 id=\"h05\">建议阅读路线\u003c/h2>\n\u003cp>从零：Tensor→FLOPs→Roofline→Autograd→Tokens→Transformer→Attention→Norm/RoPE。推理：GPU→Triton→QK Fusion→Flash→Decode→Graph→Serving。训练：AdamW→混合精度→累积/重算→Collectives→FSDP→源码→Checkpoint。编译/研究：Dynamo→AOT→Inductor→Codegen→Oracle→DFuzz/DeepOp。\u003c/p>\n\u003cp>这份站点重点覆盖上述项目依赖及常见AI Infra基础。硬件特定的极限PTX优化、完整RLHF平台、生产级多租户调度与故障恢复不是这里已经实现的系统。扩展章节提供原理入口，不把范围外能力冒充成项目成果。\u003c/p>\n","toc":[{"id":"h01","title":"一段技术介绍必须有主语和证据","level":2},{"id":"h02","title":"从一个数字展开，而不是背整个目录","level":2},{"id":"h03","title":"如何检查是否真的会","level":2},{"id":"h04","title":"有边界的回答更可信","level":2},{"id":"h05","title":"建议阅读路线","level":2}],"plain":"一段技术介绍必须有主语和证据 先讲研究对象和问题，再说你改变了什么，为什么这种改动合理，测了什么、没测什么。源码能证明实现结构；消融能支持性能归因；论文统计能支持特定评测结果。这些证据不可互相替代。 三条可用的叙事依赖如下，而非未经记录的真实研发时间线。 Qwen计算结构 执行开销假设 Kernel/Runtime方案 数值gate 消融与端到端 DFuzz数值差异 训练动态 配置搜索 输入搜索 阈值与根因 DeepOp编译条件 目标operation artifact观测 oracle 隔离复现 从一个数字展开，而不是背整个目录 被问“Q分支为什么55.4到29.1μs”，应先界定BF16布局消融的GPU时间；解释view/stride与physical copy；指出源码如何消费stride；说明该数据不等于FP16整模型或Graph收益。 被问“8B为什么能在4卡训练”，先做master/grad/m/v显存账本；再说明按block聚合、重算、reduce-scatter；最后用真实checkpoint三步更新与导出证据收束，而不是只说“用了FSDP”。 被问“Megatron工作是什么”，先说DFuzz测试9项优化与两阶段搜索；再用GeLU近似和CrossEntropy cast展开。TP理论可以作为追问知识，不把它包装成论文中的主要实现贡献。 如何检查是否真的会 拿一个未见shape，算出M/K/N与Q/K/V shape；拿一个Tensor，写出地址；拿一段forward，推导一个输入/参数梯度；拿一张结果表，找出baseline与时间范围；拿一个失败，提出能区分两个根因的控制实验。 若只能复述“减少memory traffic”，但说不出哪个buffer被写读、有没有实际counter、是否只是逻辑流量估计，就还没有到可深入面试的程度。 有边界的回答更可信 “这段是我读过的通用机制，仓库未实现”“这个数字是报告结果，我没有在当前环境重跑”“这项只通过短程gate，不证明质量无损”都比补造经历好。不要用under review等未经本轮核实的状态替代技术内容。 建议阅读路线 从零：Tensor→FLOPs→Roofline→Autograd→Tokens→Transformer→Attention→Norm/RoPE。推理：GPU→Triton→QK Fusion→Flash→Decode→Graph→Serving。训练：AdamW→混合精度→累积/重算→Collectives→FSDP→源码→Checkpoint。编译/研究：Dynamo→AOT→Inductor→Codegen→Oracle→DFuzz/DeepOp。 这份站点重点覆盖上述项目依赖及常见AI Infra基础。硬件特定的极限PTX优化、完整RLHF平台、生产级多租户调度与故障恢复不是这里已经实现的系统。扩展章节提供原理入口，不把范围外能力冒充成项目成果。","charCount":1204}],"sections":[{"id":"start","number":"00","title":"导读与路线","summary":"从自己的三个项目理解 AI Infra。"},{"id":"foundations","number":"01","title":"计算与系统基础","summary":"从地址、乘加和梯度开始。"},{"id":"model","number":"02","title":"Transformer 与模型算子","summary":"理解计算为何存在，再谈如何优化。"},{"id":"gpu","number":"03","title":"GPU 与 Triton Kernel","summary":"把公式变成真实的并行执行。"},{"id":"inference","number":"04","title":"LLM 推理与服务","summary":"区分算子、运行时与服务系统。"},{"id":"training","number":"05","title":"训练与分布式系统","summary":"从状态和显存推导通信与分片。"},{"id":"compiler","number":"06","title":"PyTorch 编译器","summary":"沿 Graph、IR 到生成代码逐层观察。"},{"id":"reliability","number":"07","title":"数值可靠性与 Fuzzing","summary":"测试到什么，能看见什么错误。"},{"id":"projects","number":"08","title":"项目档案与面试复盘","summary":"让每个结果都能沿证据追问。"}],"paths":[{"id":"foundation","name":"从零建立全貌","label":"基础路线","desc":"先掌握 tensor 与计算量，再把 Attention、GPU 和训练串起来。","items":["orientation","tensor-layout","gemm-flops","roofline","floating-point","tokens-loss","transformer","attention","autograd","gpu-execution","interview"]},{"id":"kernel","name":"Kernel / Inference","label":"性能路线","desc":"从 Qwen 数据流走向 Triton 实现与端到端归因。","items":["gemm-flops","roofline","rmsnorm","rope","swiglu","gqa-mla","gpu-memory","triton-model","qk-fusion","flashattention","prefill-decode","cuda-graph","profiling","project-qwen"]},{"id":"training","name":"Training / Distributed","label":"训练路线","desc":"先解释梯度和优化器状态，再理解全分片生命周期。","items":["autograd","adamw","tied-grad","mixed-precision","accum-recompute","collectives","fsdp-zero","block-fsdp","megatron-tp","pp-cp-moe","checkpoints"]},{"id":"compiler","name":"Compiler / Reliability","label":"研究路线","desc":"把模型语义、编译选择和可观察的错误连接起来。","items":["tensor-layout","floating-point","dynamo","aotautograd","inductor","triton-codegen","custom-ops","compiler-debug","oracles","deepop-method","pool-bug","backward-bug","project-deepop"]},{"id":"dfuzz","name":"Megatron / DFuzz","label":"数值路线","desc":"从浮点与训练动态出发，理解两阶段搜索和真实案例。","items":["floating-point","autograd","rmsnorm","adamw","oracles","dfuzz-config","dfuzz-input","dfuzz-megatron","project-dfuzz"]}],"sources":{"qreadme":{"id":"qreadme","title":"Qwen3-Triton · README.md","url":"https://github.com/wuyii8941/qwen3-triton/blob/10be3d87ecb4659da7f174293f162145daaf47c9/README.md","kind":"项目源码 / 报告","note":"固定到 10be3d87（2026-11-06）。数字来自作者报告或公开清单，本站未重跑 GPU 实验；本地 artifacts 未随仓库公开。"},"qsummary":{"id":"qsummary","title":"Qwen3-Triton · OPTIMIZATION_SUMMARY.md","url":"https://github.com/wuyii8941/qwen3-triton/blob/10be3d87ecb4659da7f174293f162145daaf47c9/OPTIMIZATION_SUMMARY.md" s Law","zh":"局部优化上限","definition":"总加速受未优化部分限制：1/[(1−f)+f/s]。","article":"roofline"},{"term":"BF16 / FP16","zh":"两类16位浮点","definition":"BF16指数范围宽、有效精度粗；FP16尾数更长但指数范围更窄。","article":"floating-point"},{"term":"FMA","zh":"融合乘加指令","definition":"乘加使用一次最终舍入；与“把多个算子融合成一个 kernel”不同。","article":"floating-point"},{"term":"Token / Embedding","zh":"离散标记 / 向量表示","definition":"token 是词表索引，embedding 是可训练的行向量查表。","article":"tokens-loss"},{"term":"Logits / Cross Entropy","zh":"分数 / 训练损失","definition":"logits 未归一化，交叉熵衡量目标 token 的负对数概率。","article":"tokens-loss"},{"term":"Residual Connection","zh":"残差连接","definition":"把子层输出与输入相加，提供一条直接的信息和梯度路径。","article":"transformer"},{"term":"RMSNorm","zh":"均方根归一化","definition":"按向量均方根缩放，再乘可训练权重；QK norm 与 block norm 的归约维度不同。","article":"rmsnorm"},{"term":"RoPE","zh":"旋转位置编码","definition":"在二维子空间按位置旋转 Q/K，使点积包含相对位置信息。","article":"rope"},{"term":"SwiGLU","zh":"门控前馈","definition":"SiLU(gate projection) 与 up projection 逐元素相乘，再执行 down projection。","article":"swiglu"},{"term":"GQA","zh":"分组查询注意力","definition":"多个 Q heads 共享一个 KV head，降低 KV 存储；不等于先显式复制 KV。","article":"gqa-mla"},{"term":"MLA","zh":"多头潜在注意力","definition":"通过低维潜表示等结构压缩 KV；不是给 GQA 换一个名字。","article":"gqa-mla"},{"term":"SM / Warp / CTA","zh":"执行资源与工作单元","definition":"SM执行线程块；NVIDIA warp通常32线程；program的逻辑元素不等于物理线程。","article":"gpu-execution"},{"term":"Coalescing","zh":"合并访存","definition":"一个 warp 的访问地址分布决定所需事务，不是“tensor连续”就一定最优。","article":"gpu-memory"},{"term":"Occupancy","zh":"驻留并行度","definition":"活跃 warps 相对硬件上限的比例，受寄存器、共享内存等约束；不是越高越快。","article":"gpu-memory"},{"term":"Tiling","zh":"分块","definition":"在片上复用输入 tile，改变数据搬运和并行分工而不是数学输出。","article":"gemm-tiling"},{"term":"Reduction","zh":"归约","definition":"把多个值合并为少数统计量，如sum/max；归约树会影响舍入顺序。","article":"reduction-softmax"},{"term":"Online Softmax","zh":"分块稳定归一化","definition":"维护运行max、分母与输出累积量，合并时重缩放而非简单平均。","article":"reduction-softmax"},{"term":"Triton","zh":"GPU kernel语言与编译器","definition":"以块级逻辑向量编程，编译器负责进一步映射线程/warps与生成设备代码。","article":"triton-model"},{"term":"Kernel Fusion","zh":"算子融合","definition":"将兼容计算合入一个kernel以减少中间物化和启动；资源压力可能增加。","article":"qk-fusion"},{"term":"FlashAttention","zh":"IO-aware attention","definition":"分块与在线softmax避免完整score矩阵落到全局显存；不是稀疏近似。","article":"flashattention"},{"term":"Prefill / Decode","zh":"输入处理 / 逐token生成","definition":"前者处理整段prompt，后者利用KV cache处理新token，矩阵形状和瓶颈不同。","article":"prefill-decode"},{"term":"KV Cache","zh":"历史键值缓存","definition":"每层保存历史token的K/V，避免重复投影；容量约2BSLHkvDb。","article":"gqa-mla"},{"term":"TTFT / ITL / TPOT","zh":"首token / 间隔 / 平均输出耗时","definition":"面向请求的服务指标，不能用单kernel延迟替代；定义需与采集端对齐。","article":"prefill-decode"},{"term":"CUDA Graph","zh":"GPU工作图重放","definition":"记录一组GPU操作及依赖，降低重复提交成本；不把所有操作变成一个kernel。","article":"cuda-graph"},{"term":"Continuous Batching","zh":"连续批处理","definition":"在迭代边界动态接纳/移除请求，需调度和KV管理而不只是动态batch维度。","article":"serving"},{"term":"PagedAttention","zh":"分页KV管理与访问","definition":"用块表映射逻辑token位置至固定物理块，降低预分配浪费。","article":"serving"},{"term":"W8A16","zh":"8位权重/16位激活","definition":"降低权重表示开销的近似路径；尺度、反量化与质量校验仍有成本。","article":"quantization"},{"term":"Speculative Decoding","zh":"推测解码","definition":"先草拟多个token，再目标模型验证，分布保持需要正确的接受/拒绝逻辑。","article":"speculative-pd"},{"term":"AdamW","zh":"解耦权重衰减优化器","definition":"维护一阶/二阶动量并做偏差修正，权重衰减与自适应梯度更新解耦。","article":"adamw"},{"term":"Weight Tying","zh":"权重共享","definition":"输入embedding与输出head可使用同一个参数对象，梯度需汇总所有使用路径。","article":"tied-grad"},{"term":"Master Weights","zh":"高精度主权重","definition":"用FP32保留小更新，再转换为计算精度；并非所有BF16训练都自动拥有。","article":"mixed-precision"},{"term":"Gradient Accumulation","zh":"梯度累积","definition":"多个microbatch累积后更新一次，须正确缩放loss并维护有效batch语义。","article":"accum-recompute"},{"term":"Activation Checkpointing","zh":"激活重算","definition":"少存中间激活，在backward重跑部分forward；不同于磁盘恢复checkpoint。","article":"accum-recompute"},{"term":"All-Gather","zh":"全收集","definition":"每个rank得到所有rank的分片，用于临时重建完整参数等。","article":"collectives"},{"term":"Reduce-Scatter","zh":"归约后分片","definition":"跨rank相加相同位置后，每rank只接收自己负责的区间。","article":"collectives"},{"term":"All-Reduce","zh":"全归约","definition":"所有rank得到对应元素规约后的完整结果，可用reduce-scatter与all-gather组织。","article":"collectives"},{"term":"FSDP / ZeRO-3","zh":"全分片训练","definition":"持久分片参数、梯度和优化器状态，按单元临时聚合完整参数。","article":"fsdp-zero"},{"term":"Tensor Parallel","zh":"张量并行","definition":"切分单层矩阵计算，partial output需要相应通信；不等同FSDP。","article":"megatron-tp"},{"term":"Pipeline / Context Parallel","zh":"层 / 上下文并行","definition":"分别切分模型层与注意力上下文；通信依赖不同。","article":"pp-cp-moe"},{"term":"MoE","zh":"混合专家","definition":"按token路由到部分专家，稀疏计算伴随负载均衡和token通信。","article":"pp-cp-moe"},{"term":"Dynamo / FX","zh":"捕获与图表示","definition":"Dynamo捕获可编译计算并建立guards，FX描述节点依赖而非GPU线程安排。","article":"dynamo"},{"term":"Guard / Graph Break","zh":"有效性检查 / 捕获边界","definition":"guard失效可能重编译；graph break通常形成eager片段，二者不是一回事。","article":"dynamo"},{"term":"AOTAutograd","zh":"前反向图处理","definition":"让autograd相关计算进入可编译图，同时处理functionalization和别名语义。","article":"aotautograd"},{"term":"Inductor","zh":"PyTorch编译后端","definition":"lowering到内部计算/缓冲表示，进行fusion、调度与代码生成，也可调用外部库。","article":"inductor"},{"term":"IR / Lowering","zh":"中间表示 / 降低","definition":"从高层算子逐步走向循环、索引、缓冲区和设备实现。","article":"inductor"},{"term":"Pass / Operation / Artifact","zh":"编译阶段 / 决策 / 产物","definition":"执行某pass不等于选中某具体决策；artifact是可观察的生成结果。","article":"deepop-method"},{"term":"Metamorphic Oracle","zh":"变形关系判据","definition":"检查输入变换前后的已知关系，无可信reference时仍可能暴露错误。","article":"oracles"},{"term":"Numerical Parity","zh":"数值对齐","definition":"在约定输入、精度和误差指标下的一致性，不等价全任务无损。","article":"oracles"},{"term":"DFuzz","zh":"训练数值差分模糊测试","definition":"先搜索训练配置，再搜索输入，评价优化ON/OFF的loss轨迹偏差。","article":"dfuzz-config"},{"term":"DeepOpFuzz","zh":"编译操作引导测试","definition":"按具体编译决策及条件生成program，观察artifact，并独立分派错误检查。","article":"deepop-method"},{"term":"Allocated / Reserved","zh":"实际分配 / 分配器保留","definition":"tensor释放不代表CUDA侧立即归还；Graph pool与工作区也影响统计。","article":"profiling"}],"labs":{"labs/01_layout.py":"\"\"\"CPU 实验：shape、stride、view 与复制。运行：python labs/01_layout.py\"\"\"\nimport numpy as np\n\n\ndef main() -> None:\n    x = np.arange(6, dtype=np.float32).reshape(2, 3)\n    t = x.T\n    c = np.ascontiguousarray(t)\n    print('x =\\n', x, '\\ntranspose =\\n', t)\n    for name, array in [('x', x), ('transpose', t), ('copy', c)]:\n        element_strides = tuple(s // array.itemsize for s in array.strides)\n        print(name, 'shape=', array.shape, 'element strides=', element_strides,\n              'C-contiguous=', array.flags.c_contiguous)\n    assert np.shares_memory(x, t)\n    assert not np.shares_memory(x, c)\n    # [row=2,col=1] 在转置view中的地址：2*1 + 1*3 = 5。\n    assert t[2, 1] == x.reshape(-1)[5]\n    b = np.broadcast_to(np.array([7.], dtype=np.float32), (4,))\n    assert b.strides == (0,)\n    print('broadcast stride=', b.strides, 'writeable=', b.flags.writeable)\n    # NumPy广播view通常只读；不要把这个flag外推成PyTorch行为。\n    print('PASS: view共享storage；contiguous复制；stride按元素解释。')\n\n\nif __name__ == '__main__':\n    main()\n","labs/02_online_softmax.py":"\"\"\"CPU float64 教学实验：分块 online softmax 的 (m,l,u) 合并。\"\"\"\nimport numpy as np\n\n\ndef streaming_attention(scores: np.ndarray, values: np.ndarray, chunk: int) -> np.ndarray:\n    if scores.ndim != 1 or values.ndim != 2 or len(scores) != len(values):\n        raise ValueError('Expected scores:[S], values:[S,D]')\n    if len(scores) == 0 or chunk \u003c= 0 or not np.all(np.isfinite(scores)):\n        raise ValueError('Require nonempty finite scores and positive chunk')\n    m, l = -np.inf, 0.0\n    u = np.zeros(values.shape[1], dtype=np.float64)\n    for start in range(0, len(scores), chunk):\n        block = scores[start:start+chunk]\n        val = values[start:start+chunk]\n        new_m = max(m, float(block.max()))\n        alpha = np.exp(m - new_m) if np.isfinite(m) else 0.0\n        p = np.exp(block - new_m)\n        u = alpha*u + p @ val\n        l = alpha*l + p.sum()\n        m = new_m\n    return u/l\n\n\ndef main() -> None:\n    rng = np.random.default_rng(7)\n    for length in (1, 17, 129, 513):\n        s = rng.normal(size=length)*40.0\n        v = rng.normal(size=(length, 8))\n        p = np.exp(s-s.max()); p /= p.sum()\n        ref = p @ v\n        for chunk in (1, 7, 32, 128):\n            got = streaming_attention(s, v, chunk)\n            np.testing.assert_allclose(got, ref, rtol=1e-12, atol=1e-12)\n    s = np.array([0., 0., 10.]); v = np.array([[0.], [0.], [1.]])\n    wrong = (0.0+1.0)/2  # 两块的已归一化输出不能无权平均。\n    right = float(streaming_attention(s, v, 2)[0])\n    print(f'无权平均={wrong:.6f}; 正确合并={right:.6f}')\n    print('PASS: 16组长度/分块对照通过；这是CPU数值实验，不是FlashAttention性能测试。')\n\n\nif __name__ == '__main__':\n    main()\n","labs/03_sharding.py":"\"\"\"用NumPy模拟flat parameter + all-gather + reduce-scatter。不是NCCL benchmark。\"\"\"\nimport numpy as np\n\n\ndef main() -> None:\n    rng = np.random.default_rng(42)\n    n, world, local_batch = 7, 4, 3\n    width = (n+world-1)//world\n    w = rng.normal(size=n)\n    padded = np.pad(w, (0, width*world-n))\n    shards = list(np.split(padded, world))\n    gathered = np.concatenate(shards)[:n]\n    np.testing.assert_array_equal(gathered, w)\n    xs = [rng.normal(size=(local_batch, n)) for _ in range(world)]\n    ys = [rng.normal(size=local_batch) for _ in range(world)]\n    # loss = mean((Xw-y)^2)/2；梯度是X.T@(Xw-y)/B。\n    local_grads = [x.T @ (x@w-y)/len(y) for x,y in zip(xs,ys)]\n    global_x, global_y = np.concatenate(xs), np.concatenate(ys)\n    reference = global_x.T @ (global_x@w-global_y)/len(global_y)\n    summed = np.sum([np.pad(g, (0,width*world-n)) for g in local_grads], axis=0)\n    reduced = [piece/world for piece in np.split(summed, world)]\n    reconstructed = np.concatenate(reduced)[:n]\n    np.testing.assert_allclose(reconstructed, reference, atol=1e-12)\n    lr = .05\n    updated = np.concatenate([p-lr*g for p,g in zip(shards,reduced)])[:n]\n    np.testing.assert_allclose(updated, w-lr*reference, atol=1e-12)\n    print('7个参数/4rank：每rank2个元素，padding1个零。')\n    print('PASS: gather、平均梯度和一次SGD更新与global batch参考一致。')\n    print('条件：各rank样本数相同、loss归约相同；不同有效token数要做加权。')\n\n\nif __name__ == '__main__':\n    main()\n","labs/04_precision.py":"\"\"\"CPU实验：FP32非结合律与有限值BF16 RNE舍入的位级教学模拟。\"\"\"\nimport numpy as np\n\n\ndef bf16_round_finite(x: np.ndarray) -> np.ndarray:\n    a = np.asarray(x, dtype=np.float32)\n    if not np.all(np.isfinite(a)):\n        raise ValueError('Only finite values are supported in this educational simulator')\n    bits = a.view(np.uint32)\n    rounded = bits + np.uint32(0x7fff) + ((bits >> 16) & np.uint32(1))\n    return (rounded & np.uint32(0xffff0000)).view(np.float32)\n\n\ndef main() -> None:\n    a,b,c = np.float32(1e20),np.float32(-1e20),np.float32(3.)\n    print('(a+b)+c =', np.float32(np.float32(a+b)+c))\n    print('a+(b+c) =', np.float32(a+np.float32(b+c)))\n    values = np.array([1., 1.001, 1.003, 1.004, 1.008, -1.004],dtype=np.float32)\n    quant = bf16_round_finite(values)\n    print('FP32:', values)\n    print('BF16 represented as FP32:', quant)\n    assert quant[0] == 1.0 and quant[1] == 1.0\n    np.testing.assert_array_equal(bf16_round_finite(quant), quant)\n    print('PASS: 有限值rounding幂等；此模拟不覆盖GPU归约、FMA、异常值或硬件吞吐。')\n\n\nif __name__ == '__main__':\n    main()\n","labs/05_cuda_benchmark.py":"\"\"\"可选GPU教学实验：同步wall-time与CUDA Events。无CUDA时明确SKIP。\"\"\"\nimport time\nimport statistics\n\n\ndef main() -> None:\n    try:\n        import torch\n    except ImportError:\n        print('SKIP: 请在独立CUDA PyTorch环境中运行。'); return\n    if not torch.cuda.is_available():\n        print('SKIP: CUDA unavailable.'); return\n    print('torch=',torch.__version__, 'GPU=',torch.cuda.get_device_name())\n    x = torch.randn(1024, 1024, device='cuda')\n    y = torch.randn_like(x)\n    with torch.inference_mode():\n        for _ in range(10): out = x @ y\n        torch.cuda.synchronize()\n        event_ms,wall_ms = [],[]\n        for _ in range(30):\n            start,end = torch.cuda.Event(enable_timing=True),torch.cuda.Event(enable_timing=True)\n            torch.cuda.synchronize()\n            t = time.perf_counter(); start.record()\n            out = x @ y\n            end.record(); end.synchronize()\n            wall_ms.append((time.perf_counter()-t)*1000)\n            event_ms.append(start.elapsed_time(end))\n    print('median event ms=',statistics.median(event_ms))\n    print('median sync wall ms=',statistics.median(wall_ms))\n    print('warm-cache固定shape教学测量；不锁频、不测服务吞吐；并非仓库性能结果复现。')\n\n\nif __name__ == '__main__':\n    main()\n","labs/06_triton_add.py":"\"\"\"可选GPU：向量相加，覆盖非BLOCK整数倍的mask。CPU环境只报告SKIP。\"\"\"\n\ndef main() -> None:\n    try:\n        import torch\n        import triton\n        import triton.language as tl\n    except ImportError:\n        print('SKIP: requires CUDA PyTorch and Triton in a separate environment.'); return\n    if not torch.cuda.is_available():\n        print('SKIP: CUDA unavailable.'); return\n\n    @triton.jit\n    def add_kernel(X, Y, O, N: tl.constexpr, BLOCK: tl.constexpr):\n        i = tl.program_id(0)*BLOCK + tl.arange(0, BLOCK)\n        x = tl.load(X+i, i\u003cN, 0)\n        y = tl.load(Y+i, i\u003cN, 0)\n        tl.store(O+i, x+y, i\u003cN)\n\n    for n in (1, 127, 128, 129, 10003):\n        x = torch.randn(n, device='cuda', dtype=torch.float32)\n        y = torch.randn_like(x)\n        out = torch.empty_like(x)\n        add_kernel[(triton.cdiv(n,128),)](x,y,out,n,128)\n        torch.testing.assert_close(out, x+y)\n    print('PASS: five shapes; only correctness, no speedup claim.')\n\n\nif __name__ == '__main__':\n    main()\n"},"quizCount":109,"version":"1.0"}</script>

<section class="calc-card"><div class="card-kicker">03 / FULL SHARD</div><h2>训练状态显存账本</h2><p>假设FP32 master和两份FP32 Adam状态，每参数12字节；可另外计FP32本地梯度。</p><div class="calc-fields">${field('fsdp-p','参数量 · Billion',8.19073536,0.00000001)}${field('fsdp-world','World Size',4)}<div class="field"><label for="fsdp-grad">本地梯度状态</label><select id="fsdp-grad"><option value="4">计入 FP32 梯度 (+4B)</option><option value="0">不计梯度</option></select></div></div><div class="calc-result" id="fsdp-result" aria-live="polite"></div><div class="calc-formula">State/rank = P × (12 + grad_bytes) / N</div><p>不含当前完整单元、激活、重算峰值、NCCL临时区；不能代替35.76GiB的项目实测。</p><a href="#article/block-fsdp">沿 BlockFSDP 的生命周期阅读 →</a></section>

function validNumbers(ids,integers=[]){const o={};for(const id of ids){const n=Number($('#'+id).value);if(!Number.isFinite(n)||n<=0||n>1e12||(integers.includes(id)&&!Number.isInteger(n)))return null;o[id]=n}return o}
const num=(n,d=2)=>n.toLocaleString('zh-CN',{maximumFractionDigits:d,minimumFractionDigits:0});
const row=(title,result)=>`<div class="result-row"><span>${title}</span><strong>${result}</strong></div>`;
function updateCalculators(){
let x=validNumbers(['gemm-m','gemm-n','gemm-k','gemm-b','gemm-peak','gemm-bw'],['gemm-m','gemm-n','gemm-k','gemm-b']);
if(x){const M=x['gemm-m'],N=x['gemm-n'],K=x['gemm-k'],F=2*M*N*K,Q=x['gemm-b']*(M*K+K*N+M*N),ai=F/Q,limit=Math.min(x['gemm-peak'],ai*x['gemm-bw']/1000);$('#gemm-result').innerHTML=row('约定计算量',num(F/1e9,4)+' GFLOPs')+row('理想逻辑流量',num(Q/2**20,3)+' MiB')+row('Arithmetic intensity',num(ai,3)+' FLOPs/B')+row('理论吞吐上界',num(limit,3)+' TFLOP/s')+`<small>${ai*x['gemm-bw']/1000<x['gemm-peak']?'该模型的带宽上界更低':'该模型的计算上界更低'}，不是实测瓶颈判定。</small>`}else $('#gemm-result').textContent='请输入正数；矩阵维度和字节数应为整数。';
x=validNumbers(['kv-batch','kv-seq','kv-layers','kv-heads','kv-dim','kv-bytes'],['kv-batch','kv-seq','kv-layers','kv-heads','kv-dim','kv-bytes']);
if(x){const size=2*Object.values(x).reduce((p,v)=>p*v,1);$('#kv-result').innerHTML=row('KV 内容容量',num(size/2**20,3)+' MiB')+row('换算 GiB',num(size/2**30,4)+' GiB')+row('每序列每 token',num(size/x['kv-batch']/x['kv-seq']/1024,3)+' KiB')}else $('#kv-result').textContent='所有参数需要是正整数。';
x=validNumbers(['fsdp-p','fsdp-world'],['fsdp-world']);
if(x){const P=x['fsdp-p']*1e9,N=x['fsdp-world'],g=Number($('#fsdp-grad').value);$('#fsdp-result').innerHTML=row('Master + m + v / rank',num(P*12/N/2**30,3)+' GiB')+row('选定状态合计 / rank',num(P*(12+g)/N/2**30,3)+' GiB')+row('完整 BF16 权重内容',num(P*2/2**30,3)+' GiB')}else $('#fsdp-result').textContent='参数量必须为正数，world size必须为正整数。';
x=validNumbers(['ring-n','ring-s','ring-bw','ring-alpha'],['ring-n']);
if(x){const N=x['ring-n'],S=x['ring-s']*2**20,send=2*(N-1)/N*S,lat=2*(N-1)*x['ring-alpha']/1000,bw=send/(x['ring-bw']*1e9)*1000;$('#ring-result').innerHTML=row('每 rank 发送量',num(send/2**20,3)+' MiB')+row('接收量（另计）',num(send/2**20,3)+' MiB')+row('延迟项 / 带宽项',num(lat,3)+' / '+num(bw,3)+' ms')+row('理想模型总时间',num(lat+bw,3)+' ms')}else $('#ring-result').textContent='请输入正数，rank数必须为整数。';
}
function sourcesPage(){const types=[...new Set(Object.values(DB.sources).map(s=>s.kind))];return `<div class="page">${breadcrumb('资料与边界')}<div class="eyebrow">SOURCES & EVIDENCE</div><h1>把出处和不确定性一起留下。</h1><p class="page-intro">${Object.keys(DB.sources).length} 条来源索引，连接原始论文、官方文档和固定版本项目代码。章节末尾给出对应来源；外部链接需要联网，正文、数学公式和练习无需联网。</p><div class="note-box"><strong>阅读边界</strong><br>本网站为学习教程，不是完整实验复现包。用户论文按提供稿件解释，未收录PDF；GPU性能来自项目报告，未在此重新测量。官方动态文档仅作概念与API参考，不能自动替换历史实验版本。发布前请确认研究稿件和项目结果允许公开。</div><div class="note-box"><strong>对来源本身保留判断</strong><br>DFuzz的阈值是论文实验约定，不能推出BF16存在通用的10⁻⁶噪声底；预算搜索不证明全局最坏值。DeepOpFuzz的30根因回放与48个历史bug效率实验分开呈现。Bug草稿中的解释与上游最终修复不是同一种证据。</div><input id="source-filter" class="filter-input" type="search" aria-label="过滤来源" placeholder="按标题、项目、文档或文件名查找…"><div id="source-results">${types.map(t=>`<section class="source-group"><h2>${escape(t)}</h2><div class="source-grid">${Object.values(DB.sources).filter(s=>s.kind===t).map(s=>sourceCard(s.id)).join('')}</div></section>`).join('')}</div>${footer()}</div>`}

function enhanceArticle(){
