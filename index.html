"title":"从文本到 loss：Tokenizer、Embedding、LM Head","section":"model","summary":"跟踪 token ID、hidden states、logits、概率与交叉熵的形状。","prereq":["gemm-flops","autograd"],"sources":["qconfig","qwen","crossentropy"],"tags":["token","embedding","logits","cross entropy"],"level":1,"kind":"原理与推导","checks":[{"q":"logits与概率的区别是什么？","a":"logits是未归一化分数；softmax后才是总和为1的分布。"},{"q":"Embedding参数多，是否代表每个token读取全部Embedding？","a":"输入lookup只读对应行；输出LM Head投影则可能访问整个词表权重，二者成本很不同。"}],"lab":null,"raw":"## 文本怎样变成模型输入\nTokenizer将文本映射为离散token ID序列。Token不一定是一个汉字或单词，可能是子词或字节片段。设词表大小V，Embedding矩阵为 $E\\in\\mathbb R^{V\\times H}$。token ID=t的输入向量为E的第t行。\n\nB个样本、每个S个token，经lookup后得到 `[B,S,H]`。lookup只是按索引取行，并不是用全部V×H矩阵做dense GEMM。词表实际token数量和为矩阵对齐而设置的embedding行数也可能不同，计算显存时应检查模型config与权重shape。\n\n## 为什么最后还需要 LM Head\n经过Transformer层后，模型拥有每个位置的hidden states，但需要预测下一个token属于词表中的哪个项。LM Head做线性投影：\n\n$$Z=HW_{out},\\quad Z\\in\\mathbb R^{B\\times S\\times V}.$$\n\nZ称为logits，尚未归一化。softmax给出概率 $p_j=e^{z_j}/\\sum_i e^{z_i}$。正确标签为y时，cross entropy为\n\n$$L=-\\log p_y=\\log\\sum_i e^{z_i}-z_y.$$\n\n推导导数可得 $\\partial L/\\partial z_j=p_j-\\mathbf1[j=y]$。这说明loss backward不只是输出一个标量，它必须向所有logit分量传递梯度。\n\n## 自回归标签为什么错位一格\n输入 `t0,t1,t2` 时，位置0预测t1，位置1预测t2。训练使用真实前缀，这是teacher forcing；生成时后续输入来自前一步选出的token。一次生成分歧会改变未来输入，不能用单步小误差保证整段文本相同。\n\nPadding或不参与训练的位置通常由ignore index排除。若把不同长度序列的平均loss直接再平均，会改变token权重。跨microbatch和跨rank都需要保留正确的有效token计数。\n\n## Weight tying 与巨大输出矩阵\n如果输入Embedding与输出Head共享E，则 $Z=HE^T$。它减少独立参数数量，但两条路径的梯度需要相加。Qwen3-1.7B的项目采用共享权重；8B结构不能默认同样tied。\n\nV约15万、H=2048时，一个BF16 V×H矩阵已经约594MiB。完整 `[B,S,V]` logits也会很大。Fused Linear Cross Entropy尝试避免完整物化logits，但它是独立的kernel与数值问题，不能仅凭公式相同默认适配无风险。\n\n## 练习\n给定B=2、S=128、H=2048、V=151936，分别计算hidden states与BF16 logits的元素数和字节数。然后解释为什么推理可只取last-token logits，而训练通常需要所有有效预测位置。\n","html":"\u003ch2 id=\"h01\">文本怎样变成模型输入\u003c/h2>\n\u003cp>Tokenizer将文本映射为离散token ID序列。Token不一定是一个汉字或单词，可能是子词或字节片段。设词表大小V，Embedding矩阵为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmsup>\u003cmi>ℝ\u003c/mi>\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>H\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">E\\in\\mathbb R^{V\\times H}\u003c/annotation>\u003c/semantics>\u003c/math>。token ID=t的输入向量为E的第t行。\u003c/p>\n\u003cp>B个样本、每个S个token，经lookup后得到 \u003ccode>[B,S,H]\u003c/code>。lookup只是按索引取行，并不是用全部V×H矩阵做dense GEMM。词表实际token数量和为矩阵对齐而设置的embedding行数也可能不同，计算显存时应检查模型config与权重shape。\u003c/p>\n\u003ch2 id=\"h02\">为什么最后还需要 LM Head\u003c/h2>\n\u003cp>经过Transformer层后，模型拥有每个位置的hidden states，但需要预测下一个token属于词表中的哪个项。LM Head做线性投影：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>H\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmi>o\u003c/mi>\u003cmi>u\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmi>Z\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmsup>\u003cmi>ℝ\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Z=HW_{out},\\quad Z\\in\\mathbb R^{B\\times S\\times V}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>Z称为logits，尚未归一化。softmax给出概率 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/msup>\u003cmi>/\u003c/mi>\u003cmsub>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">p_j=e^{z_j}/\\sum_i e^{z_i}\u003c/annotation>\u003c/semantics>\u003c/math>。正确标签为y时，cross entropy为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>−\u003c/mi>\u003cmo>log\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>log\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">L=-\\log p_y=\\log\\sum_i e^{z_i}-z_y.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>推导导数可得 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>∂\u003c/mi>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>𝟏\u003c/mn>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\partial L/\\partial z_j=p_j-\\mathbf1[j=y]\u003c/annotation>\u003c/semantics>\u003c/math>。这说明loss backward不只是输出一个标量，它必须向所有logit分量传递梯度。\u003c/p>\n\u003ch2 id=\"h03\">自回归标签为什么错位一格\u003c/h2>\n\u003cp>输入 \u003ccode>t0,t1,t2\u003c/code> 时，位置0预测t1，位置1预测t2。训练使用真实前缀，这是teacher forcing；生成时后续输入来自前一步选出的token。一次生成分歧会改变未来输入，不能用单步小误差保证整段文本相同。\u003c/p>\n\u003cp>Padding或不参与训练的位置通常由ignore index排除。若把不同长度序列的平均loss直接再平均，会改变token权重。跨microbatch和跨rank都需要保留正确的有效token计数。\u003c/p>\n\u003ch2 id=\"h04\">Weight tying 与巨大输出矩阵\u003c/h2>\n\u003cp>如果输入Embedding与输出Head共享E，则 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>H\u003c/mi>\u003cmsup>\u003cmi>E\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Z=HE^T\u003c/annotation>\u003c/semantics>\u003c/math>。它减少独立参数数量，但两条路径的梯度需要相加。Qwen3-1.7B的项目采用共享权重；8B结构不能默认同样tied。\u003c/p>\n\u003cp>V约15万、H=2048时，一个BF16 V×H矩阵已经约594MiB。完整 \u003ccode>[B,S,V]\u003c/code> logits也会很大。Fused Linear Cross Entropy尝试避免完整物化logits，但它是独立的kernel与数值问题，不能仅凭公式相同默认适配无风险。\u003c/p>\n\u003ch2 id=\"h05\">练习\u003c/h2>\n\u003cp>给定B=2、S=128、H=2048、V=151936，分别计算hidden states与BF16 logits的元素数和字节数。然后解释为什么推理可只取last-token logits，而训练通常需要所有有效预测位置。\u003c/p>\n","toc":[{"id":"h01","title":"文本怎样变成模型输入","level":2},{"id":"h02","title":"为什么最后还需要 LM Head","level":2},{"id":"h03","title":"自回归标签为什么错位一格","level":2},{"id":"h04","title":"Weight tying 与巨大输出矩阵","level":2},{"id":"h05","title":"练习","level":2}],"plain":"文本怎样变成模型输入 Tokenizer将文本映射为离散token ID序列。Token不一定是一个汉字或单词，可能是子词或字节片段。设词表大小V，Embedding矩阵为 E ∈ ℝ V × H 。token ID=t的输入向量为E的第t行。 B个样本、每个S个token，经lookup后得到 [B,S,H] 。lookup只是按索引取行，并不是用全部V×H矩阵做dense GEMM。词表实际token数量和为矩阵对齐而设置的embedding行数也可能不同，计算显存时应检查模型config与权重shape。 为什么最后还需要 LM Head 经过Transformer层后，模型拥有每个位置的hidden states，但需要预测下一个token属于词表中的哪个项。LM Head做线性投影： Z = H W o u t , Z ∈ ℝ B × S × V . Z称为logits，尚未归一化。softmax给出概率 p j = e z j / ∑ i e z i 。正确标签为y时，cross entropy为 L = − log p y = log ∑ i e z i − z y . 推导导数可得 ∂ L / ∂ z j = p j − 𝟏 [ j = y ] 。这说明loss backward不只是输出一个标量，它必须向所有logit分量传递梯度。 自回归标签为什么错位一格 输入 t0,t1,t2 时，位置0预测t1，位置1预测t2。训练使用真实前缀，这是teacher forcing；生成时后续输入来自前一步选出的token。一次生成分歧会改变未来输入，不能用单步小误差保证整段文本相同。 Padding或不参与训练的位置通常由ignore index排除。若把不同长度序列的平均loss直接再平均，会改变token权重。跨microbatch和跨rank都需要保留正确的有效token计数。 Weight tying 与巨大输出矩阵 如果输入Embedding与输出Head共享E，则 Z = H E T 。它减少独立参数数量，但两条路径的梯度需要相加。Qwen3-1.7B的项目采用共享权重；8B结构不能默认同样tied。 V约15万、H=2048时，一个BF16 V×H矩阵已经约594MiB。完整 [B,S,V] logits也会很大。Fused Linear Cross Entropy尝试避免完整物化logits，但它是独立的kernel与数值问题，不能仅凭公式相同默认适配无风险。 练习 给定B=2、S=128、H=2048、V=151936，分别计算hidden states与BF16 logits的元素数和字节数。然后解释为什么推理可只取last-token logits，而训练通常需要所有有效预测位置。","charCount":1059},{"id":"transformer","title":"把一个 Qwen3 Decoder Block 连起来","section":"model","summary":"在架构位置上理解 Residual、Pre-Norm、QK-Norm、Attention 与 FFN。","prereq":["tokens-loss"],"sources":["qwen","qconfig","qattention"],"tags":["Qwen3","Transformer","Residual","QK-Norm"],"level":1,"kind":"原理与推导","checks":[{"q":"为什么O projection后必须回到H维？","a":"要与该残差分支的输入逐元素相加，输出shape需要兼容。"},{"q":"一个Q head的RMSNorm归约16还是128个数？","a":"本例沿head dimension D=128归约，不沿16个Q heads归约。"}],"lab":null,"raw":"## 不要先背孤立算子\ntoken通过Embedding变成 `[B,S,H]` 后，要经过多层Decoder Block。每个block包含跨token的信息混合Attention，以及逐token的特征变换FFN。残差连接把输入加回，使每层可以在已有表示上学习增量。\n\n以简化Pre-Norm block表示：\n\n$$X_1=X+Attention(Norm_1(X)),$$\n$$X_2=X_1+MLP(Norm_2(X_1)).$$\n\n这只是结构关系，attention内部仍有QKV投影、QK-Norm、RoPE、mask和输出投影。\n\n\u003cdiv class=\"flow\">\u003cspan>输入 X\u003c/span>\u003cspan>RMSNorm\u003c/span>\u003cspan>QKV → QK-Norm → RoPE → Attention → O\u003c/span>\u003cspan>Residual Add\u003c/span>\u003cspan>RMSNorm → SwiGLU MLP\u003c/span>\u003cspan>Residual Add\u003c/span>\u003c/div>\n\n## 用真实形状跟踪一次\nQwen3-1.7B项目配置：28层、H=2048、Q heads=16、KV heads=8、D=128、FFN中间宽度6144。B=1、S=128时，输入为 `[1,128,2048]`。Q投影输出2048维，K/V各输出1024维，再view为 `[1,128,16,128]` 和 `[1,128,8,128]`。\n\nAttention计算后Q head的输出拼回2048维，经O projection后与输入同shape，才能逐元素残差相加。MLP则把2048维映射至更宽的6144维，经过门控后再投影回2048。\n\n## 两种 RMSNorm 不能混淆\nBlock输入或post-attention norm沿hidden dimension H计算。Attention内部Q/K norm分别沿每个head的D计算。这两种归约域不同，权重shape也不同。项目的QK-Norm+RoPE融合针对后者，不是把全层所有norm并成一项。\n\n## 为什么要残差和归一化\n残差提供不必经过整个非线性变换的直接路径。若 $y=x+f(x)$，反向包含identity贡献 $I+J_f$；这有助于理解深层网络为何使用该结构，但不意味着梯度永远不会爆炸或消失。Norm控制表示的尺度，其可学习scale允许模型调整各维贡献。\n\n## 计算账本\n每token的Q/K/V/O线性计算约25.2MFLOPs；三矩阵SwiGLU MLP约75.5MFLOPs。此处只计主要投影，不包含score/PV、norm和LM Head。数值由shape推导，不是profiling读数。\n\nRMSNorm与RoPE并非FLOPs大头，但反复出现28次，小kernel和中间张量仍可能影响latency。这就是后续从架构走向fusion的合理切入口，不证明它是所有workload中的首要瓶颈。\n","html":"\u003ch2 id=\"h01\">不要先背孤立算子\u003c/h2>\n\u003cp>token通过Embedding变成 \u003ccode>[B,S,H]\u003c/code> 后，要经过多层Decoder Block。每个block包含跨token的信息混合Attention，以及逐token的特征变换FFN。残差连接把输入加回，使每层可以在已有表示上学习增量。\u003c/p>\n\u003cp>以简化Pre-Norm block表示：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>N\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>r\u003c/mi>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">X_1=X+Attention(Norm_1(X)),\u003c/annotation>\u003c/semantics>\u003c/math> \u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>M\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>N\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>r\u003c/mi>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">X_2=X_1+MLP(Norm_2(X_1)).\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这只是结构关系，attention内部仍有QKV投影、QK-Norm、RoPE、mask和输出投影。\u003c/p>\n\u003cdiv class=\"flow\">\n\u003cspan>输入 X\u003c/span>\u003cspan>RMSNorm\u003c/span>\u003cspan>QKV → QK-Norm → RoPE → Attention → O\u003c/span>\u003cspan>Residual Add\u003c/span>\u003cspan>RMSNorm → SwiGLU MLP\u003c/span>\u003cspan>Residual Add\u003c/span>\n\u003c/div>\n\u003ch2 id=\"h02\">用真实形状跟踪一次\u003c/h2>\n\u003cp>Qwen3-1.7B项目配置：28层、H=2048、Q heads=16、KV heads=8、D=128、FFN中间宽度6144。B=1、S=128时，输入为 \u003ccode>[1,128,2048]\u003c/code>。Q投影输出2048维，K/V各输出1024维，再view为 \u003ccode>[1,128,16,128]\u003c/code> 和 \u003ccode>[1,128,8,128]\u003c/code>。\u003c/p>\n\u003cp>Attention计算后Q head的输出拼回2048维，经O projection后与输入同shape，才能逐元素残差相加。MLP则把2048维映射至更宽的6144维，经过门控后再投影回2048。\u003c/p>\n\u003ch2 id=\"h03\">两种 RMSNorm 不能混淆\u003c/h2>\n\u003cp>Block输入或post-attention norm沿hidden dimension H计算。Attention内部Q/K norm分别沿每个head的D计算。这两种归约域不同，权重shape也不同。项目的QK-Norm+RoPE融合针对后者，不是把全层所有norm并成一项。\u003c/p>\n\u003ch2 id=\"h04\">为什么要残差和归一化\u003c/h2>\n\u003cp>残差提供不必经过整个非线性变换的直接路径。若 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y=x+f(x)\u003c/annotation>\u003c/semantics>\u003c/math>，反向包含identity贡献 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">I+J_f\u003c/annotation>\u003c/semantics>\u003c/math>；这有助于理解深层网络为何使用该结构，但不意味着梯度永远不会爆炸或消失。Norm控制表示的尺度，其可学习scale允许模型调整各维贡献。\u003c/p>\n\u003ch2 id=\"h05\">计算账本\u003c/h2>\n\u003cp>每token的Q/K/V/O线性计算约25.2MFLOPs；三矩阵SwiGLU MLP约75.5MFLOPs。此处只计主要投影，不包含score/PV、norm和LM Head。数值由shape推导，不是profiling读数。\u003c/p>\n\u003cp>RMSNorm与RoPE并非FLOPs大头，但反复出现28次，小kernel和中间张量仍可能影响latency。这就是后续从架构走向fusion的合理切入口，不证明它是所有workload中的首要瓶颈。\u003c/p>\n","toc":[{"id":"h01","title":"不要先背孤立算子","level":2},{"id":"h02","title":"用真实形状跟踪一次","level":2},{"id":"h03","title":"两种 RMSNorm 不能混淆","level":2},{"id":"h04","title":"为什么要残差和归一化","level":2},{"id":"h05","title":"计算账本","level":2}],"plain":"不要先背孤立算子 token通过Embedding变成 [B,S,H] 后，要经过多层Decoder Block。每个block包含跨token的信息混合Attention，以及逐token的特征变换FFN。残差连接把输入加回，使每层可以在已有表示上学习增量。 以简化Pre-Norm block表示： X 1 = X + A t t e n t i o n ( N o r m 1 ( X ) ) , X 2 = X 1 + M L P ( N o r m 2 ( X 1 ) ) . 这只是结构关系，attention内部仍有QKV投影、QK-Norm、RoPE、mask和输出投影。 输入 X RMSNorm QKV → QK-Norm → RoPE → Attention → O Residual Add RMSNorm → SwiGLU MLP Residual Add 用真实形状跟踪一次 Qwen3-1.7B项目配置：28层、H=2048、Q heads=16、KV heads=8、D=128、FFN中间宽度6144。B=1、S=128时，输入为 [1,128,2048] 。Q投影输出2048维，K/V各输出1024维，再view为 [1,128,16,128] 和 [1,128,8,128] 。 Attention计算后Q head的输出拼回2048维，经O projection后与输入同shape，才能逐元素残差相加。MLP则把2048维映射至更宽的6144维，经过门控后再投影回2048。 两种 RMSNorm 不能混淆 Block输入或post-attention norm沿hidden dimension H计算。Attention内部Q/K norm分别沿每个head的D计算。这两种归约域不同，权重shape也不同。项目的QK-Norm+RoPE融合针对后者，不是把全层所有norm并成一项。 为什么要残差和归一化 残差提供不必经过整个非线性变换的直接路径。若 y = x + f ( x ) ，反向包含identity贡献 I + J f ；这有助于理解深层网络为何使用该结构，但不意味着梯度永远不会爆炸或消失。Norm控制表示的尺度，其可学习scale允许模型调整各维贡献。 计算账本 每token的Q/K/V/O线性计算约25.2MFLOPs；三矩阵SwiGLU MLP约75.5MFLOPs。此处只计主要投影，不包含score/PV、norm和LM Head。数值由shape推导，不是profiling读数。 RMSNorm与RoPE并非FLOPs大头，但反复出现28次，小kernel和中间张量仍可能影响latency。这就是后续从架构走向fusion的合理切入口，不证明它是所有workload中的首要瓶颈。","charCount":1066},{"id":"attention","title":"Self-Attention：为什么是 QKᵀ / √D","section":"model","summary":"从相似度、方差与加权平均推导 attention，并跟踪全部 shape。","prereq":["transformer","roofline"],"sources":["transformer-paper","sdpa","flash"],"tags":["Attention","softmax","sqrt D","causal"],"level":1,"kind":"原理与推导","checks":[{"q":"softmax前减同一个常数为何不改结果？","a":"分子分母都乘以相同的exp(-c)，会约掉。"},{"q":"GQA减少KV heads，是否让每个Q head的score计算消失？","a":"不会。每个Q仍要与其共享组的K比较；GQA主要减少KV投影、缓存及可复用的数据流。"}],"lab":null,"raw":"## 为什么token需要互相看见\nEmbedding只给token本身的表示。理解“它”指谁，需要读取上下文。Self-Attention为每个位置建立一个查询，用查询与各位置的key求相似度，再用得到的权重混合value。\n\n设 $X:[B,S,H]$。线性投影产生Q/K/V，reshape成heads后，单个head可以记为 $Q:[S_q,D]$、$K:[S_k,D]$、$V:[S_k,D_v]$。于是\n\n$$A=QK^T:[S_q,S_k],\\qquad O=PV:[S_q,D_v].$$\n\nQ/K负责生成权重，V负责被加权的内容。它们是学习到的投影，不是固定的“问题、答案、数据库”结构。\n\n## 为什么除以平方根D\n以教学假设推导：q和k各维独立，均值0、方差1，且q与k独立。每项 $q_i k_i$ 方差为1，D项相加的点积方差约D，标准差约 $\\sqrt D$。除以 $\\sqrt D$ 后，score尺度保持在数量级1。\n\n若不缩放，维度增大时softmax容易极端集中，使某些梯度很小。注意这是初始化尺度的解释，不代表真实训练中的Q/K永远独立同分布。QK-Norm改变尺度分布，也不取消必须遵守模型定义的缩放规则。\n\n## softmax 为什么是加权平均\n对某个query的一行score $s_j$：\n\n$$p_j=\\frac{e^{s_j}}{\\sum_k e^{s_k}},\\quad \\sum_jp_j=1,\\quad O_i=\\sum_jp_jV_j.$$\n\n这是一个依赖输入的加权组合。为避免overflow，用 $m=\\max_j s_j$，同时从分子分母指数中减去m，结果不变。整行都被mask时分母可能为0，这需要额外约定，不能凭公式自动得到安全实现。\n\n## causal mask 从哪里来\n自回归训练中，位置i只能利用不晚于自己的输入。将未来位置的score设为负无穷，softmax后对应概率为0。decode只有一个新query，但它的位置是缓存末尾，不能机械套用“左上角1×S causal三角mask”；应使用正确的query/key位置语义。\n\n```python\n# 教学reference：MHA，Q/K/V均为[B,H,S,D]，非生产实现\nscores = q @ k.transpose(-1, -2) / (q.shape[-1] ** 0.5)\nscores = scores.masked_fill(future_mask, float('-inf'))\nprobs = scores.float().softmax(dim=-1).to(v.dtype)\nout = probs @ v\n```\n\n## 复杂度怎么数\nQKᵀ约 $2BH_qS_qS_kD$ FLOPs，PV同量级，合计约 $4BH_qS_qS_kD$。训练prefill有 $S_q=S_k=S$，dense计算随S²增长。因果实现可跳过部分三角区域，但依然是二次量级。decode的query长度1，score/PV随已有cache长度线性增长。\n\nFlashAttention接下来优化的是这些计算的IO组织，不是将所有dense attention FLOPs变成线性。\n","html":"\u003ch2 id=\"h01\">为什么token需要互相看见\u003c/h2>\n\u003cp>Embedding只给token本身的表示。理解“它”指谁，需要读取上下文。Self-Attention为每个位置建立一个查询，用查询与各位置的key求相似度，再用得到的权重混合value。\u003c/p>\n\u003cp>设 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>X\u003c/mi>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">X:[B,S,H]\u003c/annotation>\u003c/semantics>\u003c/math>。线性投影产生Q/K/V，reshape成heads后，单个head可以记为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Q:[S_q,D]\u003c/annotation>\u003c/semantics>\u003c/math>、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">K:[S_k,D]\u003c/annotation>\u003c/semantics>\u003c/math>、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">V:[S_k,D_v]\u003c/annotation>\u003c/semantics>\u003c/math>。于是\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003cmspace width=\"2.0em\">\u003c/mspace>\u003cmi>O\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>:\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">A=QK^T:[S_q,S_k],\\qquad O=PV:[S_q,D_v].\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>Q/K负责生成权重，V负责被加权的内容。它们是学习到的投影，不是固定的“问题、答案、数据库”结构。\u003c/p>\n\u003ch2 id=\"h02\">为什么除以平方根D\u003c/h2>\n\u003cp>以教学假设推导：q和k各维独立，均值0、方差1，且q与k独立。每项 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">q_i k_i\u003c/annotation>\u003c/semantics>\u003c/math> 方差为1，D项相加的点积方差约D，标准差约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsqrt>\u003cmi>D\u003c/mi>\u003c/msqrt>\u003cannotation encoding=\"application/x-tex\">\\sqrt D\u003c/annotation>\u003c/semantics>\u003c/math>。除以 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsqrt>\u003cmi>D\u003c/mi>\u003c/msqrt>\u003cannotation encoding=\"application/x-tex\">\\sqrt D\u003c/annotation>\u003c/semantics>\u003c/math> 后，score尺度保持在数量级1。\u003c/p>\n\u003cp>若不缩放，维度增大时softmax容易极端集中，使某些梯度很小。注意这是初始化尺度的解释，不代表真实训练中的Q/K永远独立同分布。QK-Norm改变尺度分布，也不取消必须遵守模型定义的缩放规则。\u003c/p>\n\u003ch2 id=\"h03\">softmax 为什么是加权平均\u003c/h2>\n\u003cp>对某个query的一行score \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cannotation encoding=\"application/x-tex\">s_j\u003c/annotation>\u003c/semantics>\u003c/math>：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/msup>\u003cmrow>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>k\u003c/mi>\u003c/munder>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmsub>\u003cmi>O\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">p_j=\\frac{e^{s_j}}{\\sum_k e^{s_k}},\\quad \\sum_jp_j=1,\\quad O_i=\\sum_jp_jV_j.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这是一个依赖输入的加权组合。为避免overflow，用 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">m=\\max_j s_j\u003c/annotation>\u003c/semantics>\u003c/math>，同时从分子分母指数中减去m，结果不变。整行都被mask时分母可能为0，这需要额外约定，不能凭公式自动得到安全实现。\u003c/p>\n\u003ch2 id=\"h04\">causal mask 从哪里来\u003c/h2>\n\u003cp>自回归训练中，位置i只能利用不晚于自己的输入。将未来位置的score设为负无穷，softmax后对应概率为0。decode只有一个新query，但它的位置是缓存末尾，不能机械套用“左上角1×S causal三角mask”；应使用正确的query/key位置语义。\u003c/p>\n\u003cpre class=\"python\">\u003ccode># 教学reference：MHA，Q/K/V均为[B,H,S,D]，非生产实现\nscores = q @ k.transpose(-1, -2) / (q.shape[-1] ** 0.5)\nscores = scores.masked_fill(future_mask, float(&#39;-inf&#39;))\nprobs = scores.float().softmax(dim=-1).to(v.dtype)\nout = probs @ v\u003c/code>\u003c/pre>\n\u003ch2 id=\"h05\">复杂度怎么数\u003c/h2>\n\u003cp>QKᵀ约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmi>D\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">2BH_qS_qS_kD\u003c/annotation>\u003c/semantics>\u003c/math> FLOPs，PV同量级，合计约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>B\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmi>D\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">4BH_qS_qS_kD\u003c/annotation>\u003c/semantics>\u003c/math>。训练prefill有 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>S\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">S_q=S_k=S\u003c/annotation>\u003c/semantics>\u003c/math>，dense计算随S²增长。因果实现可跳过部分三角区域，但依然是二次量级。decode的query长度1，score/PV随已有cache长度线性增长。\u003c/p>\n\u003cp>FlashAttention接下来优化的是这些计算的IO组织，不是将所有dense attention FLOPs变成线性。\u003c/p>\n","toc":[{"id":"h01","title":"为什么token需要互相看见","level":2},{"id":"h02","title":"为什么除以平方根D","level":2},{"id":"h03","title":"softmax 为什么是加权平均","level":2},{"id":"h04","title":"causal mask 从哪里来","level":2},{"id":"h05","title":"复杂度怎么数","level":2}],"plain":"为什么token需要互相看见 Embedding只给token本身的表示。理解“它”指谁，需要读取上下文。Self-Attention为每个位置建立一个查询，用查询与各位置的key求相似度，再用得到的权重混合value。 设 X : [ B , S , H ] 。线性投影产生Q/K/V，reshape成heads后，单个head可以记为 Q : [ S q , D ] 、 K : [ S k , D ] 、 V : [ S k , D v ] 。于是 A = Q K T : [ S q , S k ] , O = P V : [ S q , D v ] . Q/K负责生成权重，V负责被加权的内容。它们是学习到的投影，不是固定的“问题、答案、数据库”结构。 为什么除以平方根D 以教学假设推导：q和k各维独立，均值0、方差1，且q与k独立。每项 q i k i 方差为1，D项相加的点积方差约D，标准差约 D 。除以 D 后，score尺度保持在数量级1。 若不缩放，维度增大时softmax容易极端集中，使某些梯度很小。注意这是初始化尺度的解释，不代表真实训练中的Q/K永远独立同分布。QK-Norm改变尺度分布，也不取消必须遵守模型定义的缩放规则。 softmax 为什么是加权平均 对某个query的一行score s j ： p j = e s j ∑ k e s k , ∑ j p j = 1 , O i = ∑ j p j V j . 这是一个依赖输入的加权组合。为避免overflow，用 m = max j s j ，同时从分子分母指数中减去m，结果不变。整行都被mask时分母可能为0，这需要额外约定，不能凭公式自动得到安全实现。 causal mask 从哪里来 自回归训练中，位置i只能利用不晚于自己的输入。将未来位置的score设为负无穷，softmax后对应概率为0。decode只有一个新query，但它的位置是缓存末尾，不能机械套用“左上角1×S causal三角mask”；应使用正确的query/key位置语义。 # 教学reference：MHA，Q/K/V均为[B,H,S,D]，非生产实现 scores = q @ k.transpose(-1, -2) / (q.shape[-1] ** 0.5) scores = scores.masked_fill(future_mask, float('-inf')) probs = scores.float().softmax(dim=-1).to(v.dtype) out = probs @ v 复杂度怎么数 QKᵀ约 2 B H q S q S k D FLOPs，PV同量级，合计约 4 B H q S q S k D 。训练prefill有 S q = S k = S ，dense计算随S²增长。因果实现可跳过部分三角区域，但依然是二次量级。decode的query长度1，score/PV随已有cache长度线性增长。 FlashAttention接下来优化的是这些计算的IO组织，不是将所有dense attention FLOPs变成线性。","charCount":1142},{"id":"rmsnorm","title":"RMSNorm：归约、精度边界与 backward 推导","section":"model","summary":"区分 block norm 与 QK norm，从均方根到一行 Triton 的计算域。","prereq":["floating-point","transformer","autograd"],"sources":["rms-paper","qkernel","dfuzz"],"tags":["RMSNorm","QK-Norm","reduction","backward"],"level":1,"kind":"原理与推导","checks":[{"q":"RMSNorm是否必须减均值？","a":"不需要；这正是它与LayerNorm的主要公式区别之一。"},{"q":"为什么dX包含整行的sum(a*x)？","a":"因为一行的所有输入共同决定归一化尺度r；任意x_j的变化都会通过r影响所有输出。"}],"lab":null,"raw":"## 它在控制什么\n隐藏向量的数值尺度影响下游计算。LayerNorm减去均值再按标准差归一化；RMSNorm只用均方根尺度，不做中心化。对一行 $x\\in\\mathbb R^D$：\n\n$$r=(\\frac1D\\sum_i x_i^2+\\epsilon)^{-1/2},\\qquad y_i=w_ix_ir.$$\n\nw是可学习scale，epsilon避免零附近的分母问题。忽略epsilon且a>0时，RMSNorm(ax)与RMSNorm(x)相同；有epsilon时不是严格尺度不变，a\u003c0还涉及符号。\n\n## 数值小例子\n令x=[3,4]，w=[1,1]，epsilon=0。均方为(9+16)/2=12.5，RMS≈3.5355，输出≈[0.8485,1.1314]。它没有把均值变成0，因此不能解释为“把每行平移到零中心”。\n\nQwen block级RMSNorm沿H维；QK-Norm沿每个head的D维。每行需要独立的r，所以一个program负责一行是自然起点，但并非所有shape上的最佳schedule。\n\n## forward为什么通常用FP32归约\n平方和可能跨越大量元素，低精度直接相加会增加误差。常见方式是低精度输入转FP32计算r，再按契约cast。项目HF兼容kernel保留 normalize→cast→scale→cast 的某些边界，不是“全程FP32最后一次舍入”。\n\n## backward 不只是一句 autograd\n令上游梯度为g，定义 $a_i=g_iw_i$。因\n\n$$\\frac{\\partial r}{\\partial x_j}=-\\frac{x_j}{D}r^3,$$\n\n有\n\n$$\\frac{\\partial L}{\\partial x_j}=r a_j-\\frac{x_jr^3}{D}\\sum_i a_ix_i.$$\n\n第一项是直接缩放路径，第二项来自所有元素共同影响r。w的梯度是 $g_jx_jr$，在多行输入下还需沿行累加。只对x乘r而忽略r的导数会产生错误梯度。\n\n这个公式按实数语义推导；真实低精度cast和自定义backward的约定需单独测试。有限差分也需要远离数值不稳定点并选择合适步长。\n\n## GPU成本与项目连接\n主要算术和数据量都为O(D)，不像GEMM那样存在大量跨输出复用。优化候选包括减少中间张量、适当的row/block映射与融合消费者。不能仅凭公式就宣称带宽已饱和。\n\n你的QK融合把RMSNorm后紧接的RoPE放入同一program。DFuzz用Liger RMSNorm的训练轨迹说明单步微小差异可能随训练传播。这是性能与数值可靠性的同一个交汇点。\n","html":"\u003ch2 id=\"h01\">它在控制什么\u003c/h2>\n\u003cp>隐藏向量的数值尺度影响下游计算。LayerNorm减去均值再按标准差归一化；RMSNorm只用均方根尺度，不做中心化。对一行 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmsup>\u003cmi>ℝ\u003c/mi>\u003cmi>D\u003c/mi>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x\\in\\mathbb R^D\u003c/annotation>\u003c/semantics>\u003c/math>：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsubsup>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmi>ϵ\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>−\u003c/mi>\u003cmn>1\u003c/mn>\u003cmi>/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>,\u003c/mo>\u003cmspace width=\"2.0em\">\u003c/mspace>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>r\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">r=(\\frac1D\\sum_i x_i^2+\\epsilon)^{-1/2},\\qquad y_i=w_ix_ir.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>w是可学习scale，epsilon避免零附近的分母问题。忽略epsilon且a&gt;0时，RMSNorm(ax)与RMSNorm(x)相同；有epsilon时不是严格尺度不变，a&lt;0还涉及符号。\u003c/p>\n\u003ch2 id=\"h02\">数值小例子\u003c/h2>\n\u003cp>令x=[3,4]，w=[1,1]，epsilon=0。均方为(9+16)/2=12.5，RMS≈3.5355，输出≈[0.8485,1.1314]。它没有把均值变成0，因此不能解释为“把每行平移到零中心”。\u003c/p>\n\u003cp>Qwen block级RMSNorm沿H维；QK-Norm沿每个head的D维。每行需要独立的r，所以一个program负责一行是自然起点，但并非所有shape上的最佳schedule。\u003c/p>\n\u003ch2 id=\"h03\">forward为什么通常用FP32归约\u003c/h2>\n\u003cp>平方和可能跨越大量元素，低精度直接相加会增加误差。常见方式是低精度输入转FP32计算r，再按契约cast。项目HF兼容kernel保留 normalize→cast→scale→cast 的某些边界，不是“全程FP32最后一次舍入”。\u003c/p>\n\u003ch2 id=\"h04\">backward 不只是一句 autograd\u003c/h2>\n\u003cp>令上游梯度为g，定义 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">a_i=g_iw_i\u003c/annotation>\u003c/semantics>\u003c/math>。因\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>−\u003c/mi>\u003cmfrac>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{\\partial r}{\\partial x_j}=-\\frac{x_j}{D}r^3,\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>有\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{\\partial L}{\\partial x_j}=r a_j-\\frac{x_jr^3}{D}\\sum_i a_ix_i.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>第一项是直接缩放路径，第二项来自所有元素共同影响r。w的梯度是 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">g_jx_jr\u003c/annotation>\u003c/semantics>\u003c/math>，在多行输入下还需沿行累加。只对x乘r而忽略r的导数会产生错误梯度。\u003c/p>\n\u003cp>这个公式按实数语义推导；真实低精度cast和自定义backward的约定需单独测试。有限差分也需要远离数值不稳定点并选择合适步长。\u003c/p>\n\u003ch2 id=\"h05\">GPU成本与项目连接\u003c/h2>\n\u003cp>主要算术和数据量都为O(D)，不像GEMM那样存在大量跨输出复用。优化候选包括减少中间张量、适当的row/block映射与融合消费者。不能仅凭公式就宣称带宽已饱和。\u003c/p>\n\u003cp>你的QK融合把RMSNorm后紧接的RoPE放入同一program。DFuzz用Liger RMSNorm的训练轨迹说明单步微小差异可能随训练传播。这是性能与数值可靠性的同一个交汇点。\u003c/p>\n","toc":[{"id":"h01","title":"它在控制什么","level":2},{"id":"h02","title":"数值小例子","level":2},{"id":"h03","title":"forward为什么通常用FP32归约","level":2},{"id":"h04","title":"backward 不只是一句 autograd","level":2},{"id":"h05","title":"GPU成本与项目连接","level":2}],"plain":"它在控制什么 隐藏向量的数值尺度影响下游计算。LayerNorm减去均值再按标准差归一化；RMSNorm只用均方根尺度，不做中心化。对一行 x ∈ ℝ D ： r = ( 1 D ∑ i x i 2 + ϵ ) − 1 / 2 , y i = w i x i r . w是可学习scale，epsilon避免零附近的分母问题。忽略epsilon且a>0时，RMSNorm(ax)与RMSNorm(x)相同；有epsilon时不是严格尺度不变，a\u003c0还涉及符号。 数值小例子 令x=[3,4]，w=[1,1]，epsilon=0。均方为(9+16)/2=12.5，RMS≈3.5355，输出≈[0.8485,1.1314]。它没有把均值变成0，因此不能解释为“把每行平移到零中心”。 Qwen block级RMSNorm沿H维；QK-Norm沿每个head的D维。每行需要独立的r，所以一个program负责一行是自然起点，但并非所有shape上的最佳schedule。 forward为什么通常用FP32归约 平方和可能跨越大量元素，低精度直接相加会增加误差。常见方式是低精度输入转FP32计算r，再按契约cast。项目HF兼容kernel保留 normalize→cast→scale→cast 的某些边界，不是“全程FP32最后一次舍入”。 backward 不只是一句 autograd 令上游梯度为g，定义 a i = g i w i 。因 ∂ r ∂ x j = − x j D r 3 , 有 ∂ L ∂ x j = r a j − x j r 3 D ∑ i a i x i . 第一项是直接缩放路径，第二项来自所有元素共同影响r。w的梯度是 g j x j r ，在多行输入下还需沿行累加。只对x乘r而忽略r的导数会产生错误梯度。 这个公式按实数语义推导；真实低精度cast和自定义backward的约定需单独测试。有限差分也需要远离数值不稳定点并选择合适步长。 GPU成本与项目连接 主要算术和数据量都为O(D)，不像GEMM那样存在大量跨输出复用。优化候选包括减少中间张量、适当的row/block映射与融合消费者。不能仅凭公式就宣称带宽已饱和。 你的QK融合把RMSNorm后紧接的RoPE放入同一program。DFuzz用Liger RMSNorm的训练轨迹说明单步微小差异可能随训练传播。这是性能与数值可靠性的同一个交汇点。","charCount":924},{"id":"rope","title":"RoPE：从二维旋转到相对位置与 split-half","section":"model","summary":"推导位置差如何进入点积，再解释 Qwen 的维度配对。","prereq":["attention","rmsnorm"],"sources":["rope-paper","qkernel","qfsdp"],"tags":["RoPE","位置编码","split-half","YaRN"],"level":1,"kind":"原理与推导","checks":[{"q":"D=128时d=3的配对索引是多少？","a":"67；前半维与后半维对应元素配对。"},{"q":"QK norm与RoPE融合是否代表交换计算顺序？","a":"不是。融合是同一program按原依赖执行；交换涉及learned scale、epsilon和舍入语义，需要另证。"}],"lab":null,"raw":"## Attention为什么还需要位置\n仅靠内容向量的点积，不能完整表达“同一个token出现在不同位置”。RoPE将位置m映射成旋转矩阵 $R_m$，再作用于query和key，使相对位置影响它们的点积。\n\n对一个二维子空间：\n\n$$R(\\theta)=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}.$$\n\n将位置m和n分别编码：\n\n$$(R_mq)^T(R_nk)=q^TR_m^TR_nk=q^TR_{n-m}k.$$\n\n这里利用旋转矩阵的可组合性。不同维度对使用不同频率 $\\theta_{m,j}=m\\omega_j$，构成多频率相对位置表示。不是给每个token简单加一个独立向量。\n\n## Qwen为什么是split-half\n设D=8，split-half把维度配为(0,4)、(1,5)、(2,6)、(3,7)。若 $x=[a,b]$，其中a/b各为D/2维，则\n\n$$rotate\\_half(x)=[-b,a],$$\n$$y=x\\odot cos+rotate\\_half(x)\\odot sin.$$\n\n相邻配对interleaved方式则是(0,1)、(2,3)等。两种约定在适当重排权重时可建立关系，但不能在已训练checkpoint上不加处理直接互换。\n\n项目索引 `p = where(d \u003c D/2, d+D/2, d-D/2)` 正是寻找另一半搭档。每个program处理一个head，所以不需要跨head通信。\n\n## 为什么作用在Q/K而不是V\n相对位置应影响attention评分，即QK点积。原始RoPE形式对Q/K旋转，V作为被加权内容保留。模型变体可以不同，但本项目必须匹配Qwen真实实现。你直接写V cache的kernel只是复制V，不对V做Norm或RoPE。\n\n## 融合的合法性与限制\nNorm结果是RoPE输入，可以连续算，省中间写回；不代表可以随意交换两个操作。理想不带逐维scale的正交旋转保持范数，但RMSNorm带learned scale、epsilon和低精度舍入，通常不能用“旋转不改范数”推断任意重排逐位等价。\n\n## 位置与cache\nprefill的position是多个连续位置，decode的新token必须使用真实cache position，而不是每次重置为0。向cache写K时应保存与模型契约一致的旋转后K，不能在下次attention中无意二次旋转。\n\n长上下文扩展如RoPE scaling/YaRN会改变频率或其他约定。项目8B报告保留了配置warning并只验证短上下文，不能据此宣称验证了131K语义。\n","html":"\u003ch2 id=\"h01\">Attention为什么还需要位置\u003c/h2>\n\u003cp>仅靠内容向量的点积，不能完整表达“同一个token出现在不同位置”。RoPE将位置m映射成旋转矩阵 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cannotation encoding=\"application/x-tex\">R_m\u003c/annotation>\u003c/semantics>\u003c/math>，再作用于query和key，使相对位置影响它们的点积。\u003c/p>\n\u003cp>对一个二维子空间：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd columnalign=\"center\" style=\"text-align: center\">\u003cmo>cos\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"center\" style=\"text-align: center\">\u003cmi>−\u003c/mi>\u003cmo>sin\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"center\" style=\"text-align: center\">\u003cmo>sin\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"center\" style=\"text-align: center\">\u003cmo>cos\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">R(\\theta)=\\begin{pmatrix}\\cos\\theta&amp;-\\sin\\theta\\\\\\sin\\theta&amp;\\cos\\theta\\end{pmatrix}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>将位置m和n分别编码：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmsubsup>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msubsup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi>k\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>k\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">(R_mq)^T(R_nk)=q^TR_m^TR_nk=q^TR_{n-m}k.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这里利用旋转矩阵的可组合性。不同维度对使用不同频率 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\theta_{m,j}=m\\omega_j\u003c/annotation>\u003c/semantics>\u003c/math>，构成多频率相对位置表示。不是给每个token简单加一个独立向量。\u003c/p>\n\u003ch2 id=\"h02\">Qwen为什么是split-half\u003c/h2>\n\u003cp>设D=8，split-half把维度配为(0,4)、(1,5)、(2,6)、(3,7)。若 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x=[a,b]\u003c/annotation>\u003c/semantics>\u003c/math>，其中a/b各为D/2维，则\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>_\u003c/mi>\u003cmi>h\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>−\u003c/mi>\u003cmi>b\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">rotate\\_half(x)=[-b,a],\u003c/annotation>\u003c/semantics>\u003c/math> \u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>⊙\u003c/mo>\u003cmi>c\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>_\u003c/mi>\u003cmi>h\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>⊙\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y=x\\odot cos+rotate\\_half(x)\\odot sin.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>相邻配对interleaved方式则是(0,1)、(2,3)等。两种约定在适当重排权重时可建立关系，但不能在已训练checkpoint上不加处理直接互换。\u003c/p>\n\u003cp>项目索引 \u003ccode>p = where(d &lt; D/2, d+D/2, d-D/2)\u003c/code> 正是寻找另一半搭档。每个program处理一个head，所以不需要跨head通信。\u003c/p>\n\u003ch2 id=\"h03\">为什么作用在Q/K而不是V\u003c/h2>\n\u003cp>相对位置应影响attention评分，即QK点积。原始RoPE形式对Q/K旋转，V作为被加权内容保留。模型变体可以不同，但本项目必须匹配Qwen真实实现。你直接写V cache的kernel只是复制V，不对V做Norm或RoPE。\u003c/p>\n\u003ch2 id=\"h04\">融合的合法性与限制\u003c/h2>\n\u003cp>Norm结果是RoPE输入，可以连续算，省中间写回；不代表可以随意交换两个操作。理想不带逐维scale的正交旋转保持范数，但RMSNorm带learned scale、epsilon和低精度舍入，通常不能用“旋转不改范数”推断任意重排逐位等价。\u003c/p>\n\u003ch2 id=\"h05\">位置与cache\u003c/h2>\n\u003cp>prefill的position是多个连续位置，decode的新token必须使用真实cache position，而不是每次重置为0。向cache写K时应保存与模型契约一致的旋转后K，不能在下次attention中无意二次旋转。\u003c/p>\n\u003cp>长上下文扩展如RoPE scaling/YaRN会改变频率或其他约定。项目8B报告保留了配置warning并只验证短上下文，不能据此宣称验证了131K语义。\u003c/p>\n","toc":[{"id":"h01","title":"Attention为什么还需要位置","level":2},{"id":"h02","title":"Qwen为什么是split-half","level":2},{"id":"h03","title":"为什么作用在Q/K而不是V","level":2},{"id":"h04","title":"融合的合法性与限制","level":2},{"id":"h05","title":"位置与cache","level":2}],"plain":"Attention为什么还需要位置 仅靠内容向量的点积，不能完整表达“同一个token出现在不同位置”。RoPE将位置m映射成旋转矩阵 R m ，再作用于query和key，使相对位置影响它们的点积。 对一个二维子空间： R ( θ ) = ( cos θ − sin θ sin θ cos θ ) . 将位置m和n分别编码： ( R m q ) T ( R n k ) = q T R m T R n k = q T R n − m k . 这里利用旋转矩阵的可组合性。不同维度对使用不同频率 θ m , j = m ω j ，构成多频率相对位置表示。不是给每个token简单加一个独立向量。 Qwen为什么是split-half 设D=8，split-half把维度配为(0,4)、(1,5)、(2,6)、(3,7)。若 x = [ a , b ] ，其中a/b各为D/2维，则 r o t a t e _ h a l f ( x ) = [ − b , a ] , y = x ⊙ c o s + r o t a t e _ h a l f ( x ) ⊙ s i n . 相邻配对interleaved方式则是(0,1)、(2,3)等。两种约定在适当重排权重时可建立关系，但不能在已训练checkpoint上不加处理直接互换。 项目索引 p = where(d \u003c D/2, d+D/2, d-D/2) 正是寻找另一半搭档。每个program处理一个head，所以不需要跨head通信。 为什么作用在Q/K而不是V 相对位置应影响attention评分，即QK点积。原始RoPE形式对Q/K旋转，V作为被加权内容保留。模型变体可以不同，但本项目必须匹配Qwen真实实现。你直接写V cache的kernel只是复制V，不对V做Norm或RoPE。 融合的合法性与限制 Norm结果是RoPE输入，可以连续算，省中间写回；不代表可以随意交换两个操作。理想不带逐维scale的正交旋转保持范数，但RMSNorm带learned scale、epsilon和低精度舍入，通常不能用“旋转不改范数”推断任意重排逐位等价。 位置与cache prefill的position是多个连续位置，decode的新token必须使用真实cache position，而不是每次重置为0。向cache写K时应保存与模型契约一致的旋转后K，不能在下次attention中无意二次旋转。 长上下文扩展如RoPE scaling/YaRN会改变频率或其他约定。项目8B报告保留了配置warning并只验证短上下文，不能据此宣称验证了131K语义。","charCount":973},{"id":"swiglu","title":"FFN 与 SwiGLU：为什么有三块权重","section":"model","summary":"从逐 token 特征变换走到 SiLU×Up 融合和 GEMM epilogue。","prereq":["gemm-flops","autograd","transformer"],"sources":["qwen","qtuning","qsummary"],"tags":["SwiGLU","SiLU","FFN","epilogue"],"level":1,"kind":"原理与推导","checks":[{"q":"SwiGLU与两个Linear的普通MLP有何区别？","a":"SwiGLU有两条输入投影分支gate/up，经非线性门控后再做down，共三块主要权重。"},{"q":"只融合SiLU×Up减少了多少GEMM？","a":"没有减少GEMM次数；它减少activation中间张量和相关启动。"}],"lab":null,"raw":"## Attention之外还需要什么\nAttention在token之间交换信息；FFN主要在每个token的特征维度上做非线性变换。普通两层MLP为 $Y=\\phi(XW_1)W_2$。Qwen采用门控结构：\n\n$$G=XW_g,\\quad U=XW_u,$$\n$$Z=SiLU(G)\\odot U,\\quad Y=ZW_d,$$\n$$SiLU(x)=x\\sigma(x),\\quad\\sigma(x)=\\frac1{1+e^{-x}}.$$\n\ngate和up不是同一结果的复制，而是两套学习到的投影。gate的非线性值调节up的每个特征，因此有gate/up/down三块矩阵。\n\n## 从shape看计算量\nX为M×H，gate/up权重为H×I，down为I×H。三次GEMM合计约 $6MHI$ FLOPs。Qwen3-1.7B取H=2048、I=6144，单token约75.5MFLOPs，不包含activation和其他层。\n\nSiLU和乘法都逐元素处理M×I数据。把它们融合，可以避免SiLU输出的物化；但并没有消除三次大矩阵乘法。把gate/up projection也合入另一个kernel，则是不同层次的GEMM/epilogue设计。\n\n## backward从哪里来\n令上游对Z的梯度为 $g_Z$，则\n\n$$g_U=g_Z\\odot SiLU(G),$$\n$$g_G=g_Z\\odot U\\odot[\\sigma(G)+G\\sigma(G)(1-\\sigma(G))].$$\n\n再通过矩阵反向公式求dX和dW。因为X同时参与gate与up，两个分支的dX需要相加，不能覆盖。训练融合还要解决保存或重算G/U的问题，推理kernel不自动拥有正确backward。\n\n## 项目里应当怎样区分\n基础 `_activation` 负责SiLU与Mul融合。Decode Gate/Up GEMV针对小M进行特定访存组织。调优版prefill GEMM涉及BM/BN/BK、warp和stage配置。这些实验的比较范围不同，有些只计gate/up，不包含down projection，不可称为完整MLP速度。\n\n项目保留了部分dtype/shape慢于cuBLAS或编译基线的负结果。一个BF16随机矩阵上更快，不足以证明FP16或完整Qwen也更快。\n\n## 追问：能否把norm、gate/up、activation、down全部融合\n数学依赖存在不代表能高效放入一个CTA。跨tile重用、全局归约、寄存器容量和不同计算域会形成边界。合理方案常是只融合GEMM的适当prologue/epilogue，保留成熟库或模板的高吞吐核心。\n","html":"\u003ch2 id=\"h01\">Attention之外还需要什么\u003c/h2>\n\u003cp>Attention在token之间交换信息；FFN主要在每个token的特征维度上做非线性变换。普通两层MLP为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Y=\\phi(XW_1)W_2\u003c/annotation>\u003c/semantics>\u003c/math>。Qwen采用门控结构：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>u\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">G=XW_g,\\quad U=XW_u,\u003c/annotation>\u003c/semantics>\u003c/math> \u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>S\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>U\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>⊙\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Z\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Z=SiLU(G)\\odot U,\\quad Y=ZW_d,\u003c/annotation>\u003c/semantics>\u003c/math> \u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>S\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>U\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>−\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">SiLU(x)=x\\sigma(x),\\quad\\sigma(x)=\\frac1{1+e^{-x}}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>gate和up不是同一结果的复制，而是两套学习到的投影。gate的非线性值调节up的每个特征，因此有gate/up/down三块矩阵。\u003c/p>\n\u003ch2 id=\"h02\">从shape看计算量\u003c/h2>\n\u003cp>X为M×H，gate/up权重为H×I，down为I×H。三次GEMM合计约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmi>M\u003c/mi>\u003cmi>H\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">6MHI\u003c/annotation>\u003c/semantics>\u003c/math> FLOPs。Qwen3-1.7B取H=2048、I=6144，单token约75.5MFLOPs，不包含activation和其他层。\u003c/p>\n\u003cp>SiLU和乘法都逐元素处理M×I数据。把它们融合，可以避免SiLU输出的物化；但并没有消除三次大矩阵乘法。把gate/up projection也合入另一个kernel，则是不同层次的GEMM/epilogue设计。\u003c/p>\n\u003ch2 id=\"h03\">backward从哪里来\u003c/h2>\n\u003cp>令上游对Z的梯度为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>Z\u003c/mi>\u003c/msub>\u003cannotation encoding=\"application/x-tex\">g_Z\u003c/annotation>\u003c/semantics>\u003c/math>，则\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>U\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>Z\u003c/mi>\u003c/msub>\u003cmo>⊙\u003c/mo>\u003cmi>S\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>U\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">g_U=g_Z\\odot SiLU(G),\u003c/annotation>\u003c/semantics>\u003c/math> \u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>Z\u003c/mi>\u003c/msub>\u003cmo>⊙\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>⊙\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>G\u003c/mi>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">g_G=g_Z\\odot U\\odot[\\sigma(G)+G\\sigma(G)(1-\\sigma(G))].\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>再通过矩阵反向公式求dX和dW。因为X同时参与gate与up，两个分支的dX需要相加，不能覆盖。训练融合还要解决保存或重算G/U的问题，推理kernel不自动拥有正确backward。\u003c/p>\n\u003ch2 id=\"h04\">项目里应当怎样区分\u003c/h2>\n\u003cp>基础 \u003ccode>_activation\u003c/code> 负责SiLU与Mul融合。Decode Gate/Up GEMV针对小M进行特定访存组织。调优版prefill GEMM涉及BM/BN/BK、warp和stage配置。这些实验的比较范围不同，有些只计gate/up，不包含down projection，不可称为完整MLP速度。\u003c/p>\n\u003cp>项目保留了部分dtype/shape慢于cuBLAS或编译基线的负结果。一个BF16随机矩阵上更快，不足以证明FP16或完整Qwen也更快。\u003c/p>\n\u003ch2 id=\"h05\">追问：能否把norm、gate/up、activation、down全部融合\u003c/h2>\n\u003cp>数学依赖存在不代表能高效放入一个CTA。跨tile重用、全局归约、寄存器容量和不同计算域会形成边界。合理方案常是只融合GEMM的适当prologue/epilogue，保留成熟库或模板的高吞吐核心。\u003c/p>\n","toc":[{"id":"h01","title":"Attention之外还需要什么","level":2},{"id":"h02","title":"从shape看计算量","level":2},{"id":"h03","title":"backward从哪里来","level":2},{"id":"h04","title":"项目里应当怎样区分","level":2},{"id":"h05","title":"追问：能否把norm、gate/up、activation、down全部融合","level":2}],"plain":"Attention之外还需要什么 Attention在token之间交换信息；FFN主要在每个token的特征维度上做非线性变换。普通两层MLP为 Y = ϕ ( X W 1 ) W 2 。Qwen采用门控结构： G = X W g , U = X W u , Z = S i L U ( G ) ⊙ U , Y = Z W d , S i L U ( x ) = x σ ( x ) , σ ( x ) = 1 1 + e − x . gate和up不是同一结果的复制，而是两套学习到的投影。gate的非线性值调节up的每个特征，因此有gate/up/down三块矩阵。 从shape看计算量 X为M×H，gate/up权重为H×I，down为I×H。三次GEMM合计约 6 M H I FLOPs。Qwen3-1.7B取H=2048、I=6144，单token约75.5MFLOPs，不包含activation和其他层。 SiLU和乘法都逐元素处理M×I数据。把它们融合，可以避免SiLU输出的物化；但并没有消除三次大矩阵乘法。把gate/up projection也合入另一个kernel，则是不同层次的GEMM/epilogue设计。 backward从哪里来 令上游对Z的梯度为 g Z ，则 g U = g Z ⊙ S i L U ( G ) , g G = g Z ⊙ U ⊙ [ σ ( G ) + G σ ( G ) ( 1 − σ ( G ) ) ] . 再通过矩阵反向公式求dX和dW。因为X同时参与gate与up，两个分支的dX需要相加，不能覆盖。训练融合还要解决保存或重算G/U的问题，推理kernel不自动拥有正确backward。 项目里应当怎样区分 基础 _activation 负责SiLU与Mul融合。Decode Gate/Up GEMV针对小M进行特定访存组织。调优版prefill GEMM涉及BM/BN/BK、warp和stage配置。这些实验的比较范围不同，有些只计gate/up，不包含down projection，不可称为完整MLP速度。 项目保留了部分dtype/shape慢于cuBLAS或编译基线的负结果。一个BF16随机矩阵上更快，不足以证明FP16或完整Qwen也更快。 追问：能否把norm、gate/up、activation、down全部融合 数学依赖存在不代表能高效放入一个CTA。跨tile重用、全局归约、寄存器容量和不同计算域会形成边界。合理方案常是只融合GEMM的适当prologue/epilogue，保留成熟库或模板的高吞吐核心。","charCount":967},{"id":"gqa-mla","title":"MHA、MQA、GQA 与 MLA：缓存什么，省在哪里","section":"model","summary":"从 head 共享推导 KV 容量，区分 Qwen 与 DeepSeek 的架构。","prereq":["attention","rope"],"sources":["gqa-paper","qconfig","sdpa","deepseek","qfsdp"],"tags":["GQA","MHA","MQA","MLA","KV Cache"],"level":1,"kind":"原理与推导","checks":[{"q":"Qwen3-1.7B与8B的GQA组大小一样吗？","a":"本项目1.7B是16/8=2；所验证8B结构是32/8=4。"},{"q":"DeepSeek-R1-Qwen3衍生权重是否证明用了MLA？","a":"不证明。应看模型架构与config，所验证checkpoint仍为Qwen3 GQA。"}],"lab":null,"raw":"## 为什么K/V成为容量问题\n生成新token时需要读取历史位置的K/V。若每个Q head都有独立K/V，这些缓存会随层数、batch和上下文长度增长。MHA取 $H_q=H_{kv}$；MQA取 $H_{kv}=1$；GQA介于两者之间，让一组Q共享一个KV head。\n\n若Hq=16、Hkv=8，group size为2。通常q head 0/1对应kv head0，2/3对应1。映射为\n\n$$h_{kv}=\\lfloor h_q/(H_q/H_{kv})\\rfloor.$$\n\n每个Q仍执行自己的score/PV，不是减少到只计算8个query。收益主要来自KV投影、存储及共享数据访问。\n\n## KV容量逐项推导\n一个token、一层，K与V各有Hkv×D个元素。B个序列、S个历史位置、L层、每元素b字节：\n\n$$M_{KV}=2BSLH_{kv}Db.$$\n\nQwen3-1.7B的B1/S512、L28/Hkv8/D128、FP16下为56MiB。若Hkv变为16，则112MiB。缓存预分配的capacity大于当前有效长度时，实际分配按capacity算，attention有效读长度仍应正确限制。\n\n## repeat为何抵消部分优势\n为了兼容普通MHA接口，可以复制K/V到Hq，但这样会增加临时存储和读取。`expand`本身可能是view；后续reshape是否还能成为view取决于stride，不能只看到expand就断言无复制。\n\n项目中compact GQA避免特定HF版本adapter的复制，保留原生Flash attention。框架版本与具体backend决定是否真的不物化，不应把一次实验推广到所有SDPA路径。\n\n## MLA不是更少几个heads的GQA\nDeepSeek-V3报告中的MLA把KV相关信息压缩为低维latent，再结合解耦位置部分与特定投影组织使用。其缓存对象与GQA的显式K/V heads不同，因此不能直接用上面的GQA容量式描述全部MLA缓存。MLA还涉及矩阵吸收和RoPE解耦等设计。\n\n本项目使用的是Qwen架构GQA。8B checkpoint虽然名称含DeepSeek，但报告明确其model_type为qwen3，不能因此说实现了DeepSeek-V3的MLA或MoE。\n\n## 实验室\n用KV计算器改变Hkv和S，确认容量线性变化。然后思考：S翻倍时，单步decode attention读缓存可能变多，但模型权重没有翻倍；因此完整step latency不一定恰好翻倍。\n","html":"\u003ch2 id=\"h01\">为什么K/V成为容量问题\u003c/h2>\n\u003cp>生成新token时需要读取历史位置的K/V。若每个Q head都有独立K/V，这些缓存会随层数、batch和上下文长度增长。MHA取 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">H_q=H_{kv}\u003c/annotation>\u003c/semantics>\u003c/math>；MQA取 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">H_{kv}=1\u003c/annotation>\u003c/semantics>\u003c/math>；GQA介于两者之间，让一组Q共享一个KV head。\u003c/p>\n\u003cp>若Hq=16、Hkv=8，group size为2。通常q head 0/1对应kv head0，2/3对应1。映射为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\" form=\"prefix\">⌊\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmi>/\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmi>/\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"false\" form=\"postfix\">⌋\u003c/mo>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">h_{kv}=\\lfloor h_q/(H_q/H_{kv})\\rfloor.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>每个Q仍执行自己的score/PV，不是减少到只计算8个query。收益主要来自KV投影、存储及共享数据访问。\u003c/p>\n\u003ch2 id=\"h02\">KV容量逐项推导\u003c/h2>\n\u003cp>一个token、一层，K与V各有Hkv×D个元素。B个序列、S个历史位置、L层、每元素b字节：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi>K\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmi>S\u003c/mi>\u003cmi>L\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>D\u003c/mi>\u003cmi>b\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">M_{KV}=2BSLH_{kv}Db.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>Qwen3-1.7B的B1/S512、L28/Hkv8/D128、FP16下为56MiB。若Hkv变为16，则112MiB。缓存预分配的capacity大于当前有效长度时，实际分配按capacity算，attention有效读长度仍应正确限制。\u003c/p>\n\u003ch2 id=\"h03\">repeat为何抵消部分优势\u003c/h2>\n\u003cp>为了兼容普通MHA接口，可以复制K/V到Hq，但这样会增加临时存储和读取。\u003ccode>expand\u003c/code>本身可能是view；后续reshape是否还能成为view取决于stride，不能只看到expand就断言无复制。\u003c/p>\n\u003cp>项目中compact GQA避免特定HF版本adapter的复制，保留原生Flash attention。框架版本与具体backend决定是否真的不物化，不应把一次实验推广到所有SDPA路径。\u003c/p>\n\u003ch2 id=\"h04\">MLA不是更少几个heads的GQA\u003c/h2>\n\u003cp>DeepSeek-V3报告中的MLA把KV相关信息压缩为低维latent，再结合解耦位置部分与特定投影组织使用。其缓存对象与GQA的显式K/V heads不同，因此不能直接用上面的GQA容量式描述全部MLA缓存。MLA还涉及矩阵吸收和RoPE解耦等设计。\u003c/p>\n\u003cp>本项目使用的是Qwen架构GQA。8B checkpoint虽然名称含DeepSeek，但报告明确其model_type为qwen3，不能因此说实现了DeepSeek-V3的MLA或MoE。\u003c/p>\n\u003ch2 id=\"h05\">实验室\u003c/h2>\n\u003cp>用KV计算器改变Hkv和S，确认容量线性变化。然后思考：S翻倍时，单步decode attention读缓存可能变多，但模型权重没有翻倍；因此完整step latency不一定恰好翻倍。\u003c/p>\n","toc":[{"id":"h01","title":"为什么K/V成为容量问题","level":2},{"id":"h02","title":"KV容量逐项推导","level":2},{"id":"h03","title":"repeat为何抵消部分优势","level":2},{"id":"h04","title":"MLA不是更少几个heads的GQA","level":2},{"id":"h05","title":"实验室","level":2}],"plain":"为什么K/V成为容量问题 生成新token时需要读取历史位置的K/V。若每个Q head都有独立K/V，这些缓存会随层数、batch和上下文长度增长。MHA取 H q = H k v ；MQA取 H k v = 1 ；GQA介于两者之间，让一组Q共享一个KV head。 若Hq=16、Hkv=8，group size为2。通常q head 0/1对应kv head0，2/3对应1。映射为 h k v = ⌊ h q / ( H q / H k v ) ⌋ . 每个Q仍执行自己的score/PV，不是减少到只计算8个query。收益主要来自KV投影、存储及共享数据访问。 KV容量逐项推导 一个token、一层，K与V各有Hkv×D个元素。B个序列、S个历史位置、L层、每元素b字节： M K V = 2 B S L H k v D b . Qwen3-1.7B的B1/S512、L28/Hkv8/D128、FP16下为56MiB。若Hkv变为16，则112MiB。缓存预分配的capacity大于当前有效长度时，实际分配按capacity算，attention有效读长度仍应正确限制。 repeat为何抵消部分优势 为了兼容普通MHA接口，可以复制K/V到Hq，但这样会增加临时存储和读取。 expand 本身可能是view；后续reshape是否还能成为view取决于stride，不能只看到expand就断言无复制。 项目中compact GQA避免特定HF版本adapter的复制，保留原生Flash attention。框架版本与具体backend决定是否真的不物化，不应把一次实验推广到所有SDPA路径。 MLA不是更少几个heads的GQA DeepSeek-V3报告中的MLA把KV相关信息压缩为低维latent，再结合解耦位置部分与特定投影组织使用。其缓存对象与GQA的显式K/V heads不同，因此不能直接用上面的GQA容量式描述全部MLA缓存。MLA还涉及矩阵吸收和RoPE解耦等设计。 本项目使用的是Qwen架构GQA。8B checkpoint虽然名称含DeepSeek，但报告明确其model_type为qwen3，不能因此说实现了DeepSeek-V3的MLA或MoE。 实验室 用KV计算器改变Hkv和S，确认容量线性变化。然后思考：S翻倍时，单步decode attention读缓存可能变多，但模型权重没有翻倍；因此完整step latency不一定恰好翻倍。","charCount":978},{"id":"gpu-execution","title":"CUDA 执行模型：Thread → Warp → CTA → SM","section":"gpu","summary":"从向量加法推导并行索引、同步范围与 occupancy。","prereq":["tensor-layout","roofline"],"sources":["cuda-guide","triton-add","qtuning"],"tags":["CUDA","SM","Warp","CTA","Occupancy"],"level":1,"kind":"原理与推导","checks":[{"q":"block A写完，block B一定能直接读取最终结果吗？","a":"不能依赖任意block执行顺序。需要明确的跨block同步设计或后续kernel边界。"},{"q":"num_warps=4能证明每个head由128个独立元素线程计算吗？","a":"不能。它规定warp配置，逻辑tensor到线程/寄存器的映射仍由编译器决定。"}],"lab":null,"raw":"## 为什么需要很多线程\nCPU擅长复杂控制与低延迟，GPU通过大量并行线程获得吞吐。CUDA把一次kernel launch组织成grid，grid包含多个thread blocks（CTA），block包含threads。一个block在一个SM上执行；多个block可先后或并发调度，程序不能依赖任意两个block的执行顺序。\n\n```cpp\n__global__ void add(const float* a, const float* b,\n                    float* c, int n) {\n    int i = blockIdx.x * blockDim.x + threadIdx.x;\n    if (i \u003c n) c[i] = a[i] + b[i];\n}\n// host: add\u003c\u003c\u003c(n+255)/256, 256>>>(a,b,c,n);\n```\n\n每个线程处理一个i，最后一个block可能有越界线程，所以需要mask/条件。这里不是“一核对应一个线程”；同一SM会调度许多warp，线程是逻辑执行上下文。\n\n## Warp与分支\nNVIDIA warp通常为32个线程。相邻线程执行同一指令路径时效率较好；同一warp分支不同可能需要分别执行各路径。不同program/CTA走不同分支，不等于同一warp内部发生divergence。\n\nQK融合中head类型对一个program一致，因此Q/K选择是program-uniform分支。不能把它误说成每个lane随机处理Q或K。\n\n## 同步范围要说清\n`__syncthreads()`是block范围barrier，要求相应参与线程都能正确到达。不能在只被部分线程进入的条件分支中随意调用。Warp-level交换依赖有效线程mask；跨warp用shared memory传值时需要匹配的内存/同步机制。Warp shuffle本身不替代任意跨warp同步。\n\n跨block规约通常采用额外kernel、atomics或有约束的协作机制。把两个需要全局同步的阶段放进普通kernel并不会自动得到全局barrier。\n\n## Occupancy不是分数越高越好\n活跃warp数量受到register、shared memory、线程/CTA资源上限约束。更多驻留warp可能隐藏访存延迟，但每线程保留更多中间结果也可能减少读写。为追求occupancy而牺牲数据复用，可能更慢。\n\n不同GPU的warp/SM资源、Tensor Core指令与shared-memory容量需要查对应架构。不要将Hopper的WGMMA/TMA优化直接套到A6000实验。\n\n## 项目连接\nTriton `num_warps=4`是编译资源配置，不代表D=128时恰好一个元素一个线程且永不变化。要证明寄存器和occupancy，应查看编译产物与硬件报告，不能仅靠Python源码猜。\n","html":"\u003ch2 id=\"h01\">为什么需要很多线程\u003c/h2>\n\u003cp>CPU擅长复杂控制与低延迟，GPU通过大量并行线程获得吞吐。CUDA把一次kernel launch组织成grid，grid包含多个thread blocks（CTA），block包含threads。一个block在一个SM上执行；多个block可先后或并发调度，程序不能依赖任意两个block的执行顺序。\u003c/p>\n\u003cpre class=\"cpp\">\u003ccode>__global__ void add(const float* a, const float* b,\n                    float* c, int n) {\n    int i = blockIdx.x * blockDim.x + threadIdx.x;\n    if (i &lt; n) c[i] = a[i] + b[i];\n}\n// host: add&lt;&lt;&lt;(n+255)/256, 256&gt;&gt;&gt;(a,b,c,n);\u003c/code>\u003c/pre>\n\u003cp>每个线程处理一个i，最后一个block可能有越界线程，所以需要mask/条件。这里不是“一核对应一个线程”；同一SM会调度许多warp，线程是逻辑执行上下文。\u003c/p>\n\u003ch2 id=\"h02\">Warp与分支\u003c/h2>\n\u003cp>NVIDIA warp通常为32个线程。相邻线程执行同一指令路径时效率较好；同一warp分支不同可能需要分别执行各路径。不同program/CTA走不同分支，不等于同一warp内部发生divergence。\u003c/p>\n\u003cp>QK融合中head类型对一个program一致，因此Q/K选择是program-uniform分支。不能把它误说成每个lane随机处理Q或K。\u003c/p>\n\u003ch2 id=\"h03\">同步范围要说清\u003c/h2>\n\u003cp>\u003ccode>__syncthreads()\u003c/code>是block范围barrier，要求相应参与线程都能正确到达。不能在只被部分线程进入的条件分支中随意调用。Warp-level交换依赖有效线程mask；跨warp用shared memory传值时需要匹配的内存/同步机制。Warp shuffle本身不替代任意跨warp同步。\u003c/p>\n\u003cp>跨block规约通常采用额外kernel、atomics或有约束的协作机制。把两个需要全局同步的阶段放进普通kernel并不会自动得到全局barrier。\u003c/p>\n\u003ch2 id=\"h04\">Occupancy不是分数越高越好\u003c/h2>\n\u003cp>活跃warp数量受到register、shared memory、线程/CTA资源上限约束。更多驻留warp可能隐藏访存延迟，但每线程保留更多中间结果也可能减少读写 Coalescing","bank conflict","shared memory","GDDR6"],"level":1,"kind":"原理与推导","checks":[{"q":"contiguous Tensor一定意味着kernel合并访存好吗？","a":"不一定。取决于同一warp同一访存指令实际请求的地址集合。"},{"q":"shared memory加padding为什么可能有帮助？","a":"改变行stride，使相邻线程按列访问时落到不同bank；但要结合dtype和架构验证。"}],"lab":null,"raw":"## 先分清存储层\n寄存器通常是线程私有的高速状态；shared memory在CTA内显式协作；L1/L2是硬件cache；global memory来自设备DRAM。A6000使用GDDR6，不能将所有设备显存都称HBM。线程私有的local memory名字容易误导：register spilling可能落到设备内存路径，不是免费的寄存器。\n\n## Coalescing看的是同一条访存指令的地址集合\n一个warp的32个线程读取连续FP32元素，共128字节。若访问落在少量对齐sector，事务效率较高。若每个线程跨很大stride读取，可能触及很多sector，实际传输字节大于有用字节。\n\n不是说线程顺序必须严格单调；即使地址被线程间置换，只要覆盖相同少量sector，也可能合并良好。反之，Tensor整体contiguous不保证某个kernel的线程索引模式coalesced。\n\n## 转置为什么是经典例子\n朴素转置可以做到连续读，但输出地址对相邻线程相距一整行，写入不连续。常见方法把tile连续读入shared memory，在线程间交换访问方向，再连续写出。\n\n在简化的32个bank、4字节宽度模型下，bank索引近似为 `(word_address % 32)`。若shared数组是 `[32][32]`，某些按列读取让线程访问同一bank的不同地址，会产生bank conflict。加一列padding为 `[32][33]` 可改变stride，分散bank。实际行为受元素宽度、广播和硬件架构影响，不能只凭数组维度替代测量。\n\n## Tiling为何有效\nGEMM的A tile会被同一输出tile内多个列复用，B tile会被多个行复用。把tile保存在片上，减少重复从global memory取数。代价是更多片上资源和同步，tile不可能无限大。\n\n## 项目里哪些是证据，哪些是假设\nQ布局55.4→29.1μs和peak delta下降说明指定路径改善；源码显示去掉了部分copy。它们不能直接证明精确的DRAM事务减少百分比，更不能证明所有数据只读一次。项目QK代码为RoPE配对还会显式加载x/xp与w/wp，实际cache行为需要进一步分析。\n\n更好的实验是保持公式与输入不变，仅改变layout或tile，比较设备时间与端到端时间，并查看真实memory counters。权限不够时，就将计数器结论留空。\n","html":"\u003ch2 id=\"h01\">先分清存储层\u003c/h2>\n\u003cp>寄存器通常是线程私有的高速状态；shared memory在CTA内显式协作；L1/L2是硬件cache；global memory来自设备DRAM。A6000使用GDDR6，不能将所有设备显存都称HBM。线程私有的local memory名字容易误导：register spilling可能落到设备内存路径，不是免费的寄存器。\u003c/p>\n\u003ch2 id=\"h02\">Coalescing看的是同一条访存指令的地址集合\u003c/h2>\n\u003cp>一个warp的32个线程读取连续FP32元素，共128字节。若访问落在少量对齐sector，事务效率较高。若每个线程跨很大stride读取，可能触及很多sector，实际传输字节大于有用字节。\u003c/p>\n\u003cp>不是说线程顺序必须严格单调；即使地址被线程间置换，只要覆盖相同少量sector，也可能合并良好。反之，Tensor整体contiguous不保证某个kernel的线程索引模式coalesced。\u003c/p>\n\u003ch2 id=\"h03\">转置为什么是经典例子\u003c/h2>\n\u003cp>朴素转置可以做到连续读，但输出地址对相邻线程相距一整行，写入不连续。常见方法把tile连续读入shared memory，在线程间交换访问方向，再连续写出。\u003c/p>\n\u003cp>在简化的32个bank、4字节宽度模型下，bank索引近似为 \u003ccode>(word_address % 32)\u003c/code>。若shared数组是 \u003ccode>[32][32]\u003c/code>，某些按列读取让线程访问同一bank的不同地址，会产生bank conflict。加一列padding为 \u003ccode>[32][33]\u003c/code> 可改变stride，分散bank。实际行为受元素宽度、广播和硬件架构影响，不能只凭数组维度替代测量。\u003c/p>\n\u003ch2 id=\"h04\">Tiling为何有效\u003c/h2>\n\u003cp>GEMM的A tile会被同一输出tile内多个列复用，B tile会被多个行复用。把tile保存在片上，减少重复从global memory取数。代价是更多片上资源和同步，tile不可能无限大。\u003c/p>\n\u003ch2 id=\"h05\">项目里哪些是证据，哪些是假设\u003c/h2>\n\u003cp>Q布局55.4→29.1μs和peak delta下降说明指定路径改善；源码显示去掉了部分copy。它们不能直接证明精确的DRAM事务减少百分比，更不能证明所有数据只读一次。项目QK代码为RoPE配对还会显式加载x/xp与w/wp，实际cache行为需要进一步分析。\u003c/p>\n\u003cp>更好的实验是保持公式与输入不变，仅改变layout或tile，比较设备时间与端到端时间，并查看真实memory counters。权限不够时，就将计数器结论留空。\u003c/p>\n","toc":[{"id":"h01","title":"先分清存储层","level":2},{"id":"h02","title":"Coalescing看的是同一条访存指令的地址集合","level":2},{"id":"h03","title":"转置为什么是经典例子","level":2},{"id":"h04","title":"Tiling为何有效","level":2},{"id":"h05","title":"项目里哪些是证据，哪些是假设","level":2}],"plain":"先分清存储层 寄存器通常是线程私有的高速状态；shared memory在CTA内显式协作；L1/L2是硬件cache；global memory来自设备DRAM。A6000使用GDDR6，不能将所有设备显存都称HBM。线程私有的local memory名字容易误导：register spilling可能落到设备内存路径，不是免费的寄存器。 Coalescing看的是同一条访存指令的地址集合 一个warp的32个线程读取连续FP32元素，共128字节。若访问落在少量对齐sector，事务效率较高。若每个线程跨很大stride读取，可能触及很多sector，实际传输字节大于有用字节。 不是说线程顺序必须严格单调；即使地址被线程间置换，只要覆盖相同少量sector，也可能合并良好。反之，Tensor整体contiguous不保证某个kernel的线程索引模式coalesced。 转置为什么是经典例子 朴素转置可以做到连续读，但输出地址对相邻线程相距一整行，写入不连续。常见方法把tile连续读入shared memory，在线程间交换访问方向，再连续写出。 在简化的32个bank、4字节宽度模型下，bank索引近似为 (word_address % 32) 。若shared数组是 [32][32] ，某些按列读取让线程访问同一bank的不同地址，会产生bank conflict。加一列padding为 [32][33] 可改变stride，分散bank。实际行为受元素宽度、广播和硬件架构影响，不能只凭数组维度替代测量。 Tiling为何有效 GEMM的A tile会被同一输出tile内多个列复用，B tile会被多个行复用。把tile保存在片上，减少重复从global memory取数。代价是更多片上资源和同步，tile不可能无限大。 项目里哪些是证据，哪些是假设 Q布局55.4→29.1μs和peak delta下降说明指定路径改善；源码显示去掉了部分copy。它们不能直接证明精确的DRAM事务减少百分比，更不能证明所有数据只读一次。项目QK代码为RoPE配对还会显式加载x/xp与w/wp，实际cache行为需要进一步分析。 更好的实验是保持公式与输入不变，仅改变layout或tile，比较设备时间与端到端时间，并查看真实memory counters。权限不够时，就将计数器结论留空。","charCount":977},{"id":"gemm-tiling","title":"GEMM Tiling 与 Tensor Core：从循环到分块","section":"gpu","summary":"推导 tile 的复用次数，理解寄存器累积、pipeline 与 epilogue。","prereq":["gpu-memory","gemm-flops","swiglu"],"sources":["triton-matmul","nvidia-matmul","qtuning"],"tags":["GEMM","Tensor Core","tiling","pipeline"],"level":1,"kind":"原理与推导","checks":[{"q":"扩大BM/BN一定更好吗？","a":"复用可能提高，但寄存器、shared memory、并行度和边界浪费会制约收益。"},{"q":"kernel比cuBLAS×2快，是否代表比所有融合GEMM实现快？","a":"不代表。必须写清packed GEMM、epilogue、compile等强基线是否参与对照。"}],"lab":null,"raw":"## 最朴素实现为什么重复取数\n计算C[i,j]需要遍历k。若每个线程只负责一个输出，并各自加载A行和B列，邻近输出会反复访问同一输入。Cache可能缓解，却不能替代设计良好的复用。\n\n将输出分成BM×BN tile，K按BK分块。每轮加载A的BM×BK块、B的BK×BN块，更新BM×BN个累加器。\n\n$$C_{tile}\\mathrel{+}=A_{tile}B_{tile}.$$\n\n这轮完成约 $2B_MB_NB_K$ FLOPs，加载约 $bB_K(B_M+B_N)$ 字节。较大的BM/BN提高复用，但增加累加器和片上资源占用。\n\n## Tensor Core不是自动等于高性能\nTensor Core执行特定shape/dtype的矩阵乘加指令。库或编译器必须把大矩阵分解成支持的指令形态，并处理对齐、边界、数据布局和累加精度。小M可能使tile利用率差；K/N非整齐会产生mask或padding成本。\n\nTF32、FP16、BF16、FP8的支持与吞吐随架构变化；不能把某型号峰值用于另一dtype。即便计算很快，搬数据或启动不足也会使实际吞吐远离峰值。\n\n## 软件流水线怎样隐藏等待\n当前K tile计算时预取下一块，可以在依赖允许时重叠加载与计算。`num_stages`更多通常意味着更多缓冲与资源占用，并不单调提速。必须在BM/BN/BK/warps/stages组合中做受控扫描。\n\n```text\n阶段 0: load K-tile 0\n阶段 1: compute tile 0 + prepare tile 1\n阶段 2: compute tile 1 + prepare tile 2\n结束: epilogue + store C\n```\n\n## epilogue与fusion\nGEMM后紧接bias/activation时，可以在累加器写回之前做适当变换，避免完整中间矩阵。若消费者要求跨tile归约或不兼容布局，则不一定适合融合。一个producer有多个消费者，也不代表绝对不能融合，而是需要权衡物化、重算与数据复用。\n\n## 对应项目实验\n仓库的Gate/Up GEMM调优扫了选定BM/BN/BK/warps/stages组合，不是全笛卡尔积。在相同舍入路径上比较tile，才便于隔离性能因素。它保留FP16某些shape慢于cuBLAS的结果，而且benchmark不包含down projection，也不是完整训练。\n\n实验应报告最佳值的搜索范围、调优成本和独立复测。只公布某shape上一次最优值，不能推出通用kernel的优势。\n","html":"\u003ch2 id=\"h01\">最朴素实现为什么重复取数\u003c/h2>\n\u003cp>计算C[i,j]需要遍历k。若每个线程只负责一个输出，并各自加载A行和B列，邻近输出会反复访问同一输入。Cache可能缓解，却不能替代设计良好的复用。\u003c/p>\n\u003cp>将输出分成BM×BN tile，K按BK分块。每轮加载A的BM×BK块、B的BK×BN块，更新BM×BN个累加器。\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>l\u003c/mi>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>l\u003c/mi>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>l\u003c/mi>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">C_{tile}\\mathrel{+}=A_{tile}B_{tile}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这轮完成约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>M\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>N\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">2B_MB_NB_K\u003c/annotation>\u003c/semantics>\u003c/math> FLOPs，加载约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>M\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi>N\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">bB_K(B_M+B_N)\u003c/annotation>\u003c/semantics>\u003c/math> 字节。较大的BM/BN提高复用，但增加累加器和片上资源占用。\u003c/p>\n\u003ch2 id=\"h02\">Tensor Core不是自动等于高性能\u003c/h2>\n\u003cp>Tensor Core执行特定shape/dtype的矩阵乘加指令。库或编译器必须把大矩阵分解成支持的指令形态，并处理对齐、边界、数据布局和累加精度。小M可能使tile利用率差；K/N非整齐会产生mask或padding成本。\u003c/p>\n\u003cp>TF32、FP16、BF16、FP8的支持与吞吐随架构变化；不能把某型号峰值用于另一dtype。即便计算很快，搬数据或启动不足也会使实际吞吐远离峰值。\u003c/p>\n\u003ch2 id=\"h03\">软件流水线怎样隐藏等待\u003c/h2>\n\u003cp>当前K tile计算时预取下一块，可以在依赖允许时重叠加载与计算。\u003ccode>num_stages\u003c/code>更多通常意味着更多缓冲与资源占用，并不单调提速。必须在BM/BN/BK/warps/stages组合中做受控扫描。\u003c/p>\n\u003cpre class=\"text\">\u003ccode>阶段 0: load K-tile 0\n阶段 1: compute tile 0 + prepare tile 1\n阶段 2: compute tile 1 + prepare tile 2\n结束: epilogue + store C\u003c/code>\u003c/pre>\n\u003ch2 id=\"h04\">epilogue与fusion\u003c/h2>\n\u003cp>GEMM后紧接bias/activation时，可以在累加器写回之前做适当变换，避免完整中间矩阵。若消费者要求跨tile归约或不兼容布局，则不一定适合融合。一个producer有多个消费者，也不代表绝对不能融合，而是需要权衡物化、重算与数据复用。\u003c/p>\n\u003ch2 id=\"h05\">对应项目实验\u003c/h2>\n\u003cp>仓库的Gate/Up GEMM调优扫了选定BM/BN/BK/warps/stages组合，不是全笛卡尔积。在相同舍入路径上比较tile，才便于隔离性能因素。它保留FP16某些shape慢于cuBLAS的结果，而且benchmark不包含down projection，也不是完整训练。\u003c/p>\n\u003cp>实验应报告最佳值的搜索范围、调优成本和独立复测。只公布某shape上一次最优值，不能推出通用kernel的优势。\u003c/p>\n","toc":[{"id":"h01","title":"最朴素实现为什么重复取数","level":2},{"id":"h02","title":"Tensor Core不是自动等于高性能","level":2},{"id":"h03","title":"软件流水线怎样隐藏等待","level":2},{"id":"h04","title":"epilogue与fusion","level":2},{"id":"h05","title":"对应项目实验","level":2}],"plain":"最朴素实现为什么重复取数 计算C[i,j]需要遍历k。若每个线程只负责一个输出，并各自加载A行和B列，邻近输出会反复访问同一输入。Cache可能缓解，却不能替代设计良好的复用。 将输出分成BM×BN tile，K按BK分块。每轮加载A的BM×BK块、B的BK×BN块，更新BM×BN个累加器。 C t i l e + = A t i l e B t i l e . 这轮完成约 2 B M B N B K FLOPs，加载约 b B K ( B M + B N ) 字节。较大的BM/BN提高复用，但增加累加器和片上资源占用。 Tensor Core不是自动等于高性能 Tensor Core执行特定shape/dtype的矩阵乘加指令。库或编译器必须把大矩阵分解成支持的指令形态，并处理对齐、边界、数据布局和累加精度。小M可能使tile利用率差；K/N非整齐会产生mask或padding成本。 TF32、FP16、BF16、FP8的支持与吞吐随架构变化；不能把某型号峰值用于另一dtype。即便计算很快，搬数据或启动不足也会使实际吞吐远离峰值。 软件流水线怎样隐藏等待 当前K tile计算时预取下一块，可以在依赖允许时重叠加载与计算。 num_stages 更多通常意味着更多缓冲与资源占用，并不单调提速。必须在BM/BN/BK/warps/stages组合中做受控扫描。 阶段 0: load K-tile 0 阶段 1: compute tile 0 + prepare tile 1 阶段 2: compute tile 1 + prepare tile 2 结束: epilogue + store C epilogue与fusion GEMM后紧接bias/activation时，可以在累加器写回之前做适当变换，避免完整中间矩阵。若消费者要求跨tile归约或不兼容布局，则不一定适合融合。一个producer有多个消费者，也不代表绝对不能融合，而是需要权衡物化、重算与数据复用。 对应项目实验 仓库的Gate/Up GEMM调优扫了选定BM/BN/BK/warps/stages组合，不是全笛卡尔积。在相同舍入路径上比较tile，才便于隔离性能因素。它保留FP16某些shape慢于cuBLAS的结果，而且benchmark不包含down projection，也不是完整训练。 实验应报告最佳值的搜索范围、调优成本和独立复测。只公布某shape上一次最优值，不能推出通用kernel的优势。","charCount":969},{"id":"reduction-softmax","title":"Reduction 与 Online Softmax：怎样分块还保持同一答案","section":"gpu","summary":"从树形归约到可合并的 max、denominator、output 三元组。","prereq":["attention","gpu-execution","floating-point"],"sources":["online-softmax","triton-softmax","flash"],"tags":["Reduction","Online Softmax","LSE","FlashAttention"],"level":1,"kind":"原理与推导","checks":[{"q":"两个块softmax输出可以简单取平均吗？","a":"不能。每块的归一化分母不同，需按对应LSE/指数分母权重合并。"},{"q":"max归约的无效位置为什么一般不能填0？","a":"有效分数全为负时0会改变最大值；更重要的是无效位置不能贡献分母。"}],"lab":"labs/02_online_softmax.py","raw":"## reduction为什么不是普通逐元素计算\n逐元素add的每个输出只依赖对应输入；sum/max需要把多个元素合并。串行求和的依赖深度为N；树形归约把深度降为log₂N，但总加法仍约N−1。改变归约树可能改变浮点舍入顺序。\n\n若一行长度不是block大小的整数倍，需要mask。sum可用0作为无效位置的幺元，max应考虑负无穷。softmax中只给max正确幺元仍不够：无效位置的指数贡献也必须为0，全mask行需要定义。\n\n## stable softmax从两次统计开始\n对分数序列s，令 $m=\\max s_j$，$l=\\sum_j e^{s_j-m}$，则 $p_j=e^{s_j-m}/l$。直接实现通常先求m，再求l，最后归一化。\n\n长序列不能总把一整行放片上，能否逐块合并？设块A的统计为(mA,lA)，块B为(mB,lB)，统一最大值 $m=\\max(m_A,m_B)$ 后：\n\n$$l=e^{m_A-m}l_A+e^{m_B-m}l_B.$$\n\n这是因为两块的指数原点不同，必须重新缩放到同一个m。不是把两个分母直接相加。\n\n## Attention输出也能同时累加\n令块的未归一化输出 $u_A=\\sum_{j\\in A}e^{s_j-m_A}V_j$，B同理，则\n\n$$u=e^{m_A-m}u_A+e^{m_B-m}u_B,\\qquad O=u/l.$$\n\n这样只需保留m、l和一个输出向量，不需要保存整行probabilities。它是FlashAttention及split-KV合并的关键数学基础。\n\n如果各块保存的是已经归一化的输出 $O_j$ 和 $LSE_j=\\log\\sum e^{s}$，则总输出必须按 $e^{LSE_j-\\max LSE}$ 加权后再除以权重和，不能简单平均各块结果。\n\n## 边界与数值\n公式在实数上等价，执行顺序不同可产生舍入差异。最大值都是负无穷时，`-inf - -inf`会产生NaN，因此必须给全mask行明确处理。Softmax整体平移不变是一条有用的metamorphic relation，但浮点溢出、mask和特定contract仍需考虑。\n\n## 实践\n`labs/02_online_softmax.py` 将随机score/value切块，逐块更新m/l/u，再与完整softmax输出对比。它在CPU float64上验证代数关系，不代表已经实现高性能GPU attention。\n","html":"\u003ch2 id=\"h01\">reduction为什么不是普通逐元素计算\u003c/h2>\n\u003cp>逐元素add的每个输出只依赖对应输入；sum/max需要把多个元素合并。串行求和的依赖深度为N；树形归约把深度降为log₂N，但总加法仍约N−1。改变归约树可能改变浮点舍入顺序。\u003c/p>\n\u003cp>若一行长度不是block大小的整数倍，需要mask。sum可用0作为无效位置的幺元，max应考虑负无穷。softmax中只给max正确幺元仍不够：无效位置的指数贡献也必须为0，全mask行需要定义。\u003c/p>\n\u003ch2 id=\"h02\">stable softmax从两次统计开始\u003c/h2>\n\u003cp>对分数序列s，令 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>max\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">m=\\max s_j\u003c/annotation>\u003c/semantics>\u003c/math>，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>l\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∑\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">l=\\sum_j e^{s_j-m}\u003c/annotation>\u003c/semantics>\u003c/math>，则 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmi>/\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">p_j=e^{s_j-m}/l\u003c/annotation>\u003c/semantics>\u003c/math>。直接实现通常先求m，再求l，最后归一化。\u003c/p>\n\u003cp>长序列不能总把一整行放片上，能否逐块合并？设块A的统计为(mA,lA)，块B为(mB,lB)，统一最大值 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c
