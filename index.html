-recompute"],"sources":["nccl","megatron","qbfsdp"],"tags":["NCCL","All-Reduce","All-Gather","Reduce-Scatter","Ring"],"level":1,"kind":"原理与推导","checks":[{"q":"N=4,S=1GiB，单卡ring总发送多少？","a":"2×3/4×1=1.5GiB；接收也是1.5GiB；全网发送6GiB。"},{"q":"All-Gather是否把梯度求和？","a":"不，它聚合/拼接分片。数值归约发生在Reduce/All-Reduce/Reduce-Scatter中。"}],"lab":"labs/03_sharding.py","raw":"## Rank并不是GPU全局物理编号\nRank是通信组中的进程编号。通常每进程绑定一个GPU，但进程组可不同，local rank与global rank也不同。Collective要求各参与rank遵守一致的调用顺序、shape/count与dtype契约；一张卡跳过调用可能使其他卡永久等待。\n\n## 三个操作用数组解释\n两卡分别持有 `[1,2]`、`[3,4]`，All-Gather后两卡都得到 `[1,2,3,4]`。这里是拼接，不是相加。\n\nReduce-Scatter的输入若各为完整4元素：rank0 `[1,2,3,4]`，rank1 `[10,20,30,40]`，SUM归约为 `[11,22,33,44]`，rank0接收前半 `[11,22]`，rank1接收后半 `[33,44]`。\n\nAll-Reduce则让每张卡都拿到完整 `[11,22,33,44]`。概念上，SUM Reduce-Scatter后All-Gather可组成相同语义。\n\n## 平均梯度为什么还要除以world size\n每卡loss是相同有效token数上的mean时，全局平均梯度为 $g=\\frac1N\\sum_r g_r$。SUM只做求和，需除以N。有效token数不同应使用加权平均，不是简单除rank数。\n\n## Ring公式从哪里来\n设每个rank参与规约的完整张量为S字节，切成N块，每块S/N。Reduce-Scatter需要N−1轮，All-Gather再N−1轮。每轮每卡发送一块，因此单卡总发送量\n\n$$V_{send}=2\\frac{N-1}{N}S.$$\n\n接收量同样大。若统计send+recv字节则应再翻倍；全网发送总量则约 $2(N-1)S$。所以“总通信与卡数无关”是错误表述，渐近接近2S的是每卡发送量。\n\n带每轮延迟alpha的简化模型为\n\n$$T\\approx2(N-1)\\alpha+2\\frac{N-1}{N}\\frac S{BW}.$$\n\n小消息和大N时延迟项不可忽略。真实NCCL可能选择tree、分层或多通道，并非任何collective都固定用单ring。\n\n## NVLink、PCIe与RDMA\n拓扑决定有效路径。NVLink/NVSwitch、PCIe与跨机IB/RoCE的成本不同；跨机TP不是数学上不可能，而是每层频繁通信可能很贵。RDMA允许网络设备按配置直接访问内存，但不会取消拥塞、同步和拓扑限制。\n\n`labs/03_sharding.py`在CPU模拟上述数组语义与梯度等价性，不测NCCL性能。\n","html":"\u003ch2 id=\"h01\">Rank并不是GPU全局物理编号\u003c/h2>\n\u003cp>Rank是通信组中的进程编号。通常每进程绑定一个GPU，但进程组可不同，local rank与global rank也不同。Collective要求各参与rank遵守一致的调用顺序、shape/count与dtype契约；一张卡跳过调用可能使其他卡永久等待。\u003c/p>\n\u003ch2 id=\"h02\">三个操作用数组解释\u003c/h2>\n\u003cp>两卡分别持有 \u003ccode>[1,2]\u003c/code>、\u003ccode>[3,4]\u003c/code>，All-Gather后两卡都得到 \u003ccode>[1,2,3,4]\u003c/code>。这里是拼接，不是相加。\u003c/p>\n\u003cp>Reduce-Scatter的输入若各为完整4元素：rank0 \u003ccode>[1,2,3,4]\u003c/code>，rank1 \u003ccode>[10,20,30,40]\u003c/code>，SUM归约为 \u003ccode>[11,22,33,44]\u003c/code>，rank0接收前半 \u003ccode>[11,22]\u003c/code>，rank1接收后半 \u003ccode>[33,44]\u003c/code>。\u003c/p>\n\u003cp>All-Reduce则让每张卡都拿到完整 \u003ccode>[11,22,33,44]\u003c/code>。概念上，SUM Reduce-Scatter后All-Gather可组成相同语义。\u003c/p>\n\u003ch2 id=\"h03\">平均梯度为什么还要除以world size\u003c/h2>\n\u003cp>每卡loss是相同有效token数上的mean时，全局平均梯度为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmsub>\u003cmo>∑\u003c/mo>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">g=\\frac1N\\sum_r g_r\u003c/annotation>\u003c/semantics>\u003c/math>。SUM只做求和，需除以N。有效token数不同应使用加权平均，不是简单除rank数。\u003c/p>\n\u003ch2 id=\"h04\">Ring公式从哪里来\u003c/h2>\n\u003cp>设每个rank参与规约的完整张量为S字节，切成N块，每块S/N。Reduce-Scatter需要N−1轮，All-Gather再N−1轮。每轮每卡发送一块，因此单卡总发送量\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmfrac>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmi>S\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">V_{send}=2\\frac{N-1}{N}S.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>接收量同样大。若统计send+recv字节则应再翻倍；全网发送总量则约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>S\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">2(N-1)S\u003c/annotation>\u003c/semantics>\u003c/math>。所以“总通信与卡数无关”是错误表述，渐近接近2S的是每卡发送量。\u003c/p>\n\u003cp>带每轮延迟alpha的简化模型为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>α\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmfrac>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmfrac>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">T\\approx2(N-1)\\alpha+2\\frac{N-1}{N}\\frac S{BW}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>小消息和大N时延迟项不可忽略。真实NCCL可能选择tree、分层或多通道，并非任何collective都固定用单ring。\u003c/p>\n\u003ch2 id=\"h05\">NVLink、PCIe与RDMA\u003c/h2>\n\u003cp>拓扑决定有效路径。NVLink/NVSwitch、PCIe与跨机IB/RoCE的成本不同；跨机TP不是数学上不可能，而是每层频繁通信可能很贵。RDMA允许网络设备按配置直接访问内存，但不会取消拥塞、同步和拓扑限制。\u003c/p>\n\u003cp>\u003ccode>labs/03_sharding.py\u003c/code>在CPU模拟上述数组语义与梯度等价性，不测NCCL性能。\u003c/p>\n","toc":[{"id":"h01","title":"Rank并不是GPU全局物理编号","level":2},{"id":"h02","title":"三个操作用数组解释","level":2},{"id":"h03","title":"平均梯度为什么还要除以world size","level":2},{"id":"h04","title":"Ring公式从哪里来","level":2},{"id":"h05","title":"NVLink、PCIe与RDMA","level":2}],"plain":"Rank并不是GPU全局物理编号 Rank是通信组中的进程编号。通常每进程绑定一个GPU，但进程组可不同，local rank与global rank也不同。Collective要求各参与rank遵守一致的调用顺序、shape/count与dtype契约；一张卡跳过调用可能使其他卡永久等待。 三个操作用数组解释 两卡分别持有 [1,2] 、 [3,4] ，All-Gather后两卡都得到 [1,2,3,4] 。这里是拼接，不是相加。 Reduce-Scatter的输入若各为完整4元素：rank0 [1,2,3,4] ，rank1 [10,20,30,40] ，SUM归约为 [11,22,33,44] ，rank0接收前半 [11,22] ，rank1接收后半 [33,44] 。 All-Reduce则让每张卡都拿到完整 [11,22,33,44] 。概念上，SUM Reduce-Scatter后All-Gather可组成相同语义。 平均梯度为什么还要除以world size 每卡loss是相同有效token数上的mean时，全局平均梯度为 g = 1 N ∑ r g r 。SUM只做求和，需除以N。有效token数不同应使用加权平均，不是简单除rank数。 Ring公式从哪里来 设每个rank参与规约的完整张量为S字节，切成N块，每块S/N。Reduce-Scatter需要N−1轮，All-Gather再N−1轮。每轮每卡发送一块，因此单卡总发送量 V s e n d = 2 N − 1 N S . 接收量同样大。若统计send+recv字节则应再翻倍；全网发送总量则约 2 ( N − 1 ) S 。所以“总通信与卡数无关”是错误表述，渐近接近2S的是每卡发送量。 带每轮延迟alpha的简化模型为 T ≈ 2 ( N − 1 ) α + 2 N − 1 N S B W . 小消息和大N时延迟项不可忽略。真实NCCL可能选择tree、分层或多通道，并非任何collective都固定用单ring。 NVLink、PCIe与RDMA 拓扑决定有效路径。NVLink/NVSwitch、PCIe与跨机IB/RoCE的成本不同；跨机TP不是数学上不可能，而是每层频繁通信可能很贵。RDMA允许网络设备按配置直接访问内存，但不会取消拥塞、同步和拓扑限制。 labs/03_sharding.py 在CPU模拟上述数组语义与梯度等价性，不测NCCL性能。","charCount":948},{"id":"fsdp-zero","title":"DDP、ZeRO、FSDP：为什么多卡不自动解决显存不足","section":"training","summary":"从训练状态账本推导分片，而不是先背并行缩写。","prereq":["adamw","mixed-precision","collectives","accum-recompute"],"sources":["fsdp-doc","fsdp2","zero-paper","qbfsdp"],"tags":["FSDP","ZeRO","DDP","显存"],"level":1,"kind":"原理与推导","checks":[{"q":"FSDP是否减少同一样本所需的模型数学FLOPs？","a":"通常不直接减少；它主要改变状态存储与通信，重算还可能增加FLOPs。"},{"q":"为什么持久状态除以卡数不是峰值显存预测？","a":"临时完整单元、activation、gradient与通信buffer可同时存在，还存在allocator预留和overlap。"}],"lab":null,"raw":"## 8B权重为什么能放下，训练却放不下\nP个参数的BF16权重约2P字节。训练可能还需要FP32 master、gradient与两个Adam moments，加上activation和workspace。以master+FP32 gradient+m+v计为16P字节，不能仅用2P估训练容量。不同precision policy下账本必须重算。\n\n## DDP复制了什么\n每卡一份模型与optimizer，各自处理不同数据，再同步梯度。这样提高数据并行吞吐，却不降低每卡完整参数与optimizer状态的基本存储。如果完整训练状态在单卡放不下，简单增加DDP rank并不解决。\n\n## ZeRO的分阶段思想\nZeRO-1切optimizer state；ZeRO-2还切gradient；ZeRO-3进一步切parameter。FSDP full-sharding采用相近的全状态分片思路，但具体API、调度、flatten表示与实现不等于ZeRO库本身。\n\n公式 $M\\approx M_{state}/N$ 只能估理想持久分片部分。真实峰值还包括临时unshard、完整当前单元gradient、activation、prefetch、allocator与通信buffer。N倍显存总和不是一个无需调度的统一地址空间。\n\n## 为什么按layer/block临时聚合\n计算一个block需要它的权重。按需All-Gather完整单元，算完reshard/释放，降低同时存活的完整参数规模。若单元太大，瞬时峰值高；太小，collective启动次数多。粒度决定内存和通信之间的trade-off。\n\n## FSDP1、FSDP2与自己的原型\n官方不同代实现的参数表示和API会变化。FSDP1常见flat-parameter机制，FSDP2采用不同的per-parameter/DTensor组织。你的BlockFSDP是自研同步flat shard原型，不等于完整复刻任何官方版本。\n\n当前源码使用重算配合分片；官方FSDP本身不等于“必须重算所有forward”。是否activation checkpoint、是否reshard以及prefetch/overlap是不同控制维度。\n\n## 下一章的具体问题\n你的代码怎样只从CPU搬本地shard？怎样用functional_call提供临时权重？为什么共享embedding只更新一次？为什么梯度通信转FP32却不代表梯度计算全FP32？这些问题只有沿真实forward/backward读一遍才能回答。\n","html":"\u003ch2 id=\"h01\">8B权重为什么能放下，训练却放不下\u003c/h2>\n\u003cp>P个参数的BF16权重约2P字节。训练可能还需要FP32 master、gradient与两个Adam moments，加上activation和workspace。以master+FP32 gradient+m+v计为16P字节，不能仅用2P估训练容量。不同precision policy下账本必须重算。\u003c/p>\n\u003ch2 id=\"h02\">DDP复制了什么\u003c/h2>\n\u003cp>每卡一份模型与optimizer，各自处理不同数据，再同步梯度。这样提高数据并行吞吐，却不降低每卡完整参数与optimizer状态的基本存储。如果完整训练状态在单卡放不下，简单增加DDP rank并不解决。\u003c/p>\n\u003ch2 id=\"h03\">ZeRO的分阶段思想\u003c/h2>\n\u003cp>ZeRO-1切optimizer state；ZeRO-2还切gradient；ZeRO-3进一步切parameter。FSDP full-sharding采用相近的全状态分片思路，但具体API、调度、flatten表示与实现不等于ZeRO库本身。\u003c/p>\n\u003cp>公式 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>/\u003c/mi>\u003cmi>N\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">M\\approx M_{state}/N\u003c/annotation>\u003c/semantics>\u003c/math> 只能估理想持久分片部分。真实峰值还包括临时unshard、完整当前单元gradient、activation、prefetch、allocator与通信buffer。N倍显存总和不是一个无需调度的统一地址空间。\u003c/p>\n\u003ch2 id=\"h04\">为什么按layer/block临时聚合\u003c/h2>\n\u003cp>计算一个block需要它的权重。按需All-Gather完整单元，算完reshard/释放，降低同时存活的完整参数规模。若单元太大，瞬时峰值高；太小，collective启动次数多。粒度决定内存和通信之间的trade-off。\u003c/p>\n\u003ch2 id=\"h05\">FSDP1、FSDP2与自己的原型\u003c/h2>\n\u003cp>官方不同代实现的参数表示和API会变化。FSDP1常见flat-parameter机制，FSDP2采用不同的per-parameter/DTensor组织。你的BlockFSDP是自研同步flat shard原型，不等于完整复刻任何官方版本。\u003c/p>\n\u003cp>当前源码使用重算配合分片；官方FSDP本身不等于“必须重算所有forward”。是否activation checkpoint、是否reshard以及prefetch/overlap是不同控制维度。\u003c/p>\n\u003ch2 id=\"h06\">下一章的具体问题\u003c/h2>\n\u003cp>你的代码怎样只从CPU搬本地shard？怎样用functional_call提供临时权重？为什么共享embedding只更新一次？为什么梯度通信转FP32却不代表梯度计算全FP32？这些问题只有沿真实forward/backward读一遍才能回答。\u003c/p>\n","toc":[{"id":"h01","title":"8B权重为什么能放下，训练却放不下","level":2},{"id":"h02","title":"DDP复制了什么","level":2},{"id":"h03","title":"ZeRO的分阶段思想","level":2},{"id":"h04","title":"为什么按layer/block临时聚合","level":2},{"id":"h05","title":"FSDP1、FSDP2与自己的原型","level":2},{"id":"h06","title":"下一章的具体问题","level":2}],"plain":"8B权重为什么能放下，训练却放不下 P个参数的BF16权重约2P字节。训练可能还需要FP32 master、gradient与两个Adam moments，加上activation和workspace。以master+FP32 gradient+m+v计为16P字节，不能仅用2P估训练容量。不同precision policy下账本必须重算。 DDP复制了什么 每卡一份模型与optimizer，各自处理不同数据，再同步梯度。这样提高数据并行吞吐，却不降低每卡完整参数与optimizer状态的基本存储。如果完整训练状态在单卡放不下，简单增加DDP rank并不解决。 ZeRO的分阶段思想 ZeRO-1切optimizer state；ZeRO-2还切gradient；ZeRO-3进一步切parameter。FSDP full-sharding采用相近的全状态分片思路，但具体API、调度、flatten表示与实现不等于ZeRO库本身。 公式 M ≈ M s t a t e / N 只能估理想持久分片部分。真实峰值还包括临时unshard、完整当前单元gradient、activation、prefetch、allocator与通信buffer。N倍显存总和不是一个无需调度的统一地址空间。 为什么按layer/block临时聚合 计算一个block需要它的权重。按需All-Gather完整单元，算完reshard/释放，降低同时存活的完整参数规模。若单元太大，瞬时峰值高；太小，collective启动次数多。粒度决定内存和通信之间的trade-off。 FSDP1、FSDP2与自己的原型 官方不同代实现的参数表示和API会变化。FSDP1常见flat-parameter机制，FSDP2采用不同的per-parameter/DTensor组织。你的BlockFSDP是自研同步flat shard原型，不等于完整复刻任何官方版本。 当前源码使用重算配合分片；官方FSDP本身不等于“必须重算所有forward”。是否activation checkpoint、是否reshard以及prefetch/overlap是不同控制维度。 下一章的具体问题 你的代码怎样只从CPU搬本地shard？怎样用functional_call提供临时权重？为什么共享embedding只更新一次？为什么梯度通信转FP32却不代表梯度计算全FP32？这些问题只有沿真实forward/backward读一遍才能回答。","charCount":1025},{"id":"block-fsdp","title":"源码主线：BlockFSDP的一次 forward/backward","section":"training","summary":"跟踪FP32 shard、BF16参数聚合、重算、FP32通信和本地更新。","prereq":["fsdp-zero","collectives","autograd","mixed-precision"],"sources":["qbfsdp","qfsdp","qdeploy","qckpt"],"tags":["BlockFSDP","functional_call","FSDP","8B"],"level":3,"kind":"源码与实验","checks":[{"q":"为什么输入梯度不也除world size？","a":"它用于本rank继续反向传播，保持本地loss语义；跨rank平均的是共享模型参数梯度。"},{"q":"forward为什么将模板放meta？","a":"保留模块结构而避免GPU常驻完整参数，执行时由functional_call提供临时聚合权重。"},{"q":"为什么两次使用同一权重要共享master shard？","a":"否则会产生两个独立参数/optimizer状态，破坏weight tying与一次更新的语义。"}],"lab":null,"raw":"## 为什么这份实现值得逐行读\n它在真实8B级Qwen架构checkpoint上验证全参数短程训练，但采用同步collective、无通信重叠、确定性block。其价值是一个完整的shard生命周期，不是新的NCCL算法。\n\n## 初始化：结构与存储分开\n模型从CPU加载。每个unit记录参数名、shape、numel，把参数展平并补齐到world size整除。rank只将自己的区间迁移到GPU，保持FP32 master shard。模块模板转到meta，保留结构而不保留完整GPU参数storage。\n\nshared字典按参数身份复用master shard，tied embedding/head可拥有同一份Parameter；它们分别计算时聚合权重，反向贡献汇总到同一shard，optimizer只更新一次。\n\n## forward：临时提供完整参数\n`gather(shard)`先用Triton本地转换为BF16，再调用NCCL `all_gather_into_tensor` 得到完整unit参数。`call`把flat参数按spec切成对应shape，再用 `torch.func.functional_call` 执行原模板。\n\n自定义 `_Call.forward` 保存shard和输入边界供backward使用，不保留完整普通autograd中间图。输入边界仍占显存，不能说“所有activations都不保存”。\n\n## backward：重算到分片梯度\n在启用grad的上下文中重新gather，临时full参数设置requires_grad，输入detach后按需求启用梯度。再次执行block，用 `torch.autograd.grad(output,(full,*inputs),grad)` 得到参数和输入梯度。\n\n随后把参数gradient转换为FP32并reduce-scatter SUM，Triton本地除world size。输入梯度保持本rank数据的语义，不像参数梯度那样跨rank平均。梯度若由BF16compute产生，后续cast不会恢复已丢失精度。\n\n\u003cdiv class=\"flow\">\u003cspan>FP32 shard\u003c/span>\u003cspan>BF16 all-gather\u003c/span>\u003cspan>Forward\u003c/span>\u003cspan>重聚合＋重算\u003c/span>\u003cspan>梯度\u003c/span>\u003cspan>FP32 reduce-scatter\u003c/span>\u003cspan>本地AdamW\u003c/span>\u003c/div>\n\n## 显存数字怎样对齐\n真实P=8,190,735,360。BF16全权重约15.26GiB；master+m+v约91.54GiB，4卡理想持久分摊约22.88GiB；加FP32 gradient shard约30.51GiB。还需完整当前unit、activation和workspace，因此35.7568GiB测量峰值不等于简单12P/4。\n\nS512、每卡B1、4卡、真实WikiText、3次更新通过；初始及导出重载对应logits最大误差0，仅是有限测试观测。Q projection约18.63%的BF16元素发生变化，说明实际更新，不证明全部参数更新幅度相同。\n\n## 工程限制\n仅同有效token数与相同collective顺序；拒绝随机dropout重算、高阶梯度等未支持情况。无跨节点、弹性world size或自动overlap。完整8B optimizer checkpoint未因磁盘限制而验证，不能把HF BF16权重导出称为精确恢复。真实checkpoint是DeepSeek-R1-0528-Qwen3-8B，不是原版Qwen3-8B下载完成。\n\n## 如何验证一个改动\n先小模型tied/untied多rank对照所有grad与连续更新，再故意破坏参数/optimizer做恢复测试，最后做真实模型功能验证。性能对照需要剥离诊断成本，并与相同精度、重算、unit策略的官方baseline比较；当前项目没有这个性能胜出结论。\n","html":"\u003ch2 id=\"h01\">为什么这份实现值得逐行读\u003c/h2>\n\u003cp>它在真实8B级Qwen架构checkpoint上验证全参数短程训练，但采用同步collective、无通信重叠、确定性block。其价值是一个完整的shard生命周期，不是新的NCCL算法。\u003c/p>\n\u003ch2 id=\"h02\">初始化：结构与存储分开\u003c/h2>\n\u003cp>模型从CPU加载。每个unit记录参数名、shape、numel，把参数展平并补齐到world size整除。rank只将自己的区间迁移到GPU，保持FP32 master shard。模块模板转到meta，保留结构而不保留完整GPU参数storage。\u003c/p>\n\u003cp>shared字典按参数身份复用master shard，tied embedding/head可拥有同一份Parameter；它们分别计算时聚合权重，反向贡献汇总到同一shard，optimizer只更新一次。\u003c/p>\n\u003ch2 id=\"h03\">forward：临时提供完整参数\u003c/h2>\n\u003cp>\u003ccode>gather(shard)\u003c/code>先用Triton本地转换为BF16，再调用NCCL \u003ccode>all_gather_into_tensor\u003c/code> 得到完整unit参数。\u003ccode>call\u003c/code>把flat参数按spec切成对应shape，再用 \u003ccode>torch.func.functional_call\u003c/code> 执行原模板。\u003c/p>\n\u003cp>自定义 \u003ccode>_Call.forward\u003c/code> 保存shard和输入边界供backward使用，不保留完整普通autograd中间图。输入边界仍占显存，不能说“所有activations都不保存”。\u003c/p>\n\u003ch2 id=\"h04\">backward：重算到分片梯度\u003c/h2>\n\u003cp>在启用grad的上下文中重新gather，临时full参数设置requires_grad，输入detach后按需求启用梯度。再次执行block，用 \u003ccode>torch.autograd.grad(output,(full,*inputs),grad)\u003c/code> 得到参数和输入梯度。\u003c/p>\n\u003cp>随后把参数gradient转换为FP32并reduce-scatter SUM，Triton本地除world size。输入梯度保持本rank数据的语义，不像参数梯度那样跨rank平均。梯度若由BF16compute产生，后续cast不会恢复已丢失精度。\u003c/p>\n\u003cdiv class=\"flow\">\n\u003cspan>FP32 shard\u003c/span>\u003cspan>BF16 all-gather\u003c/span>\u003cspan>Forward\u003c/span>\u003cspan>重聚合＋重算\u003c/span>\u003cspan>梯度\u003c/span>\u003cspan>FP32 reduce-scatter\u003c/span>\u003cspan>本地AdamW\u003c/span>\n\u003c/div>\n\u003ch2 id=\"h05\">显存数字怎样对齐\u003c/h2>\n\u003cp>真实P=8,190,735,360。BF16全权重约15.26GiB；master+m+v约91.54GiB，4卡理想持久分摊约22.88GiB；加FP32 gradient shard约30.51GiB。还需完整当前unit、activation和workspace，因此35.7568GiB测量峰值不等于简单12P/4。\u003c/p>\n\u003cp>S512、每卡B1、4卡、真实WikiText、3次更新通过；初始及导出重载对应logits最大误差0，仅是有限测试观测。Q projection约18.63%的BF16元素发生变化，说明实际更新，不证明全部参数更新幅度相同。\u003c/p>\n\u003ch2 id=\"h06\">工程限制\u003c/h2>\n\u003cp>仅同有效token数与相同collective顺序；拒绝随机dropout重算、高阶梯度等未支持情况。无跨节点、弹性world size或自动overlap。完整8B optimizer checkpoint未因磁盘限制而验证，不能把HF BF16权重导出称为精确恢复。真实checkpoint是DeepSeek-R1-0528-Qwen3-8B，不是原版Qwen3-8B下载完成。\u003c/p>\n\u003ch2 id=\"h07\">如何验证一个改动\u003c/h2>\n\u003cp>先小模型tied/untied多rank对照所有grad与连续更新，再故意破坏参数/optimizer做恢复测试，最后做真实模型功能验证。性能对照需要剥离诊断成本，并与相同精度、重算、unit策略的官方baseline比较；当前项目没有这个性能胜出结论。\u003c/p>\n","toc":[{"id":"h01","title":"为什么这份实现值得逐行读","level":2},{"id":"h02","title":"初始化：结构与存储分开","level":2},{"id":"h03","title":"forward：临时提供完整参数","level":2},{"id":"h04","title":"backward：重算到分片梯度","level":2},{"id":"h05","title":"显存数字怎样对齐","level":2},{"id":"h06","title":"工程限制","level":2},{"id":"h07","title":"如何验证一个改动","level":2}],"plain":"为什么这份实现值得逐行读 它在真实8B级Qwen架构checkpoint上验证全参数短程训练，但采用同步collective、无通信重叠、确定性block。其价值是一个完整的shard生命周期，不是新的NCCL算法。 初始化：结构与存储分开 模型从CPU加载。每个unit记录参数名、shape、numel，把参数展平并补齐到world size整除。rank只将自己的区间迁移到GPU，保持FP32 master shard。模块模板转到meta，保留结构而不保留完整GPU参数storage。 shared字典按参数身份复用master shard，tied embedding/head可拥有同一份Parameter；它们分别计算时聚合权重，反向贡献汇总到同一shard，optimizer只更新一次。 forward：临时提供完整参数 gather(shard) 先用Triton本地转换为BF16，再调用NCCL all_gather_into_tensor 得到完整unit参数。 call 把flat参数按spec切成对应shape，再用 torch.func.functional_call 执行原模板。 自定义 _Call.forward 保存shard和输入边界供backward使用，不保留完整普通autograd中间图。输入边界仍占显存，不能说“所有activations都不保存”。 backward：重算到分片梯度 在启用grad的上下文中重新gather，临时full参数设置requires_grad，输入detach后按需求启用梯度。再次执行block，用 torch.autograd.grad(output,(full,*inputs),grad) 得到参数和输入梯度。 随后把参数gradient转换为FP32并reduce-scatter SUM，Triton本地除world size。输入梯度保持本rank数据的语义，不像参数梯度那样跨rank平均。梯度若由BF16compute产生，后续cast不会恢复已丢失精度。 FP32 shard BF16 all-gather Forward 重聚合＋重算 梯度 FP32 reduce-scatter 本地AdamW 显存数字怎样对齐 真实P=8,190,735,360。BF16全权重约15.26GiB；master+m+v约91.54GiB，4卡理想持久分摊约22.88GiB；加FP32 gradient shard约30.51GiB。还需完整当前unit、activation和workspace，因此35.7568GiB测量峰值不等于简单12P/4。 S512、每卡B1、4卡、真实WikiText、3次更新通过；初始及导出重载对应logits最大误差0，仅是有限测试观测。Q projection约18.63%的BF16元素发生变化，说明实际更新，不证明全部参数更新幅度相同。 工程限制 仅同有效token数与相同collective顺序；拒绝随机dropout重算、高阶梯度等未支持情况。无跨节点、弹性world size或自动overlap。完整8B optimizer checkpoint未因磁盘限制而验证，不能把HF BF16权重导出称为精确恢复。真实checkpoint是DeepSeek-R1-0528-Qwen3-8B，不是原版Qwen3-8B下载完成。 如何验证一个改动 先小模型tied/untied多rank对照所有grad与连续更新，再故意破坏参数/optimizer做恢复测试，最后做真实模型功能验证。性能对照需要剥离诊断成本，并与相同精度、重算、unit策略的官方baseline比较；当前项目没有这个性能胜出结论。","charCount":1523},{"id":"megatron-tp","title":"Megatron TP 与 Sequence Parallel：通信从矩阵求导中来","section":"training","summary":"从列切分、行切分推导前后向collective，区别于DFuzz中的Megatron工作。","prereq":["gemm-flops","collectives","swiglu"],"sources":["megatron","megatron-doc","sequence-paper"],"tags":["TP","Megatron","SP","张量并行"],"level":1,"kind":"扩展知识","checks":[{"q":"Row Parallel的局部输出是输出分片还是partial sum？","a":"是相同完整输出shape的partial contribution，需要跨rank求和。"},{"q":"Column Parallel的dX为什么需要归约？","a":"每个权重列分片都对原输入X产生一部分梯度贡献，完整梯度是它们的和。"}],"lab":null,"raw":"## 两种Megatron关联必须区分\n你的DFuzz确实测试Megatron训练算子优化；但这不代表实现过Megatron整套TP调度。本章是分布式背景推导，DFuzz具体贡献在可靠性章节。\n\n## Column Parallel为什么暂时不用通信\n对MLP $Y=\\phi(XW_1)W_2$，沿W1输出特征切列：$W_1=[W_{1,0},\\ldots,W_{1,p-1}]$。各卡有相同X，算 $H_r=\\phi(XW_{1,r})$，H_r是intermediate shard。逐元素activation在本地即可完成，无需先拼成完整H。\n\n随后W2沿对应输入维切行：\n\n$$Z_r=H_rW_{2,r},\\qquad Y=\\sum_rZ_r.$$\n\n每张卡的Z_r具有完整输出shape，但只是partial sum，不是输出feature shard。因此需要sum collective。Qwen式SwiGLU要将gate/up的对应通道对齐切分，再消费本地门控结果。\n\n## backward通信为什么在另一头\nColumn-parallel中，各卡计算 $dX_r=dH_rW_{1,r}^T$，输入X被所有分片共同使用，因此完整dX需要求和。局部dW只负责自己的权重分片。\n\nRow-parallel的forward把各partial output相加；backward若上游dY已在各卡正确表示，每卡可算本地dH_r。经典设计把若干collective成对安排，使forward和backward分别承担必要通信；不同SP/overlap实现会改变具体collective形式。\n\n## Attention按head切分\nQ/K/V投影列切，局部heads完成attention，O projection行切后求和。GQA的KV heads更少，当TP degree超过KV heads或不能整除时需要额外分组/复制策略，不能盲目宣称每卡总能独立分到整数个KV heads。\n\n## Sequence Parallel为何出现\nTP之外的norm、dropout、residual activation若每卡完整保存，会产生重复。SP将某些activation沿sequence维切开，借助all-gather/reduce-scatter与TP GEMM衔接，降低这些activation的冗余。\n\n它不是把所有attention token互相依赖取消；也不应和Context Parallel的长序列attention切分混淆。经典TP all-reduce可分解为reduce-scatter+all-gather，在合适位置延后聚合能保留分片activation。\n\n## 性能取舍\nTP每层都有通信，故拓扑与延迟敏感。增加TP可能让单卡GEMM变小并增大通信占比。跨机TP并非禁止，只是应在带宽、模型宽度、batch与其他并行策略间权衡。\n","html":"\u003ch2 id=\"h01\">两种Megatron关联必须区分\u003c/h2>\n\u003cp>你的DFuzz确实测试Megatron训练算子优化；但这不代表实现过Megatron整套TP调度。本章是分布式背景推导，DFuzz具体贡献在可靠性章节。\u003c/p>\n\u003ch2 id=\"h02\">Column Parallel为什么暂时不用通信\u003c/h2>\n\u003cp>对MLP \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Y=\\phi(XW_1)W_2\u003c/annotation>\u003c/semantics>\u003c/math>，沿W1输出特征切列：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmi>…\u003c/mi>\u003cmo>,\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">W_1=[W_{1,0},\\ldots,W_{1,p-1}]\u003c/annotation>\u003c/semantics>\u003c/math>。各卡有相同X，算 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">H_r=\\phi(XW_{1,r})\u003c/annotation>\u003c/semantics>\u003c/math>，H_r是intermediate shard。逐元素activation在本地即可完成，无需先拼成完整H。\u003c/p>\n\u003cp>随后W2沿对应输入维切行：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>Z\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>,\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmspace width=\"2.0em\">\u003c/mspace>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>r\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>Z\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Z_r=H_rW_{2,r},\\qquad Y=\\sum_rZ_r.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>每张卡的Z_r具有完整输出shape，但只是partial sum，不是输出feature shard。因此需要sum collective。Qwen式SwiGLU要将gate/up的对应通道对齐切分，再消费本地门控结果。\u003c/p>\n\u003ch2 id=\"h03\">backward通信为什么在另一头\u003c/h2>\n\u003cp>Column-parallel中，各卡计算 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/msubsup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dX_r=dH_rW_{1,r}^T\u003c/annotation>\u003c/semantics>\u003c/math>，输入X被所有分片共同使用，因此完整dX需要求和。局部dW只负责自己的权重分片。\u003c/p>\n\u003cp>Row-parallel的forward把各partial output相加；backward若上游dY已在各卡正确表示，每卡可算本地dH_r。经典设计把若干collective成对安排，使forward和backward分别承担必要通信；不同SP/overlap实现会改变具体collective形式。\u003c/p>\n\u003ch2 id=\"h04\">Attention按head切分\u003c/h2>\n\u003cp>Q/K/V投影列切，局部heads完成attention，O projection行切后求和。GQA的KV heads更少，当TP degree超过KV heads或不能整除时需要额外分组/复制策略，不能盲目宣称每卡总能独立分到整数个KV heads。\u003c/p>\n\u003ch2 id=\"h05\">Sequence Parallel为何出现\u003c/h2>\n\u003cp>TP之外的norm、dropout、residual activation若每卡完整保存，会产生重复。SP将某些activation沿sequence维切开，借助all-gather/reduce-scatter与TP GEMM衔接，降低这些activation的冗余。\u003c/p>\n\u003cp>它不是把所有attention token互相依赖取消；也不应和Context Parallel的长序列attention切分混淆。经典TP all-reduce可分解为reduce-scatter+all-gather，在合适位置延后聚合能保留分片activation。\u003c/p>\n\u003ch2 id=\"h06\">性能取舍\u003c/h2>\n\u003cp>TP每层都有通信，故拓扑与延迟敏感。增加TP可能让单卡GEMM变小并增大通信占比。跨机TP并非禁止，只是应在带宽、模型宽度、batch与其他并行策略间权衡。\u003c/p>\n","toc":[{"id":"h01","title":"两种Megatron关联必须区分","level":2},{"id":"h02","title":"Column Parallel为什么暂时不用通信","level":2},{"id":"h03","title":"backward通信为什么在另一头","level":2},{"id":"h04","title":"Attention按head切分","level":2},{"id":"h05","title":"Sequence Parallel为何出现","level":2},{"id":"h06","title":"性能取舍","level":2}],"plain":"两种Megatron关联必须区分 你的DFuzz确实测试Megatron训练算子优化；但这不代表实现过Megatron整套TP调度。本章是分布式背景推导，DFuzz具体贡献在可靠性章节。 Column Parallel为什么暂时不用通信 对MLP Y = ϕ ( X W 1 ) W 2 ，沿W1输出特征切列： W 1 = [ W 1 , 0 , … , W 1 , p − 1 ] 。各卡有相同X，算 H r = ϕ ( X W 1 , r ) ，H_r是intermediate shard。逐元素activation在本地即可完成，无需先拼成完整H。 随后W2沿对应输入维切行： Z r = H r W 2 , r , Y = ∑ r Z r . 每张卡的Z_r具有完整输出shape，但只是partial sum，不是输出feature shard。因此需要sum collective。Qwen式SwiGLU要将gate/up的对应通道对齐切分，再消费本地门控结果。 backward通信为什么在另一头 Column-parallel中，各卡计算 d X r = d H r W 1 , r T ，输入X被所有分片共同使用，因此完整dX需要求和。局部dW只负责自己的权重分片。 Row-parallel的forward把各partial output相加；backward若上游dY已在各卡正确表示，每卡可算本地dH_r。经典设计把若干collective成对安排，使forward和backward分别承担必要通信；不同SP/overlap实现会改变具体collective形式。 Attention按head切分 Q/K/V投影列切，局部heads完成attention，O projection行切后求和。GQA的KV heads更少，当TP degree超过KV heads或不能整除时需要额外分组/复制策略，不能盲目宣称每卡总能独立分到整数个KV heads。 Sequence Parallel为何出现 TP之外的norm、dropout、residual activation若每卡完整保存，会产生重复。SP将某些activation沿sequence维切开，借助all-gather/reduce-scatter与TP GEMM衔接，降低这些activation的冗余。 它不是把所有attention token互相依赖取消；也不应和Context Parallel的长序列attention切分混淆。经典TP all-reduce可分解为reduce-scatter+all-gather，在合适位置延后聚合能保留分片activation。 性能取舍 TP每层都有通信，故拓扑与延迟敏感。增加TP可能让单卡GEMM变小并增大通信占比。跨机TP并非禁止，只是应在带宽、模型宽度、batch与其他并行策略间权衡。","charCount":1115},{"id":"pp-cp-moe","title":"PP、Context Parallel 与 MoE：拆分轴决定通信","section":"training","summary":"理解流水线气泡、长序列依赖和专家路由，而非混称“多卡并行”。","prereq":["megatron-tp","accum-recompute","collectives"],"sources":["pipeline-paper","megatron-doc","deepseek","qwen"],"tags":["PP","Context Parallel","MoE","Expert Parallel"],"level":1,"kind":"扩展知识","checks":[{"q":"Expert Parallel通常为什么需要All-to-All？","a":"不同token被路由到不同rank上的专家，通信不是对相同位置求和。"},{"q":"MoE总参数更多是否必然每token FLOPs更多？","a":"不必然。需看活跃专家数量与共享部分，但总存储和调度成本仍可能更大。"}],"lab":null,"raw":"## Pipeline Parallel拆的是层\n把不同层放到不同stage，activation依次传递，backward传相反方向的梯度。若只有一个microbatch，前后stage会等待。把global batch切为多个microbatch，能让不同stage同时处理不同数据。\n\n在理想等长stage、简单填充/排空模型中，气泡比例常用 $(p-1)/(m+p-1)$ 理解，p为stage数、m为microbatch数。真实1F1B、interleaving、stage不平衡和通信会改变时间，不能把该式当生产实测。\n\n1F1B交替执行forward和backward，可减少等待反向期间要保留的activation。参数更新仍要保证一致，不能让同一个优化step的不同microbatch使用混乱版本的权重。\n\n## Context Parallel拆的是长序列计算\n每卡保存不同token片段，但attention query需要相关历史K/V。于是需要在rank间传递K/V或其他等价信息，再做局部计算和合并。它缓解长序列activation与attention资源问题，不是简单删除跨片段注意力。\n\nCP与某些Sequence Parallel概念有交集，但在Megatron语境下SP常指TP周边特定activation的sequence切分，CP还涉及attention的上下文依赖。面试时先声明术语所处框架。\n\n## MoE为什么引入All-to-All\n普通FFN每token经过同一组dense权重。MoE使用router为token选择少数专家，每个expert通常是一个FFN。专家分散在不同GPU时，需要把token dispatch到其专家，再把结果combine回来。\n\nAll-to-All与All-Reduce不同：前者把不同数据发送给不同目的rank；后者做同位置数值规约。路由不均匀会使热点专家成为瓶颈，因此还需负载均衡、capacity与丢弃/不丢弃策略。\n\n## 总参数不等于活跃参数\nMoE可以有很多总权重，但每个token只激活一部分。计算量估算应关注活跃专家与共享组件，而显存和通信仍受总权重、路由和驻留策略影响。不能把dense的6P公式直接套在总MoE参数上。\n\nDeepSeek-V3使用MLA与MoE等结构，Qwen也有dense和MoE不同型号；你的1.7B及所验证8B为dense Qwen架构。这些并行机制作为扩展知识，不是当前仓库已经实现的功能。\n","html":"\u003ch2 id=\"h01\">Pipeline Parallel拆的是层\u003c/h2>\n\u003cp>把不同层放到不同stage，activation依次传递，backward传相反方向的梯度。若只有一个microbatch，前后stage会等待。把global batch切为多个microbatch，能让不同stage同时处理不同数据。\u003c/p>\n\u003cp>在理想等长stage、简单填充/排空模型中，气泡比例常用 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>/\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">(p-1)/(m+p-1)\u003c/annotation>\u003c/semantics>\u003c/math> 理解，p为stage数、m为microbatch数。真实1F1B、interleaving、stage不平衡和通信会改变时间，不能把该式当生产实测。\u003c/p>\n\u003cp>1F1B交替执行forward和backward，可减少等待反向期间要保留的activation。参数更新仍要保证一致，不能让同一个优化step的不同microbatch使用混乱版本的权重。\u003c/p>\n\u003ch2 id=\"h02\">Context Parallel拆的是长序列计算\u003c/h2>\n\u003cp>每卡保存不同token片段，但attention query需要相关历史K/V。于是需要在rank间传递K/V或其他等价信息，再做局部计算和合并。它缓解长序列activation与attention资源问题，不是简单删除跨片段注意力。\u003c/p>\n\u003cp>CP与某些Sequence Parallel概念有交集，但在Megatron语境下SP常指TP周边特定activation的sequence切分，CP还涉及attention的上下文依赖。面试时先声明术语所处框架。\u003c/p>\n\u003ch2 id=\"h03\">MoE为什么引入All-to-All\u003c/h2>\n\u003cp>普通FFN每token经过同一组dense权重。MoE使用router为token选择少数专家，每个expert通常是一个FFN。专家分散在不同GPU时，需要把token dispatch到其专家，再把结果combine回来。\u003c/p>\n\u003cp>All-to-All与All-Reduce不同：前者把不同数据发送给不同目的rank；后者做同位置数值规约。路由不均匀会使热点专家成为瓶颈，因此还需负载均衡、capacity与丢弃/不丢弃策略。\u003c/p>\n\u003ch2 id=\"h04\">总参数不等于活跃参数\u003c/h2>\n\u003cp>MoE可以有很多总权重，但每个token只激活一部分。计算量估算应关注活跃专家与共享组件，而显存和通信仍受总权重、路由和驻留策略影响。不能把dense的6P公式直接套在总MoE参数上。\u003c/p>\n\u003cp>DeepSeek-V3使用MLA与MoE等结构，Qwen也有dense和MoE不同型号；你的1.7B及所验证8B为dense Qwen架构。这些并行机制作为扩展知识，不是当前仓库已经实现的功能。\u003c/p>\n","toc":[{"id":"h01","title":"Pipeline Parallel拆的是层","level":2},{"id":"h02","title":"Context Parallel拆的是长序列计算","level":2},{"id":"h03","title":"MoE为什么引入All-to-All","level":2},{"id":"h04","title":"总参数不等于活跃参数","level":2}],"plain":"Pipeline Parallel拆的是层 把不同层放到不同stage，activation依次传递，backward传相反方向的梯度。若只有一个microbatch，前后stage会等待。把global batch切为多个microbatch，能让不同stage同时处理不同数据。 在理想等长stage、简单填充/排空模型中，气泡比例常用 ( p − 1 ) / ( m + p − 1 ) 理解，p为stage数、m为microbatch数。真实1F1B、interleaving、stage不平衡和通信会改变时间，不能把该式当生产实测。 1F1B交替执行forward和backward，可减少等待反向期间要保留的activation。参数更新仍要保证一致，不能让同一个优化step的不同microbatch使用混乱版本的权重。 Context Parallel拆的是长序列计算 每卡保存不同token片段，但attention query需要相关历史K/V。于是需要在rank间传递K/V或其他等价信息，再做局部计算和合并。它缓解长序列activation与attention资源问题，不是简单删除跨片段注意力。 CP与某些Sequence Parallel概念有交集，但在Megatron语境下SP常指TP周边特定activation的sequence切分，CP还涉及attention的上下文依赖。面试时先声明术语所处框架。 MoE为什么引入All-to-All 普通FFN每token经过同一组dense权重。MoE使用router为token选择少数专家，每个expert通常是一个FFN。专家分散在不同GPU时，需要把token dispatch到其专家，再把结果combine回来。 All-to-All与All-Reduce不同：前者把不同数据发送给不同目的rank；后者做同位置数值规约。路由不均匀会使热点专家成为瓶颈，因此还需负载均衡、capacity与丢弃/不丢弃策略。 总参数不等于活跃参数 MoE可以有很多总权重，但每个token只激活一部分。计算量估算应关注活跃专家与共享组件，而显存和通信仍受总权重、路由和驻留策略影响。不能把dense的6P公式直接套在总MoE参数上。 DeepSeek-V3使用MLA与MoE等结构，Qwen也有dense和MoE不同型号；你的1.7B及所验证8B为dense Qwen架构。这些并行机制作为扩展知识，不是当前仓库已经实现的功能。","charCount":1018},{"id":"checkpoints","title":"Checkpoint、HF导出与恢复：保存权重不等于保存训练","section":"training","summary":"从下一次update需要什么，推导完整恢复契约和分片一致性。","prereq":["adamw","block-fsdp"],"sources":["qckpt","qfsdp","qconvergence","distributed-checkpoint"],"tags":["Checkpoint","恢复","HF export","I/O"],"level":1,"kind":"原理与推导","checks":[{"q":"HF导出后logits一样是否证明optimizer恢复正确？","a":"不是。HF权重文件没有自动包含master、m/v和训练游标等。"},{"q":"为什么必须测试失败路径？","a":"错误world size、部分文件或不匹配协议若被静默接受，会产生比显式报错更难定位的训练错误。"}],"lab":null,"raw":"## 为什么一份BF16权重不足以继续同一训练\n要执行“下一步相同更新”，除了参数，还需要Adam m/v、step、学习率调度、FP32 master、随机状态、数据游标/顺序、梯度累积阶段与精度设置。仅能from_pretrained加载的模型文件，通常不包含这些训练状态。\n\n你的8B HF导出用于部署并验证logits重载；它不是已验证的8B完整AdamW恢复。小模型的checkpoint恢复通过，也不能自动覆盖大模型存储和I/O风险。\n\n## 分片checkpoint为什么要manifest\n每个rank保存自己的参数/optimizer分片。需要记录world size、参数结构、padding、dtype和训练协议；恢复时应拒绝不兼容状态，或明确实现resharding。不能在改变world size后直接按旧rank文件加载并假装完成弹性恢复。\n\n项目采用写临时文件、flush/fsync后rename，并通过完成标记说明各rank保存结束。该方式提高单次写入的可靠性，但分布式失败恢复、网络文件系统一致性和任意故障原子性仍需更完整协议。\n\n## 容量账本\nFP32 master与两个FP32 Adam moments约12P字节，P=8.19B时约91.54GiB，未计元数据/安全空间。BF16模型导出约2P字节，即15.26GiB。两者差异来自保存内容，而不是某种神奇压缩。\n\n## 数据顺序也属于状态\n相同模型/optimizer若恢复后换了batch顺序，训练轨迹自然不同。记录token文件hash、block索引、shuffle种子与sampler状态，才能区分数据变化和数值错误。验证集只用于既定协议，test不能用于事后调节门槛。\n\n## 怎么设计一个有力的恢复测试\n连续运行k步得到reference；另一路运行j步保存，主动破坏内存参数并清空optimizer，重新加载再运行k−j步。对比参数、moment和下一步loss，检查错误world size/precision时是否拒绝。真实大模型还要考虑磁盘容量与中途崩溃，不应只验证文件存在。\n\n## 完整作业计时\ncheckpoint I/O可能占很大比例。你的AdamW报告中写盘约占总主函数时间的三分之一；局部step加速会被I/O稀释。把setup或共享预处理排除时应另报，不能称从原始数据下载到训练完的总加速。\n","html":"\u003ch2 id=\"h01\">为什么一份BF16权重不足以继续同一训练\u003c/h2>\n\u003cp>要执行“下一步相同更新”，除了参数，还需要Adam m/v、step、学习率调度、FP32 master、随机状态、数据游标/顺序、梯度累积阶段与精度设置。仅能from_pretrained加载的模型文件，通常不包含这些训练状态。\u003c/p>\n\u003cp>你的8B HF导出用于部署并验证logits重载；它不是已验证的8B完整AdamW恢复。小模型的checkpoint恢复通过，也不能自动覆盖大模型存储和I/O风险。\u003c/p>\n\u003ch2 id=\"h02\">分片checkpoint为什么要manifest\u003c/h2>\n\u003cp>每个rank保存自己的参数/optimizer分片。需要记录world size、参数结构、padding、dtype和训练协议；恢复时应拒绝不兼容状态，或明确实现resharding。不能在改变world size后直接按旧rank文件加载并假装完成弹性恢复。\u003c/p>\n\u003cp>项目采用写临时文件、flush/fsync后rename，并通过完成标记说明各rank保存结束。该方式提高单次写入的可靠性，但分布式失败恢复、网络文件系统一致性和任意故障原子性仍需更完整协议。\u003c/p>\n\u003ch2 id=\"h03\">容量账本\u003c/h2>\n\u003cp>FP32 master与两个FP32 Adam moments约12P字节，P=8.19B时约91.54GiB，未计元数据/安全空间。BF16模型导出约2P字节，即15.26GiB。两者差异来自保存内容，而不是某种神奇压缩。\u003c/p>\n\u003ch2 id=\"h04\">数据顺序也属于状态\u003c/h2>\n\u003cp>相同模型/optimizer若恢复后换了batch顺序，训练轨迹自然不同。记录token文件hash、block索引、shuffle种子与sampler状态，才能区分数据变化和数值错误。验证集只用于既定协议，test不能用于事后调节门槛。\u003c/p>\n\u003ch2 id=\"h05\">怎么设计一个有力的恢复测试\u003c/h2>\n\u003cp>连续运行k步得到reference；另一路运行j步保存，主动破坏内存参数并清空optimizer，重新加载再运行k−j步。对比参数、moment和下一步loss，检查错误world size/precision时是否拒绝。真实大模型还要考虑磁盘容量与中途崩溃，不应只验证文件存在。\u003c/p>\n\u003ch2 id=\"h06\">完整作业计时\u003c/h2>\n\u003cp>checkpoint I/O可能占很大比例。你的AdamW报告中写盘约占总主函数时间的三分之一；局部step加速会被I/O稀释。把setup或共享预处理排除时应另报，不能称从原始数据下载到训练完的总加速。\u003c/p>\n","toc":[{"id":"h01","title":"为什么一份BF16权重不足以继续同一训练","level":2},{"id":"h02","title":"分片checkpoint为什么要manifest","level":2},{"id":"h03","title":"容量账本","level":2},{"id":"h04","title":"数据顺序也属于状态","level":2},{"id":"h05","title":"怎么设计一个有力的恢复测试","level":2},{"id":"h06","title":"完整作业计时","level":2}],"plain":"为什么一份BF16权重不足以继续同一训练 要执行“下一步相同更新”，除了参数，还需要Adam m/v、step、学习率调度、FP32 master、随机状态、数据游标/顺序、梯度累积阶段与精度设置。仅能from_pretrained加载的模型文件，通常不包含这些训练状态。 你的8B HF导出用于部署并验证logits重载；它不是已验证的8B完整AdamW恢复。小模型的checkpoint恢复通过，也不能自动覆盖大模型存储和I/O风险。 分片checkpoint为什么要manifest 每个rank保存自己的参数/optimizer分片。需要记录world size、参数结构、padding、dtype和训练协议；恢复时应拒绝不兼容状态，或明确实现resharding。不能在改变world size后直接按旧rank文件加载并假装完成弹性恢复。 项目采用写临时文件、flush/fsync后rename，并通过完成标记说明各rank保存结束。该方式提高单次写入的可靠性，但分布式失败恢复、网络文件系统一致性和任意故障原子性仍需更完整协议。 容量账本 FP32 master与两个FP32 Adam moments约12P字节，P=8.19B时约91.54GiB，未计元数据/安全空间。BF16模型导出约2P字节，即15.26GiB。两者差异来自保存内容，而不是某种神奇压缩。 数据顺序也属于状态 相同模型/optimizer若恢复后换了batch顺序，训练轨迹自然不同。记录token文件hash、block索引、shuffle种子与sampler状态，才能区分数据变化和数值错误。验证集只用于既定协议，test不能用于事后调节门槛。 怎么设计一个有力的恢复测试 连续运行k步得到reference；另一路运行j步保存，主动破坏内存参数并清空optimizer，重新加载再运行k−j步。对比参数、moment和下一步loss，检查错误world size/precision时是否拒绝。真实大模型还要考虑磁盘容量与中途崩溃，不应只验证文件存在。 完整作业计时 checkpoint I/O可能占很大比例。你的AdamW报告中写盘约占总主函数时间的三分之一；局部step加速会被I/O稀释。把setup或共享预处理排除时应另报，不能称从原始数据下载到训练完的总加速。","charCount":963},{"id":"dynamo","title":"torch.compile与Dynamo：图、guards和graph break","section":"compiler","summary":"先理解Python捕获边界，再区分重新编译、断图与外部kernel。","prereq":["autograd","tensor-layout","profiling"],"sources":["compiler","dynamo-doc","compile-faq","qcompile"],"tags":["Dynamo","torch.compile","guards","graph break"],"level":1,"kind":"原理与推导","checks":[{"q":"guard失效与graph break是一回事吗？","a":"不是。前者是缓存图复用假设失败，后者是捕获区域被打断。"},{"q":"fullgraph=True是否等于一个CUDA kernel？","a":"不等于。一个捕获图可以lower成许多generated/extern kernels。"}],"lab":null,"raw":"## 为什么不直接执行Python\nEager按运行顺序调用Tensor操作，编译器希望看到更大计算范围，以消除中间张量并选择高效实现。`torch.compile`不是把任何Python程序一次性变成一个巨大GPU kernel，而是捕获可编译区域，再交给后端。\n\nDynamo在Python frame/bytecode执行层跟踪Tensor计算，生成FX graph，并建立图可以被安全复用的条件。这里的graph是操作与依赖，不是CUDA Graph的设备提交拓扑；两个“graph”属于不同层。\n\n## Guards在保护什么\n一次调用可能依赖dtype、device、shape/stride约束、Python对象状态或函数身份。Guard检查这些假设是否仍成立。输入变化可能命中已有缓存版本，也可能触发新的specialization/recompile。\n\nGuard失败不等于graph break。Graph break是在捕获一个执行过程时，遇到当前无法表达或安全处理的行为，将执行拆为编译区域和Python部分。过多断图可能减少融合机会，增加调度。\n\n## 动态shape也不是没有任何条件\nSymbolic dimension允许某些尺寸在约束范围内变化，编译器仍需保证合法的布局、broadcast和控制条件。把尺寸全做symbolic可能影响优化，也不能自动处理任意数据依赖的Python分支。\n\n```python\n# 观察而非保证生成特定kernel；需要兼容PyTorch环境\nf = torch.compile(lambda x: (x + 1).relu(), backend='inductor')\ny1 = f(torch.randn(32, 128, device='cuda'))\ny2 = f(torch.randn(64, 128, device='cuda'))\n# 用 TORCH_LOGS='recompiles,graph_breaks' 在目标版本检查日志\n```\n\n首次运行可能包含编译；后续shape变化可能再编译。不能将含fallback或编译失败的对照当作有效baseline。\n\n## fullgraph的意义\n`fullgraph=True`要求被捕获调用形成一个完整捕获图，遇到不支持的graph break会报错；它不意味着最终只有一个GPU kernel，不保证所有操作都由Triton生成，也不保证性能最好。\n\n## 项目连接\nQwen整模型compile强基线需要对齐static cache、Flash后端与Graph政策，并检查重编译次数。DeepOpFuzz则把shape/dtype/context等作为影响编译选择的输入。相同operator列表并不决定相同artifact。\n","html":"\u003ch2 id=\"h01\">为什么不直接执行Python\u003c/h2>\n\u003cp>Eager按运行顺序调用Tensor操作，编译器希望看到更大计算范围，以消除中间张量并选择高效实现。\u003ccode>torch.compile\u003c/code>不是把任何Python程序一次性变成一个巨大GPU kernel，而是捕获可编译区域，再交给后端。\u003c/p>\n\u003cp>Dynamo在Python frame/bytecode执行层跟踪Tensor计算，生成FX graph，并建立图可以被安全复用的条件。这里的graph是操作与依赖，不是CUDA Graph的设备提交拓扑；两个“graph”属于不同层。\u003c/p>\n\u003ch2 id=\"h02\">Guards在保护什么\u003c/h2>\n\u003cp>一次调用可能依赖dtype、device、shape/stride约束、Python对象状态或函数身份。Guard检查这些假设是否仍成立。输入变化可能命中已有缓存版本，也可能触发新的specialization/recompile。\u003c/p>\n\u003cp>Guard失败不等于graph break。Graph break是在捕获一个执行过程时，遇到当前无法表达或安全处理的行为，将执行拆为编译区域和Python部分。过多断图可能减少融合机会，增加调度。\u003c/p>\n\u003ch2 id=\"h03\">动态shape也不是没有任何条件\u003c/h2>\n\u003cp>Symbolic dimension允许某些尺寸在约束范围内变化，编译器仍需保证合法的布局、broadcast和控制条件。把尺寸全做symbolic可能影响优化，也不能自动处理任意数据依赖的Python分支。\u003c/p>\n\u003cpre class=\"python\">\u003ccode># 观察而非保证生成特定kernel；需要兼容PyTorch环境\nf = torch.compile(lambda x: (x + 1).relu(), backend=&#39;inductor&#39;)\ny1 = f(torch.randn(32, 128, device=&#39;cuda&#39;))\ny2 = f(torch.randn(64, 128, device=&#39;cuda&#39;))\n# 用 TORCH_LOGS=&#39;recompiles,graph_breaks&#39; 在目标版本检查日志\u003c/code>\u003c/pre>\n\u003cp>首次运行可能包含编译；后续shape变化可能再编译。不能将含fallback或编译失败的对照当作有效baseline。\u003c/p>\n\u003ch2 id=\"h04\">fullgraph的意义\u003c/h2>\n\u003cp>\u003ccode>fullgraph=True\u003c/code>要求被捕获调用形成一个完整捕获图，遇到不支持的graph break会报错；它不意味着最终只有一个GPU kernel，不保证所有操作都由Triton生成，也不保证性能最好。\u003c/p>\n\u003ch2 id=\"h05\">项目连接\u003c/h2>\n\u003cp>Qwen整模型compile强基线需要对齐static cache、Flash后端与Graph政策，并检查重编译次数。DeepOpFuzz则把shape/dtype/context等作为影响编译选择的输入。相同operator列表并不决定相同artifact。\u003c/p>\n","toc":[{"id":"h01","title":"为什么不直接执行Python","level":2},{"id":"h02","title":"Guards在保护什么","level":2},{"id":"h03","title":"动态shape也不是没有任何条件","level":2},{"id":"h04","title":"fullgraph的意义","level":2},{"id":"h05","title":"项目连接","level":2}],"plain":"为什么不直接执行Python Eager按运行顺序调用Tensor操作，编译器希望看到更大计算范围，以消除中间张量并选择高效实现。 torch.compile 不是把任何Python程序一次性变成一个巨大GPU kernel，而是捕获可编译区域，再交给后端。 Dynamo在Python frame/bytecode执行层跟踪Tensor计算，生成FX graph，并建立图可以被安全复用的条件。这里的graph是操作与依赖，不是CUDA Graph的设备提交拓扑；两个“graph”属于不同层。 Guards在保护什么 一次调用可能依赖dtype、device、shape/stride约束、Python对象状态或函数身份。Guard检查这些假设是否仍成立。输入变化可能命中已有缓存版本，也可能触发新的specialization/recompile。 Guard失败不等于graph break。Graph break是在捕获一个执行过程时，遇到当前无法表达或安全处理的行为，将执行拆为编译区域和Python部分。过多断图可能减少融合机会，增加调度。 动态shape也不是没有任何条件 Symbolic dimension允许某些尺寸在约束范围内变化，编译器仍需保证合法的布局、broadcast和控制条件。把尺寸全做symbolic可能影响优化，也不能自动处理任意数据依赖的Python分支。 # 观察而非保证生成特定kernel；需要兼容PyTorch环境 f = torch.compile(lambda x: (x + 1).relu(), backend='inductor') y1 = f(torch.randn(32, 128, device='cuda')) y2 = f(torch.randn(64, 128, device='cuda')) # 用 TORCH_LOGS='recompiles,graph_breaks' 在目标版本检查日志 首次运行可能包含编译；后续shape变化可能再编译。不能将含fallback或编译失败的对照当作有效baseline。 fullgraph的意义 fullgraph=True 要求被捕获调用形成一个完整捕获图，遇到不支持的graph break会报错；它不意味着最终只有一个GPU kernel，不保证所有操作都由Triton生成，也不保证性能最好。 项目连接 Qwen整模型compile强基线需要对齐static cache、Flash后端与Graph政策，并检查重编译次数。DeepOpFuzz则把shape/dtype/context等作为影响编译选择的输入。相同operator列表并不决定相同artifact。","charCount":1098},{"id":"aotautograd","title":"AOTAutograd：joint graph、functionalization与saved tensors","section":"compiler","summary":"从反向依赖解释图切分，并分清AOTAutograd与Compiled Autograd。","prereq":["dynamo","autograd","accum-recompute"],"sources":["aot-doc","compiled-autograd","compile-faq","bug-bwd"],"tags":["AOTAutograd","functionalization","FakeTensor","Compiled Autograd"],"level":2,"kind":"原理与推导","checks":[{"q":"aot_eager正确能否证明FakeTensor metadata一定正确？","a":"不能。eager kernel可能重新物化正确layout，而Inductor会使用metadata作编译推断。"},{"q":"compiled backward与Compiled Autograd完全同义吗？","a":"不是。后者是PyTorch特定的运行时autograd图捕获机制，普通AOT路径也能编译backward。"}],"lab":null,"raw":"## 训练编译不能只优化forward\n若只把forward交给编译器，backward中的大量算子仍无法统一优化。AOTAutograd利用PyTorch求导机制构造可被后端编译的前反向表示，通常涉及joint graph，再partition为forward与backward图。这里“AOT”相对于后续执行，不意味着在Python程序首次运行前已经完成全部静态编译。\n\n## 为什么要joint graph\n以 $y=\\sin(x)\\cdot x$ 为例，backward需要x和cos(x)。可以在forward保存中间值，也可以backward重算。把两部分依赖一起观察，有机会在保存张量、重算成本和融合之间权衡。partition得到的forward可能返回供backward使用的额外saved tensors，不只是用户可见输出。\n\n## Functionalization不是删除所有副作用\n原地操作与view使alias关系复杂。编译前的函数式转换将部分mutation表示为显式输入输出关系，同时确保对用户可观察的修改仍被正确反映。将 `x.add_` 改写为新tensor后，还必须考虑谁引用旧storage、最后怎样把更新反馈出去。\n\nFake/Meta执行用不持有真实数据的Tensor元信息帮助推导shape、dtype和stride。错误元信息可能让真实算子在eager里正确，进入编译lowering时却出错。它不是“随便填一个正确shape就行”。\n\n## backward输出是什么\n对上游向量g，自动微分实际常算vector-Jacobian product，而非显式构造巨大Jacobian。梯度的shape、dtype、alias和requires_grad语义都可能重要。higher-order gradient还涉及对反向计算继续求导，不是所有编译/自定义kernel路径都支持。\n\n## Compiled Autograd不要混用\n普通torch.compile经AOTAutograd处理捕获区域的backward；PyTorch另有Compiled Autograd机制，在运行时autograd engine层捕获更大反向图，涉及hooks等不同边界。不能把“backward被编译了”一概说成使用了这个特定功能。\n\n## 项目中的定位方法\n`backend='eager'`、`aot_eager`、`inductor`可帮助逐步缩小差异出现的层次。aot_eager正确但Inductor错误，说明后端使用图/metadata的路径值得检查，却不能据此断言所有上游metadata都完美无误。你的slice_scatter案例正是这一细节。\n","html":"\u003ch2 id=\"h01\">训练编译不能只优化forward\u003c/h2>\n\u003cp>若只把forward交给编译器，backward中的大量算子仍无法统一优化。AOTAutograd利用PyTorch求导机制构造可被后端编译的前反向表示，通常涉及joint graph，再partition为forward与backward图。这里“AOT”相对于后续执行，不意味着在Python程序首次运行前已经完成全部静态编译。\u003c/p>\n\u003ch2 id=\"h02\">为什么要joint graph\u003c/h2>\n\u003cp>以 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>sin\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>⋅\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y=\\sin(x)\\cdot x\u003c/annotation>\u003c/semantics>\u003c/math> 为例，backward需要x和cos(x)。可以在forward保存中间值，也可以backward重算。把两部分依赖一起观察，有机会在保存张量、重算成本和融合之间权衡。partition得到的forward可能返回供backward使用的额外saved tensors，不只是用户可见输出。\u003c/p>\n\u003ch2 id=\"h03\">Functionalization不是删除所有副作用\u003c/h2>\n\u003cp>原地操作与view使alias关系复杂。编译前的函数式转换将部分mutation表示为显式输入输出关系，同时确保对用户可观察的修改仍被正确反映。将 \u003ccode>x.add_\u003c/code> 改写为新tensor后，还必须考虑谁引用旧storage、最后怎样把更新反馈出去。\u003c/p>\n\u003cp>Fake/Meta执行用不持有真实数据的Tensor元信息帮助推导shape、dtype和stride。错误元信息可能让真实算子在eager里正确，进入编译lowering时却出错。它不是“随便填一个正确shape就行”。\u003c/p>\n\u003ch2 id=\"h04\">backward输出是什么\u003c/h2>\n\u003cp>对上游向量g，自动微分实际常算vector-Jacobian product，而非显式构造巨大Jacobian。梯度的shape、dtype、alias和requires_grad语义都可能重要。higher-order gradient还涉及对反向计算继续求导，不是所有编译/自定义kernel路径都支持。\u003c/p>\n\u003ch2 id=\"h05\">Compiled Autograd不要混用\u003c/h2>\n\u003cp>普通torch.compile经AOTAutograd处理捕获区域的backward；PyTorch另有Compiled Autograd机制，在运行时autograd engine层捕获更大反向图，涉及hooks等不同边界。不能把“backward被编译了”一概说成使用了这个特定功能。\u003c/p>\n\u003ch2 id=\"h06\">项目中的定位方法\u003c/h2>\n\u003cp>\u003ccode>backend='eager'\u003c/code>、\u003ccode>aot_eager\u003c/code>、\u003ccode>inductor\u003c/code>可帮助逐步缩小差异出现的层次。aot_eager正确但Inductor错误，说明后端使用图/metadata的路径值得检查，却不能据此断言所有上游metadata都完美无误。你的slice_scatter案例正是这一细节。\u003c/p>\n","toc":[{"id":"h01","title":"训练编译不能只优化forward","level":2},{"id":"h02","title":"为什么要joint graph","level":2},{"id":"h03","title":"Functionalization不是删除所有副作用","level":2},{"id":"h04","title":"backward输出是什么","level":2},{"id":"h05","title":"Compiled Autograd不要混用","level":2},{"id":"h06","title":"项目中的定位方法","level":2}],"plain":"训练编译不能只优化forward 若只把forward交给编译器，backward中的大量算子仍无法统一优化。AOTAutograd利用PyTorch求导机制构造可被后端编译的前反向表示，通常涉及joint graph，再partition为forward与backward图。这里“AOT”相对于后续执行，不意味着在Python程序首次运行前已经完成全部静态编译。 为什么要joint graph 以 y = sin ( x ) ⋅ x 为例，backward需要x和cos(x)。可以在forward保存中间值，也可以backward重算。把两部分依赖一起观察，有机会在保存张量、重算成本和融合之间权衡。partition得到的forward可能返回供backward使用的额外saved tensors，不只是用户可见输出。 Functionalization不是删除所有副作用 原地操作与view使alias关系复杂。编译前的函数式转换将部分mutation表示为显式输入输出关系，同时确保对用户可观察的修改仍被正确反映。将 x.add_ 改写为新tensor后，还必须考虑谁引用旧storage、最后怎样把更新反馈出去。 Fake/Meta执行用不持有真实数据的Tensor元信息帮助推导shape、dtype和stride。错误元信息可能让真实算子在eager里正确，进入编译lowering时却出错。它不是“随便填一个正确shape就行”。 backward输出是什么 对上游向量g，自动微分实际常算vector-Jacobian product，而非显式构造巨大Jacobian。梯度的shape、dtype、alias和requires_grad语义都可能重要。higher-order gradient还涉及对反向计算继续求导，不是所有编译/自定义kernel路径都支持。 Compiled Autograd不要混用 普通torch.compile经AOTAutograd处理捕获区域的backward；PyTorch另有Compiled Autograd机制，在运行时autograd engine层捕获更大反向图，涉及hooks等不同边界。不能把“backward被编译了”一概说成使用了这个特定功能。 项目中的定位方法 backend='eager' 、 aot_eager 、 inductor 可帮助逐步缩小差异出现的层次。aot_eager正确但Inductor错误，说明后端使用图/metadata的路径值得检查，却不能据此断言所有上游metadata都完美无误。你的slice_scatter案例正是这一细节。","charCount":1087},{"id":"inductor","title":"Inductor IR、Fusion与Scheduling：从算子到循环和缓冲区","section":"compiler","summary":"解释lowering与extern选择，并区分graph调度和kernel内部映射。","prereq":["aotautograd","gemm-tiling","qk-fusion"],"sources":["inductor-doc","compiler","deepop"],"tags":["Inductor","IR","Fusion","Scheduling","extern"],"level":2,"kind":"原理与推导","checks":[{"q":"图里有sum就证明测到特定reduction schedule吗？","a":"没有。shape、dtype、layout、硬件和编译选项可能选择不同kernel family。"},{"q":"调用cuBLAS是不是compile失效？","a":"不一定。编译图内部可以合法dispatch到外部库。"}],"lab":null,"raw":"## 为什么FX graph还不能直接在GPU上跑\n高层图的 `relu` 或 `sum` 描述数学操作，GPU代码还需要每个输出对应什么地址、在哪个维度归约、哪些值存为buffer，以及操作间依赖。Inductor lowering把ATen计算转换为便于后端处理的内部表示，包括pointwise/reduction计算、views/layout与extern kernel调用等。\n\n可以把ReLU理解为 `out[i]=max(load(x,index(i)),0)`；sum还要给出输出域与归约域。真实IR不仅是打印出来的for循环，也有延迟计算和buffer等组织。\n\n## Extern不是失败的编译\n大GEMM或特定操作可能调用成熟库或模板实现。一个捕获图可以包含自生成Triton和extern调用。走extern是合法后端决策，不自动意味着Dynamo graph break，也不等于eager fallback。\n\n## Fusion先过合法性，再考虑收益\nProducer-consumer fusion可将生产计算内联到消费，减少中间存储；horizontal fusion尝试合并兼容的独立计算。需要检查依赖、mutation/alias、设备、索引/迭代域、reduction兼容性、模板接口和资源约束。\n\n“单一消费者”是常见有利条件，不是所有融合必须满足的绝对规则；多消费者可能选择物化、重算或其他组合。transpose view也不是必然的fusion边界，关键是地址与计算映射能否兼容。\n\n## Scheduling有多个层次\nInductor scheduler管理依赖、节点分组、顺序与融合等；后续codegen和Triton后端还会决定具体tile、warp布局及资源使用。把所有GPU映射细节都归给同一个scheduler函数是不准确的。\n\n同一个reduce在不同尺寸下可能选择不同kernel family。persistent reduction、分块/分段归约具有不同资源权衡。阈值受版本和硬件影响，不应背某个固定数当作全部GPU通用规则。\n\n## Memory planning为什么也会影响正确性\n两个buffer如果生命周期不重叠，可能复用storage；但若alias或mutation依赖判断错，就可能提前覆盖仍需要的数据。因此compiler correctness不仅是计算公式，还包含布局和生命周期语义。\n\n## 与DeepOpFuzz的连接\noperation target可以是某种lowering、fusion、schedule或extern选择。真正命中应通过artifact与trace确认，而非只检查输入图含某个operator。这使shape/stride/context成为编译决策的输入，而不仅是执行时的数据。\n","html":"\u003ch2 id=\"h01\">为什么FX graph还不能直接在GPU上跑\u003c/h2>\n\u003cp>高层图的 \u003ccode>relu\u003c/code> 或 \u003ccode>sum\u003c/code> 描述数学操作，GPU代码还需要每个输出对应什么地址、在哪个维度归约、哪些值存为buffer，以及操作间依赖。Inductor lowering把ATen计算转换为便于后端处理的内部表示，包括pointwise/reduction计算、views/layout与extern kernel调用等。\u003c/p>\n\u003cp>可以把ReLU理解为 \u003ccode>out[i]=max(load(x,index(i)),0)\u003c/code>；sum还要给出输出域与归约域。真实IR不仅是打印出来的for循环，也有延迟计算和buffer等组织。\u003c/p>\n\u003ch2 id=\"h02\">Extern不是失败的编译\u003c/h2>\n\u003cp>大GEMM或特定操作可能调用成熟库或模板实现。一个捕获图可以包含自生成Triton和extern调用。走extern是合法后端决策，不自动意味着Dynamo graph break，也不等于eager fallback。\u003c/p>\n\u003ch2 id=\"h03\">Fusion先过合法性，再考虑收益\u003c/h2>\n\u003cp>Producer-consumer fusion可将生产计算内联到消费，减少中间存储；horizontal fusion尝试合并兼容的独立计算。需要检查依赖、mutation/alias、设备、索引/迭代域、reduction兼容性、模板接口和资源约束。\u003c/p>\n\u003cp>“单一消费者”是常见有利条件，不是所有融合必须满足的绝对规则；多消费者可能选择物化、重算或其他组合。transpose view也不是必然的fusion边界，关键是地址与计算映射能否兼容。\u003c/p>\n\u003ch2 id=\"h04\">Scheduling有多个层次\u003c/h2>\n\u003cp>Inductor scheduler管理依赖、节点分组、顺序与融合等；后续codegen和Triton后端还会决定具体tile、warp布局及资源使用。把所有GPU映射细节都归给同一个scheduler函数是不准确的。\u003c/p>\n\u003cp>同一个reduce在不同尺寸下可能选择不同kernel family。persistent reduction、分块/分段归约具有不同资源权衡。阈值受版本和硬件影响，不应背某个固定数当作全部GPU通用规则。\u003c/p>\n\u003ch2 id=\"h05\">Memory planning为什么也会影响正确性\u003c/h2>\n\u003cp>两个buffer如果生命周期不重叠，可能复用storage；但若alias或mutation依赖判断错，就可能提前覆盖仍需要的数据。因此compiler correctness不仅是计算公式，还包含布局和生命周期语义。\u003c/p>\n\u003ch2 id=\"h06\">与DeepOpFuzz的连接\u003c/h2>\n\u003cp>operation target可以是某种lowering、fusion、schedule或extern选择。真正命中应通过artifact与trace确认，而非只检查输入图含某个operator。这使shape/stride/context成为编译决策的输入，而不仅是执行时的数据。\u003c/p>\n","toc":[{"id":"h01","title":"为什么FX graph还不能直接在GPU上跑","level":2},{"id":"h02","title":"Extern不是失败的编译","level":2},{"id":"h03","title":"Fusion先过合法性，再考虑收益","level":2},{"id":"h04","title":"Scheduling有多个层次","level":2},{"id":"h05","title":"Memory planning为什么也会影响正确性","level":2},{"id":"h06","title":"与DeepOpFuzz的连接","level":2}],"plain":"为什么FX graph还不能直接在GPU上跑 高层图的 relu 或 sum 描述数学操作，GPU代码还需要每个输出对应什么地址、在哪个维度归约、哪些值存为buffer，以及操作间依赖。Inductor lowering把ATen计算转换为便于后端处理的内部表示，包括pointwise/reduction计算、views/layout与extern kernel调用等。 可以把ReLU理解为 out[i]=max(load(x,index(i)),0) ；sum还要给出输出域与归约域。真实IR不仅是打印出来的for循环，也有延迟计算和buffer等组织。 Extern不是失败的编译 大GEMM或特定操作可能调用成熟库或模板实现。一个捕获图可以包含自生成Triton和extern调用。走extern是合法后端决策，不自动意味着Dynamo graph break，也不等于eager fallback。 Fusion先过合法性，再考虑收益 Producer-consumer fusion可将生产计算内联到消费，减少中间存储；horizontal fusion尝试合并兼容的独立计算。需要检查依赖、mutation/alias、设备、索引/迭代域、reduction兼容性、模板接口和资源约束。 “单一消费者”是常见有利条件，不是所有融合必须满足的绝对规则；多消费者可能选择物化、重算或其他组合。transpose view也不是必然的fusion边界，关键是地址与计算映射能否兼容。 Scheduling有多个层次 Inductor scheduler管理依赖、节点分组、顺序与融合等；后续codegen和Triton后端还会决定具体tile、warp布局及资源使用。把所有GPU映射细节都归给同一个scheduler函数是不准确的。 同一个reduce在不同尺寸下可能选择不同kernel family。persistent reduction、分块/分段归约具有不同资源权衡。阈值受版本和硬件影响，不应背某个固定数当作全部GPU通用规则。 Memory planning为什么也会影响正确性 两个buffer如果生命周期不重叠，可能复用storage；但若alias或mutation依赖判断错，就可能提前覆盖仍需要的数据。因此compiler correctness不仅是计算公式，还包含布局和生命周期语义。 与DeepOpFuzz的连接 operation target可以是某种lowering、fusion、schedule或extern选择。真正命中应通过artifact与trace确认，而非只检查输入图含某个operator。这使shape/stride/context成为编译决策的输入，而不仅是执行时的数据。","charCount":1135},{"id":"triton-codegen","title":"Codegen、MLIR与PTX：生成的代码如何到达GPU","section":"compiler","summary":"讲清IR、pass、operation、TTIR、PTX与机器码的层次。","prereq":["inductor","triton-model","tensor-layout"],"sources":["triton-ir","mlir","bug-pool","deepop"],"tags":["MLIR","PTX","codegen","Pass","TTIR"],"level":2,"kind":"原理与推导","checks":[{"q":"PTX就是最终GPU机器码吗？","a":"不是。它是NVIDIA虚拟指令集层的表示，还会生成针对目标架构的设备二进制。"},{"q":"generated Triton错是否一定是Triton compiler bug？","a":"不是。上游Inductor可能生成了本来就错误的索引或语义。"}],"lab":null,"raw":"## 一条典型NVIDIA路径\nInductor可以输出Triton程序，Triton编译器再经过自身IR、优化与lowering，最终产生设备代码。在典型NVIDIA后端中可看到TTIR、GPU相关IR、LLVM/PTX及二进制等产物；具体阶段与名字随版本/后端变化。CPU或AMD路径不同。\n\n\u003cdiv class=\"flow\">\u003cspan>FX / ATen graph\u003c/span>\u003cspan>Inductor IR\u003c/span>\u003cspan>Triton source\u003c/span>\u003cspan>Triton / GPU IR\u003c/span>\u003cspan>PTX\u003c/span>\u003cspan>设备二进制\u003c/span>\u003c/div>\n\nPTX是虚拟指令集表示，不等同最终硬件SASS。源码看起来一次load，不保证最终是一条固定形式的机器访存；编译器会做向量化、布局转换、寄存器分配等。\n\n## Pass为什么不属于某一层\nPass是对某种表示进行分析或变换的组织方式。MLIR提供多层IR和pass基础设施，LLVM/TVM/Inductor也有各自pass或pass-like转换。不能说“pass就是MLIR层”。\n\nMLIR的Operation是IR节点概念，而DeepOpFuzz论文的compiler operation是具体编译选择/变换的测试抽象。两个同名词并非严格同一术语。\n\n## codegen怎样算错\n若高层图正确，但生成代码用错误stride计算地址、mask未覆盖边界、cast被错误删除或依赖被重排，执行结果仍可能错误。看见generated Triton出错，并不自动说明Triton编译器出错；也可能是Inductor生成的源程序本来就不符合语义。\n\n你的pool案例把某个生成kernel的错误batch stride从3200改为3185后恢复数值，说明关键差异在所生成的地址表达式。它有力定位了失败机制，但正式上游修复仍需找清metadata/layout到codegen的根因，不宜仅凭文件名下结论。\n\n## 如何读一段generated kernel\n先确认输入/输出buffer真实shape与stride；再看program_id对应哪些输出元素；跟踪索引表达式；检查tail mask；识别reduction域；最后检查dtype提升、cast和数学近似。不要一开始陷入上百个tmp变量。\n\n性能分析则另看vectorized load、寄存器、spill与指令选择，不能把源码行数当性能指标。代码越短不等于设备指令更少。\n","html":"\u003ch2 id=\"h01\">一条典型NVIDIA路径\u003c/h2>\n\u003cp>Inductor可以输出Triton程序，Triton编译器再经过自身IR、优化与lowering，最终产生设备代码。在典型NVIDIA后端中可看到TTIR、GPU相关IR、LLVM/PTX及二进制等产物；具体阶段与名字随版本/后端变化。CPU或AMD路径不同。\u003c/p>\n\u003cdiv class=\"flow\">\n\u003cspan>FX / ATen graph\u003c/span>\u003cspan>Inductor IR\u003c/span>\u003cspan>Triton source\u003c/span>\u003cspan>Triton / GPU IR\u003c/span>\u003cspan>PTX\u003c/span>\u003cspan>设备二进制\u003c/span>\n\u003c/div>\n\u003cp>PTX是虚拟指令集表示，不等同最终硬件SASS。源码看起来一次load，不保证最终是一条固定形式的机器访存；编译器会做向量化、布局转换、寄存器分配等。\u003c/p>\n\u003ch2 id=\"h02\">Pass为什么不属于某一层\u003c/h2>\n\u003cp>Pass是对某种表示进行分析或变换的组织方式。MLIR提供多层IR和pass基础设施，LLVM/TVM/Inductor也有各自pass或pass-like转换。不能说“pass就是MLIR层”。\u003c/p>\n\u003cp>MLIR的Operation是IR节点概念，而DeepOpFuzz论文的compiler operation是具体编译选择/变换的测试抽象。两个同名词并非严格同一术语。\u003c/p>\n\u003ch2 id=\"h03\">codegen怎样算错\u003c/h2>\n\u003cp>若高层图正确，但生成代码用错误stride计算地址、mask未覆盖边界、cast被错误删除或依赖被重排，执行结果仍可能错误。看见generated Triton出错，并不自动说明Triton编译器出错；也可能是Inductor生成的源程序本来就不符合语义。\u003c/p>\n\u003cp>你的pool案例把某个生成kernel的错误batch stride从3200改为3185后恢复数值，说明关键差异在所生成的地址表达式。它有力定位了失败机制，但正式上游修复仍需找清metadata/layout到codegen的根因，不宜仅凭文件名下结论。\u003c/p>\n\u003ch2 id=\"h04\">如何读一段generated kernel\u003c/h2>\n\u003cp>先确认输入/输出buffer真实shape与stride；再看program_id对应哪些输出元素；跟踪索引表达式；检查tail mask；识别reduction域；最后检查dtype提升、cast和数学近似。不要一开始陷入上百个tmp变量。\u003c/p>\n\u003cp>性能分析则另看vectorized load、寄存器、spill与指令选择，不能把源码行数当性能指标。代码越短不等于设备指令更少。\u003c/p>\n","toc":[{"id":"h01","title":"一条典型NVIDIA路径","level":2},{"id":"h02","title":"Pass为什么不属于某一层","level":2},{"id":"h03","title":"codegen怎样算错","level":2},{"id":"h04","title":"如何读一段generated kernel","level":2}],"plain":"一条典型NVIDIA路径 Inductor可以输出Triton程序，Triton编译器再经过自身IR、优化与lowering，最终产生设备代码。在典型NVIDIA后端中可看到TTIR、GPU相关IR、LLVM/PTX及二进制等产物；具体阶段与名字随版本/后端变化。CPU或AMD路径不同。 FX / ATen graph Inductor IR Triton source Triton / GPU IR PTX 设备二进制 PTX是虚拟指令集表示，不等同最终硬件SASS。源码看起来一次load，不保证最终是一条固定形式的机器访存；编译器会做向量化、布局转换、寄存器分配等。 Pass为什么不属于某一层 Pass是对某种表示进行分析或变换的组织方式。MLIR提供多层IR和pass基础设施，LLVM/TVM/Inductor也有各自pass或pass-like转换。不能说“pass就是MLIR层”。 MLIR的Operation是IR节点概念，而DeepOpFuzz论文的compiler operation是具体编译选择/变换的测试抽象。两个同名词并非严格同一术语。 codegen怎样算错 若高层图正确，但生成代码用错误stride计算地址、mask未覆盖边界、cast被错误删除或依赖被重排，执行结果仍可能错误。看见generated Triton出错，并不自动说明Triton编译器出错；也可能是Inductor生成的源程序本来就不符合语义。 你的pool案例把某个生成kernel的错误batch stride从3200改为3185后恢复数值，说明关键差异在所生成的地址表达式。它有力定位了失败机制，但正式上游修复仍需找清metadata/layout到codegen的根因，不宜仅凭文件名下结论。 如何读一段generated kernel 先确认输入/输出buffer真实shape与stride；再看program_id对应哪些输出元素；跟踪索引表达式；检查tail mask；识别reduction域；最后检查dtype提升、cast和数学近似。不要一开始陷入上百个tmp变量。 性能分析则另看vectorized load、寄存器、spill与指令选择，不能把源码行数当性能指标。代码越短不等于设备指令更少。","charCount":935},{"id":"custom-ops","title":"自定义Kernel接入compile：mutation、fake与alias契约","section":"compiler","summary":"解释为什么“能单独运行”不等于“编译图内可以安全优化”。","prereq":["dynamo","aotautograd","triton-model"],"sources":["custom-op-doc","qcompileops","qcompile"],"tags":["custom op","mutation","FakeTensor","alias"],"level":3,"kind":"源码与原理","checks":[{"q":"只返回Q、不返回cache，为什么仍要声明mutation？","a":"因为后续计算读取被修改的cache，副作用是计算依赖的一部分。"},{"q":"fullgraph通过是否证明自定义op能与邻接算子融合？","a":"不证明。它可能是图内的opaque边界，需看实际generated artifact和性能。"}],"lab":null,"raw":"## 编译器看不到你的Python意图\n一个custom op调用底层kernel，编译器需要知道输出数量、shape/dtype/device/stride、哪些输入会修改、输出是否共享storage，以及反向规则。缺少这些信息，后端无法安全处理依赖和内存复用。\n\n例如QK kernel直接写入KV cache。数学结果可能只返回Q，但cache mutation影响后面的attention。如果声明为无副作用纯函数，编译器可能错误地重排或消除调用。\n\n## Fake/Meta实现为何重要\n在不执行真实GPU计算时，编译器仍需要推导输出元信息。Fake implementation提供这一描述。它不应读取真实数据决定shape，也不能随意返回错误stride。Shape正确、layout错误，同样能使后端生成错误代码。\n\n## Alias与输出新鲜度\n某些custom-op契约要求返回新Tensor，不能隐式返回输入alias。项目compile接入将cache mutation显式声明，并在custom op外重建相应view。不要简单用“返回的是同一块cache，所以方便”替代注册系统允许的契约。\n\n## Autograd注册是独立的一关\n推理custom op不必自动有训练支持。训练需要明确backward和saved state，检查mutation与梯度的交互。对带in-place/cache更新的操作，更不能默认为可微。\n\n## 编译与性能的关系\n把手写kernel包装成opaque custom op可能帮助捕获，却也可能形成fusion边界。fullgraph通过、零重编译说明编译接入可工作，不保证比已有compile快。要先验证图是否真的走预期kernel，再比较同一shape/backend的性能。\n\n## 对照与测试\n检查eager与compiled输出、不同shape的fake行为、mutation后的cache内容、alias、重复调用和错误入口拒绝。项目相关接口与版本固定，直接复制到新PyTorch版本应重新做回归，不能把私有API行为当公共保证。\n\n这是DeepOpFuzz metadata错误案例与Qwen工程接入的另一个连接点：性能优化前需要把Tensor契约描述正确。\n","html":"\u003ch2 id=\"h01\">编译器看不到你的Python意图\u003c/h2>\n\u003cp>一个custom op调用底层kernel，编译器需要知道输出数量、shape/dtype/device/stride、哪些输入会修改、输出是否共享storage，以及反向规则。缺少这些信息，后端无法安全处理依赖和内存复用。\u003c/p>\n\u003cp>例如QK kernel直接写入KV cache。数学结果可能只返回Q，但cache mutation影响后面的attention。如果声明为无副作用纯函数，编译器可能错误地重排或消除调用。\u003c/p>\n\u003ch2 id=\"h02\">Fake/Meta实现为何重要\u003c/h2>\n\u003cp>在不执行真实GPU计算时，编译器仍需要推导输出元信息。Fake implementation提供这一描述。它不应读取真实数据决定shape，也不能随意返回错误stride。Shape正确、layout错误，同样能使后端生成错误代码。\u003c/p>\n\u003ch2 id=\"h03\">Alias与输出新鲜度\u003c/h2>\n\u003cp>某些custom-op契约要求返回新Tensor，不能隐式返回输入alias。项目compile接入将cache mutation显式声明，并在custom op外重建相应view。不要简单用“返回的是同一块cache，所以方便”替代注册系统允许的契约。\u003c/p>\n\u003ch2 id=\"h04\">Autograd注册是独立的一关\u003c/h2>\n\u003cp>推理custom op不必自动有训练支持。训练需要明确backward和saved state，检查mutation与梯度的交互。对带in-place/cache更新的操作，更不能默认为可微。\u003c/p>\n\u003ch2 id=\"h05\">编译与性能的关系\u003c/h2>\n\u003cp>把手写kernel包装成opaque custom op可能帮助捕获，却也可能形成fusion边界。fullgraph通过、零重编译说明编译接入可工作，不保证比已有compile快。要先验证图是否真的走预期kernel，再比较同一shape/backend的性能。\u003c/p>\n\u003ch2 id=\"h06\">对照与测试\u003c/h2>\n\u003cp>检查eager与compiled输出、不同shape的fake行为、mutation后的cache内容、alias、重复调用和错误入口拒绝。项目相关接口与版本固定，直接复制到新PyTorch版本应重新做回归，不能把私有API行为当公共保证。\u003c/p>\n\u003cp>这是DeepOpFuzz metadata错误案例与Qwen工程接入的另一个连接点：性能优化前需要把Tensor契约描述正确。\u003c/p>\n","toc":[{"id":"h01","title":"编译器看不到你的Python意图","level":2},{"id":"h02","title":"Fake/Meta实现为何重要","level":2},{"id":"h03","title":"Alias与输出新鲜度","level":2},{"id":"h04","title":"Autograd注册是独立的一关","level":2},{"id":"h05","title":"编译与性能的关系","level":2},{"id":"h06","title":"对照与测试","level":2}],"plain":"编译器看不到你的Python意图 一个custom op调用底层kernel，编译器需要知道输出数量、shape/dtype/device/stride、哪些输入会修改、输出是否共享storage，以及反向规则。缺少这些信息，后端无法安全处理依赖和内存复用。 例如QK kernel直接写入KV cache。数学结果可能只返回Q，但cache mutation影响后面的attention。如果声明为无副作用纯函数，编译器可能错误地重排或消除调用。 Fake/Meta实现为何重要 在不执行真实GPU计算时，编译器仍需要推导输出元信息。Fake implementation提供这一描述。它不应读取真实数据决定shape，也不能随意返回错误stride。Shape正确、layout错误，同样能使后端生成错误代码。 Alias与输出新鲜度 某些custom-op契约要求返回新Tensor，不能隐式返回输入alias。项目compile接入将cache mutation显式声明，并在custom op外重建相应view。不要简单用“返回的是同一块cache，所以方便”替代注册系统允许的契约。 Autograd注册是独立的一关 推理custom op不必自动有训练支持。训练需要明确backward和saved state，检查mutation与梯度的交互。对带in-place/cache更新的操作，更不能默认为可微。 编译与性能的关系 把手写kernel包装成opaque custom op可能帮助捕获，却也可能形成fusion边界。fullgraph通过、零重编译说明编译接入可工作，不保证比已有compile快。要先验证图是否真的走预期kernel，再比较同一shape/backend的性能。 对照与测试 检查eager与compiled输出、不同shape的fake行为、mutation后的cache内容、alias、重复调用和错误入口拒绝。项目相关接口与版本固定，直接复制到新PyTorch版本应重新做回归，不能把私有API行为当公共保证。 这是DeepOpFuzz metadata错误案例与Qwen工程接入的另一个连接点：性能优化前需要把Tensor契约描述正确。","charCount":919},{"id":"compiler-debug","title":"Compiler Debugging：从mismatch到最小证据链","section":"compiler","summary":"把backend二分、artifact检查、控制实验和去重组织成一条流程。","prereq":["triton-codegen","floating-point","custom-ops"],"sources":["compile-faq","troubleshooting","bug-pool","bug-bwd"],"tags":["minimization","debugging","differential","codegen"],"level":2,"kind":"原理与推导","checks":[{"q":"FP64不复现就能认定BF16差异正常吗？","a":"不能。dtype改变可能切换编译路径，需检查是否同一artifact及合理误差模型。"},{"q":"多个输入失败是否等于多个bug？","a":"不等于。要按root cause去重，程序数量和错误机制数量不同。"}],"lab":null,"raw":"## 发现差异后的第一步不是宣布bug\n固定输入、seed、权重、版本与编译配置。分别记录forward、grad、dtype/shape/stride、NaN/Inf位置。重复eager与compiled自身，估计非确定性。差异度量要与语义契约匹配，不能只看一个最大相对误差。\n\n## 按编译层逐步缩小\n比较eager、Dynamo的eager backend、aot_eager、Inductor。若只有Inductor失效，重点看lowering/layout/codegen，但别把这当形式证明“所有上游层都正确”。记录同一图在不同backend的元信息和执行方式。\n\n在目标版本使用适用日志，例如：\n\n```bash\nTORCH_LOGS=\"graph_breaks,recompiles,aot_graphs,output_code\" \\\nTORCH_COMPILE_DEBUG=1 python minimal_repro.py\n```\n\n日志键和内部调试API可能随版本变化；先查该版本支持项。调试环境不一定适合性能计时。\n\n## 最小化需要保留触发条件\n减少operator、维度、输入元素和上下文，但每次确认仍命中相同失败。若缩小shape导致schedule从non-persistent切到persistent，bug可能消失；这不证明原bug是假，也不代表更小图已经等价地覆盖原artifact。\n\n## 控制实验怎样支持因果定位\n改变一个变量：真实stride与错误stride、精确GeLU与tanh近似、启用/禁用特定融合、相同buffer上运行原kernel与patched kernel。控制变量越少，归因越强。\n\n升到FP64仍错是结构错误的有用信号，但不是单独的充分证明。相反，FP64不再错也可能因为走了完全不同kernel，不能立刻判定原差异正常。必须检查artifact是否保持相同。\n\n## 去重与报告\n相同operator出现十个输入失败可能是同一个root cause。Fingerprint帮助聚类，但最终需要依据失败机制、版本和修复范围分析，不应把程序数当bug数。\n\n一份好报告包括最小代码、环境、预期语义、实际现象、重复情况、编译产物和控制实验。修复后的回归需覆盖触发边界两侧。发现一次差异、归因一个机制、维护者确认、修复合并是不同证据阶段。\n","html":"\u003ch2 id=\"h01\">发现差异后的第一步不是宣布bug\u003c/h2>\n\u003cp>固定输入、seed、权重、版本与编译配置。分别记录forward、grad、dtype/shape/stride、NaN/Inf位置。重复eager与compiled自身，估计非确定性。差异度量要与语义契约匹配，不能只看一个最大相对误差。\u003c/p>\n\u003ch2 id=\"h02\">按编译层逐步缩小\u003c/h2>\n\u003cp>比较eager、Dynamo的eager backend、aot_eager、Inductor。若只有Inductor失效，重点看lowering/layout/codegen，但别把这当形式证明“所有上游层都正确”。记录同一图在不同backend的元信息和执行方式。\u003c/p>\n\u003cp>在目标版本使用适用日志，例如：\u003c/p>\n\u003cpre class=\"bash\">\u003ccode>TORCH_LOGS=&quot;graph_breaks,recompiles,aot_graphs,output_code&quot; \\\nTORCH_COMPILE_DEBUG=1 python minimal_repro.py\u003c/code>\u003c/pre>\n\u003cp>日志键和内部调试API可能随版本变化；先查该版本支持项。调试环境不一定适合性能计时。\u003c/p>\n\u003ch2 id=\"h03\">最小化需要保留触发条件\u003c/h2>\n\u003cp>减少operator、维度、输入元素和上下文，但每次确认仍命中相同失败。若缩小shape导致schedule从non-persistent切到persistent，bug可能消失；这不证明原bug是假，也不代表更小图已经等价地覆盖原artifact。\u003c/p>\n\u003ch2 id=\"h04\">控制实验怎样支持因果定位\u003c/h2>\n\u003cp>改变一个变量：真实stride与错误stride、精确GeLU与tanh近似、启用/禁用特定融合、相同buffer上运行原kernel与patched kernel。控制变量越少，归因越强。\u003c/p>\n\u003cp>升到FP64仍错是结构错误的有用信号，但不是单独的充分证明。相反，FP64不再错也可能因为走了完全不同kernel，不能立刻判定原差异正常。必须检查artifact是否保持相同。\u003c/p>\n\u003ch2 id=\"h05\">去重与报告\u003c/h2>\n\u003cp>相同operator出现十个输入失败可能是同一个root cause。Fingerprint帮助聚类，但最终需要依据失败机制、版本和修复范围分析，不应把程序数当bug数。\u003c/p>\n\u003cp>一份好报告包括最小代码、环境、预期语义、实际现象、重复情况、编译产物和控制实验。修复后的回归需覆盖触发边界两侧。发现一次差异、归因一个机制、维护者确认、修复合并是不同证据阶段。\u003c/p>\n","toc":[{"id":"h01","title":"发现差异后的第一步不是宣布bug","level":2},{"id":"h02","title":"按编译层逐步缩小","level":2},{"id":"h03","title":"最小化需要保留触发条件","level":2},{"id":"h04","title":"控制实验怎样支持因果定位","level":2},{"id":"h05","title":"去重与报告","level":2}],"plain":"发现差异后的第一步不是宣布bug 固定输入、seed、权重、版本与编译配置。分别记录forward、grad、dtype/shape/stride、NaN/Inf位置。重复eager与compiled自身，估计非确定性。差异度量要与语义契约匹配，不能只看一个最大相对误差。 按编译层逐步缩小 比较eager、Dynamo的eager backend、aot_eager、Inductor。若只有Inductor失效，重点看lowering/layout/codegen，但别把这当形式证明“所有上游层都正确”。记录同一图在不同backend的元信息和执行方式。 在目标版本使用适用日志，例如： TORCH_LOGS=\"graph_breaks,recompiles,aot_graphs,output_code\" \\ TORCH_COMPILE_DEBUG=1 python minimal_repro.py 日志键和内部调试API可能随版本变化；先查该版本支持项。调试环境不一定适合性能计时。 最小化需要保留触发条件 减少operator、维度、输入元素和上下文，但每次确认仍命中相同失败。若缩小shape导致schedule从non-persistent切到persistent，bug可能消失；这不证明原bug是假，也不代表更小图已经等价地覆盖原artifact。 控制实验怎样支持因果定位 改变一个变量：真实stride与错误stride、精确GeLU与tanh近似、启用/禁用特定融合、相同buffer上运行原kernel与patched kernel。控制变量越少，归因越强。 升到FP64仍错是结构错误的有用信号，但不是单独的充分证明。相反，FP64不再错也可能因为走了完全不同kernel，不能立刻判定原差异正常。必须检查artifact是否保持相同。 去重与报告 相同operator出现十个输入失败可能是同一个root cause。Fingerprint帮助聚类，但最终需要依据失败机制、版本和修复范围分析，不应把程序数当bug数。 一份好报告包括最小代码、环境、预期语义、实际现象、重复情况、编译产物和控制实验。修复后的回归需覆盖触发边界两侧。发现一次差异、归因一个机制、维护者确认、修复合并是不同证据阶段。","charCount":944},{"id":"oracles","title":"差分测试与Tolerance：检测异常不等于证明根因","section":"reliability","summary":"用oracle层次、数值契约、重复控制和负结果建立可靠判定。","prereq":["floating-point","compiler-debug"],"sources":["accuracy","dfuzz","deepop","qsummary"],"tags":["Oracle","Tolerance","Metamorphic","数值可靠性"],"level":1,"kind":"原理与推导","checks":[{"q":"relative L2小是否证明每个元素误差小？","a":"不证明。全局范数可能掩盖少数元素或某个参数的严重异常。"},{"q":"给输入加噪声后误差不稳定，能直接判定不是bug吗？","a":"不能。它是诊断线索，仍需考虑数值条件、实现分支和artifact变化。"}],"lab":null,"raw":"## Fuzzer负责找，Oracle负责判\nFuzzer构造程序、输入或配置；oracle检查某种预期关系是否成立。两者职责不同。若只增加测试数量却没有合适oracle，forward正常但backward错误仍会漏掉。\n\nDifferential oracle比较预期等价的实现；gradient oracle比较输入/参数梯度；crash oracle观察异常、超时或设备错误；metamorphic oracle检查某种变换前后的语义关系。没有可信reference时，关系检查很有价值，但关系本身也要成立。\n\n## rtol/atol不是通用物理常数\n常见逐元素规则为\n\n$$|y-\\hat y|\\le atol+rtol|\\hat y|.$$\n\n当参考接近0，atol很重要；当数值很大，rtol控制相对偏差。阈值受dtype、归约长度、算法、输入条件数与任务风险影响。不能规定所有FP16都1e−3、所有BF16都1e−2就结束。\n\n全局relative L2为 $\\|y-\\hat y\\|_2/(\\|\\hat y\\|_2+\\epsilon)$，可能掩盖少数局部严重错误。应同时记录max abs、异常元素、分参数误差与语义性质。\n\n## 区分三种不同正确性问题\nQwen的logits/gradient gate检查模型数值接近；DFuzz用loss trajectory最大偏差与经验阈值识别训练数值风险；DeepOpFuzz进一步复现、最小化并确认compiler failure。不能把DFuzz的0.01当作所有kernel的allclose tolerance。\n\n## 怎样处理非确定性与敏感输入\n重复每条路径自身，观察噪声；对seed、dropout、backend、精度与TF32等政策做控制。扰动输入可帮助了解敏感性，但“误差突然跃迁”不是逻辑bug的自动证明，离散分支或量化边界也会跳变。\n\n升精度、解析参考、改变布局、禁用某个优化都可以做控制，必须注意这些改动可能切换kernel。最终应把异常现象、推断根因、源码证据和正式修复状态分开记录。\n\n## 好的负结果长什么样\n候选更快但质量门槛失败，应报告为未采用；随机baseline几乎饱和而引导搜索没有优势，是方法边界；小shape比成熟库慢说明代价未被摊销。删除这些行只会让结论不可追问。\n\n训练轨迹分歧不自动等于任务质量变差，也不自动等于优化函数有实现缺陷。可靠性研究需要清楚定义“错误”在哪一个层次。\n","html":"\u003ch2 id=\"h01\">Fuzzer负责找，Oracle负责判\u003c/h2>\n\u003cp>Fuzzer构造程序、输入或配置；oracle检查某种预期关系是否成立。两者职责不同。若只增加测试数量却没有合适oracle，forward正常但backward错误仍会漏掉。\u003c/p>\n\u003cp>Differential oracle比较预期等价的实现；gradient oracle比较输入/参数梯度；crash oracle观察异常、超时或设备错误；metamorphic oracle检查某种变换前后的语义关系。没有可信reference时，关系检查很有价值，但关系本身也要成立。\u003c/p>\n\u003ch2 id=\"h02\">rtol/atol不是通用物理常数\u003c/h2>\n\u003cp>常见逐元素规则为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">|\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>−\u003c/mo>\u003cmover>\u003cmi>y\u003c/mi>\u003cmo accent=\"true\">̂\u003c/mo>\u003c/mover>\u003cmo stretchy=\"true\" form=\"postfix\">|\u003c/mo>\u003c/mrow>\u003cmo>≤\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>l\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>l\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">|\u003c/mo>\u003cmover>\u003cmi>y\u003c/mi>\u003cmo accent=\"true\">̂\u003c/mo>\u003c/mover>\u003cmo stretchy=\"true\" form=\"postfix\">|\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">|y-\\hat y|\\le atol+rtol|\\hat y|.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>当参考接近0，atol很重要；当数值很大，rtol控制相对偏差。阈值受dtype、归约长度、算法、输入条件数与任务风险影响。不能规定所有FP16都1e−3、所有BF16都1e−2就结束。\u003c/p>\n\u003cp>全局relative L2为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmo stretchy=\"false\" form=\"postfix\">∥\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>−\u003c/mo>\u003cmover>\u003cmi>y\u003c/mi>\u003cmo accent=\"true\">̂\u003c/mo>\u003c/mover>\u003cmsub>\u003cmo stretchy=\"false\" form=\"postfix\">∥\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi>/\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmo stretchy=\"false\" form=\"postfix\">∥\u003c/mo>\u003cmover>\u003cmi>y\u003c/mi>\u003cmo accent=\"true\">̂\u003c/mo>\u003c/mover>\u003cmsub>\u003cmo stretchy=\"false\" form=\"postfix\">∥\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>ϵ\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\|y-\\hat y\\|_2/(\\|\\hat y\\|_2+\\epsilon)\u003c/annotation>\u003c/semantics>\u003c/math>，可能掩盖少数局部严重错误。应同时记录max abs、异常元素、分参数误差与语义性质。\u003c/p>\n\u003ch2 id=\"h03\">区分三种不同正确性问题\u003c/h2>\n\u003cp>Qwen的logits/gradient gate检查模型数值接近；DFuzz用loss trajectory最大偏差与经验阈值识别训练数值风险；DeepOpFuzz进一步复现、最小化并确认compiler failure。不能把DFuzz的0.01当作所有kernel的allclose tolerance。\u003c/p>\n\u003ch2 id=\"h04\">怎样处理非确定性与敏感输入\u003c/h2>\n\u003cp>重复每条路径自身，观察噪声；对seed、dropout、backend、精度与TF32等政策做控制。扰动输入可帮助了解敏感性，但“误差突然跃迁”不是逻辑bug的自动证明，离散分支或量化边界也会跳变。\u003c/p>\n\u003cp>升精度、解析参考、改变布局、禁用某个优化都可以做控制，必须注意这些改动可能切换kernel。最终应把异常现象、推断根因、源码证据和正式修复状态分开记录。\u003c/p>\n\u003ch2 id=\"h05\">好的负结果长什么样\u003c/h2>\n\u003cp>候选更快但质量门槛失败，应报告为未采用；随机baseline几乎饱和而引导搜索没有优势，是方法边界；小shape比成熟库慢说明代价未被摊销。删除这些行只会让结论不可追问。\u003c/p>\n\u003cp>训练轨迹分歧不自动等于任务质量变差，也不自动等于优化函数有实现缺陷。可靠性研究需要清楚定义“错误”在哪一个层次。\u003c/p>\n","toc":[{"id":"h01","title":"Fuzzer负责找，Oracle负责判","level":2},{"id":"h02","title":"rtol/atol不是通用物理常数","level":2},{"id":"h03","title":"区分三种不同正确性问题","level":2},{"id":"h04","title":"怎样处理非确定性与敏感输入","level":2},{"id":"h05","title":"好的负结果长什么样","level":2}],"plain":"Fuzzer负责找，Oracle负责判 Fuzzer构造程序、输入或配置；oracle检查某种预期关系是否成立。两者职责不同。若只增加测试数量却没有合适oracle，forward正常但backward错误仍会漏掉。 Differential oracle比较预期等价的实现；gradient oracle比较输入/参数梯度；crash oracle观察异常、超时或设备错误；metamorphic oracle检查某种变换前后的语义关系。没有可信reference时，关系检查很有价值，但关系本身也要成立。 rtol/atol不是通用物理常数 常见逐元素规则为 | y − y ̂ | ≤ a t o l + r t o l | y ̂ | . 当参考接近0，atol很重要；当数值很大，rtol控制相对偏差。阈值受dtype、归约长度、算法、输入条件数与任务风险影响。不能规定所有FP16都1e−3、所有BF16都1e−2就结束。 全局relative L2为 ∥ y − y ̂ ∥ 2 / ( ∥ y ̂ ∥ 2 + ϵ ) ，可能掩盖少数局部严重错误。应同时记录max abs、异常元素、分参数误差与语义性质。 区分三种不同正确性问题 Qwen的logits/gradient gate检查模型数值接近；DFuzz用loss trajectory最大偏差与经验阈值识别训练数值风险；DeepOpFuzz进一步复现、最小化并确认compiler failure。不能把DFuzz的0.01当作所有kernel的allclose tolerance。 怎样处理非确定性与敏感输入 重复每条路径自身，观察噪声；对seed、dropout、backend、精度与TF32等政策做控制。扰动输入可帮助了解敏感性，但“误差突然跃迁”不是逻辑bug的自动证明，离散分支或量化边界也会跳变。 升精度、解析参考、改变布局、禁用某个优化都可以做控制，必须注意这些改动可能切换kernel。最终应把异常现象、推断根因、源码证据和正式修复状态分开记录。 好的负结果长什么样 候选更快但质量门槛失败，应报告为未采用；随机baseline几乎饱和而引导搜索没有优势，是方法边界；小shape比成熟库慢说明代价未被摊销。删除这些行只会让结论不可追问。 训练轨迹分歧不自动等于任务质量变差，也不自动等于优化函数有实现缺陷。可靠性研究需要清楚定义“错误”在哪一个层次。","charCount":959},{"id":"dfuzz-config","title":"DFuzz第一阶段：为什么搜索训练配置，而不是只测算子","section":"reliability","summary":"把训练轨迹、fitness、kernel dispatch与遗传算法连接起来。","prereq":["adamw","oracles","profiling"],"sources":["dfuzz"],"tags":["DFuzz","Genetic Algorithm","Configuration Fuzzing","Megatron"],"level":3,"kind":"论文解读","checks":[{"q":"DFuzz的fitness只看算子单次输出差吗？","a":"不是。主要项是多步训练loss轨迹最大差；Megatron还可有kernel dispatch辅助项。"},{"q":"GA没找到超阈值能否证明优化安全？","a":"不能。启发式搜索不完备，仅说明给定预算和输入域中未发现。"}],"lab":null,"raw":"## 从论文真正的观察开始\n上传DFuzz稿件以Liger RMSNorm为动机：8层、hidden512、BF16的LLaMA训练500步，loss差由4.2×10⁻⁵到1.8×10⁻²，gradient L2差由7.7×10⁻³到8.2×10⁻¹。换20组训练配置，最终偏差跨近8个数量级。\n\n这些是稿件报告的特定实验，不证明所有舍入误差必然累积，也不证明任意轨迹差异都会损害最终质量。它们说明单步固定配置测试不足以刻画风险。\n\n## 为什么训练动态会放大差异\nSGD中 $\\theta_{t+1}=\\theta_t-\\eta g(\\theta_t)$。两条路径出现小误差后，下一步梯度已经在不同参数点计算。设参数差e，局部线性化可近似理解为\n\n$$e_{t+1}\\approx(I-\\eta H_t)e_t-\\eta\\delta_t.$$\n\nH是局部loss Hessian，delta是该步实现引入的梯度偏差。此式是教学分析，不是论文已证明的稳定性定理。不同曲率和learning rate可放大或收缩误差；Adam还增加moment状态。\n\n## 实际搜索目标是什么\n配置c包含架构、batch、学习率与精度等。对每个配置运行同seed、同数据条件下的ON/OFF训练轨迹，评价\n\n$$\\Delta(c,x)=\\max_{1\\le t\\le N}|L_{on}^{(t)}-L_{off}^{(t)}|.$$\n\n选择max而非只看最后一步，是因为偏差不必单调。论文的fitness在参考off训练有界时取 $\\phi_d(c)+\\lambda\\phi_k(c)$，否则置为负无穷；phi_d是轨迹偏差，phi_k是kernel执行差异信号。\n\n## 为什么用遗传算法\n配置混合离散与连续变量，改变架构还会改变图与kernel，每次训练评价昂贵。GA以种群、选择、交叉、变异在合法空间中复用较好候选。它是启发式优化，不证明全局最优。\n\nMegatron实验N=200步、P=20、5代，约100次配置评价/优化；配置的ON/OFF都需执行。论文实验设置写roulette-wheel selection、uniform crossover概率0.6、mutation0.20、top25% elitism；方法概述另用“top-ranked parents”概括。网站保留这一表述差异，不假装已审计DFuzz完整源码来统一二者。\n\n## Kernel discrepancy有什么用\nMegatron通过Nsys观察dispatch差异，引导候选真正改变优化执行路径；Liger/Unsloth设置lambda=0，不做这项profiling辅助。它是搜索信号，不是正确性oracle，更不是代码覆盖率。\n\n最终保存最佳配置及偏差峰值时刻t*的两侧model states，交给输入搜索阶段。给定有限预算找到的最大值是已观察风险，不是对所有配置的上界。\n","html":"\u003ch2 id=\"h01\">从论文真正的观察开始\u003c/h2>\n\u003cp>上传DFuzz稿件以Liger RMSNorm为动机：8层、hidden512、BF16的LLaMA训练500步，loss差由4.2×10⁻⁵到1.8×10⁻²，gradient L2差由7.7×10⁻³到8.2×10⁻¹。换20组训练配置，最终偏差跨近8个数量级。\u003c/p>\n\u003cp>这些是稿件报告的特定实验，不证明所有舍入误差必然累积，也不证明任意轨迹差异都会损害最终质量。它们说明单步固定配置测试不足以刻画风险。\u003c/p>\n\u003ch2 id=\"h02\">为什么训练动态会放大差异\u003c/h2>\n\u003cp>SGD中 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>η\u003c/mi>\u003cmi>g\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\theta_{t+1}=\\theta_t-\\eta g(\\theta_t)\u003c/annotation>\u003c/semantics>\u003c/math>。两条路径出现小误差后，下一步梯度已经在不同参数点计算。设参数差e，局部线性化可近似理解为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>η\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>η\u003c/mi>\u003cmsub>\u003cmi>δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">e_{t+1}\\approx(I-\\eta H_t)e_t-\\eta\\delta_t.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>H是局部loss Hessian，delta是该步实现引入的梯度偏差。此式是教学分析，不是论文已证明的稳定性定理。不同曲率和learning rate可放大或收缩误差；Adam还增加moment状态。\u003c/p>\n\u003ch2 id=\"h03\">实际搜索目标是什么\u003c/h2>\n\u003cp>配置c包含架构、batch、学习率与精度等。对每个配置运行同seed、同数据条件下的ON/OFF训练轨迹，评价\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Δ\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">|\u003c/mo>\u003cmsubsup>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmi>o\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmi>o\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmo stretchy=\"true\" form=\"postfix\">|\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\Delta(c,x)=\\max_{1\\le t\\le N}|L_{on}^{(t)}-L_{off}^{(t)}|.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>选择max而非只看最后一步，是因为偏差不必单调。论文的fitness在参考off训练有界时取 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>ϕ\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmsub>\u003cmi>ϕ\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\phi_d(c)+\\lambda\\phi_k(c)\u003c/annotation>\u003c/semantics>\u003c/math>，否则置为负无穷；phi_d是轨迹偏差，phi_k是kernel执行差异信号。\u003c/p>\n\u003ch2 id=\"h04\">为什么用遗传算法\u003c/h2>\n\u003cp>配置混合离散与连续变量，改变架构还会改变图与kernel，每次训练评价昂贵。GA以种群、选择、交叉、变异在合法空间中复用较好候选。它是启发式优化，不证明全局最优。\u003c/p>\n\u003cp>Megatron实验N=200步、P=20、5代，约100次配置评价/优化；配置的ON/OFF都需执行。论文实验设置写roulette-wheel selection、uniform crossover概率0.6、mutation0.20、top25% elitism；方法概述另用“top-ranked parents”概括。网站保留这一表述差异，不假装已审计DFuzz完整源码来统一二者。\u003c/p>\n\u003ch2 id=\"h05\">Kernel discrepancy有什么用\u003c/h2>\n\u003cp>Megatron通过Nsys观察dispatch差异，引导候选真正改变优化执行路径；Liger/Unsloth设置lambda=0，不做这项profiling辅助。它是搜索信号，不是正确性oracle，更不是代码覆盖率。\u003c/p>\n\u003cp>最终保存最佳配置及偏差峰值时刻t*的两侧model states，交给输入搜索阶段。给定有限预算找到的最大值是已观察风险，不是对所有配置的上界。\u003c/p>\n","toc":[{"id":"h01","title":"从论文真正的观察开始","level":2},{"id":"h02","title":"为什么训练动态会放大差异","level":2},{"id":"h03","title":"实际搜索目标是什么","level":2},{"id":"h04","title":"为什么用遗传算法","level":2},{"id":"h05","title":"Kernel discrepancy有什么用","level":2}],"plain":"从论文真正的观察开始 上传DFuzz稿件以Liger RMSNorm为动机：8层、hidden512、BF16的LLaMA训练500步，loss差由4.2×10⁻⁵到1.8×10⁻²，gradient L2差由7.7×10⁻³到8.2×10⁻¹。换20组训练配置，最终偏差跨近8个数量级。 这些是稿件报告的特定实验，不证明所有舍入误差必然累积，也不证明任意轨迹差异都会损害最终质量。它们说明单步固定配置测试不足以刻画风险。 为什么训练动态会放大差异 SGD中 θ t + 1 = θ t − η g ( θ t ) 。两条路径出现小误差后，下一步梯度已经在不同参数点计算。设参数差e，局部线性化可近似理解为 e t + 1 ≈ ( I − η H t ) e t − η δ t . H是局部loss Hessian，delta是该步实现引入的梯度偏差。此式是教学分析，不是论文已证明的稳定性定理。不同曲率和learning rate可放大或收缩误差；Adam还增加moment状态。 实际搜索目标是什么 配置c包含架构、batch、学习率与精度等。对每个配置运行同seed、同数据条件下的ON/OFF训练轨迹，评价 Δ ( c , x ) = max 1 ≤ t ≤ N | L o n ( t ) − L o f f ( t ) | . 选择max而非只看最后一步，是因为偏差不必单调。论文的fitness在参考off训练有界时取 ϕ d ( c ) + λ ϕ k ( c ) ，否则置为负无穷；phi_d是轨迹偏差，phi_k是kernel执行差异信号。 为什么用遗传算法 配置混合离散与连续变量，改变架构还会改变图与kernel，每次训练评价昂贵。GA以种群、选择、交叉、变异在合法空间中复用较好候选。它是启发式优化，不证明全局最优。 Megatron实验N=200步、P=20、5代，约100次配置评价/优化；配置的ON/OFF都需执行。论文实验设置写roulette-wheel selection、uniform crossover概率0.6、mutation0.20、top25% elitism；方法概述另用“top-ranked parents”概括。网站保留这一表述差异，不假装已审计DFuzz完整源码来统一二者。 Kernel discrepancy有什么用 Megatron通过Nsys观察dispatch差异，引导候选真正改变优化执行路径；Liger/Unsloth设置lambda=0，不做这项profiling辅助。它是搜索信号，不是正确性oracle，更不是代码覆盖率。 最终保存最佳配置及偏差峰值时刻t*的两侧model states，交给输入搜索阶段。给定有限预算找到的最大值是已观察风险，不是对所有配置的上界。","charCount":1075},{"id":"dfuzz-input","title":"DFuzz第二阶段：在Embedding空间搜索，再投影回Token","section":"reliability","summary":"解释为什么不能对整数token直接求导，以及两侧checkpoint的含义。","prereq":["dfuzz-config","tokens-loss","autograd"],"sources":["dfuzz"],"tags":["Projected Gradient Ascent","Embedding","Input Fuzzing"],"level":3,"kind":"论文解读","checks":[{"q":"projection具体投影到哪里？","a":"投影回词表中合法token对应的embedding，论文使用最近邻查找。"},{"q":"8.79倍是与Stage1相比吗？","a":"不是。它是Liger RMSNorm的Stage2投影梯度搜索与Stage2随机token mutation比较。"}],"lab":null,"raw":"## 第一阶段之后还缺什么\n配置已固定，但输入仍影响激活分布和误差传播。同一学习率、dtype、结构下，不同token组合可能使某些算子落入更敏感的数值区域。词表V、序列长S产生V^S种输入，穷举不可行。\n\n## 连续表示如何帮助离散搜索\ntoken ID本身是整数索引，对ID做普通梯度没有意义；Embedding向量是连续的。Stage 2用当前输入的embedding计算偏差梯度，执行Adam形式的上升更新，再把更新后的向量映射到embedding table中最近的合法token，重新取得对应embedding评价。\n\n概念上：\n\n$$\\tilde x_{r+1}=Update(x_r,+\\nabla_x\\Delta),\\quad x_{r+1}=Project(\\tilde x_{r+1}).$$\n\n这里Project是最近邻token映射，不是简单把数值裁剪到[-1,1]。常规Adam优化器默认下降，若代码直接把Delta作为loss，还要正确处理上升方向；论文写法描述的是maximize。\n\n## 投影为什么要每轮做\n连续向量不一定对应任何真实token。若只报告连续对抗embedding的误差，测试对象已经不是合法token输入。交替连续更新与离散投影，是为了利用局部梯度同时保持实际可执行输入。\n\n论文对最近邻搜索的具体索引实现、两侧不同embedding表如何共享搜索表示等细节没有在当前稿件中完全展开，本站不编造。它说明Stage 2固定配置并加载Stage 1峰值时刻的两侧checkpoint。\n\n## 一个重要归因边界\n两侧checkpoint来自已经分歧的训练轨迹，并非保证参数完全相同。因此Stage 2的偏差包含既有状态差异与新输入的共同作用，不等同于“同权重、单算子local error最大化”。面试时应按论文定义表述，不把更强结论加进去。\n\n## 实验怎样证明作用\n100轮、步长0.01，对照同checkpoint、同初始输入下100轮随机token mutation。Liger RMSNorm由Stage1的0.00277到Stage2的0.0262，越过tau=0.01。相对Stage1增加约846%；相对随机mutation的0.00298是8.79倍。这两个百分比/倍率的分母不同。\n\nMegatron bias_gelu最终0.979，相对Stage2随机0.301约3.25倍；不是算子运行快3.25倍。某些算子几乎无改进，论文解释其差异梯度很小，这是搜索的局限而不是需要删除的行。\n\n## 如何读结论\n输出是预算内观测到的最大偏差。它支持“输入选择影响数值风险”和“两阶段互补”，不支持“证明全局最坏值”或“优化实现必然训练失败”。\n","html":"\u003ch2 id=\"h01\">第一阶段之后还缺什么\u003c/h2>\n\u003cp>配置已固定，但输入仍影响激活分布和误差传播。同一学习率、dtype、结构下，不同token组合可能使某些算子落入更敏感的数值区域。词表V、序列长S产生V^S种输入，穷举不可行。\u003c/p>\n\u003ch2 id=\"h02\">连续表示如何帮助离散搜索\u003c/h2>\n\u003cp>token ID本身是整数索引，对ID做普通梯度没有意义；Embedding向量是连续的。Stage 2用当前输入的embedding计算偏差梯度，执行Adam形式的上升更新，再把更新后的向量映射到embedding table中最近的合法token，重新取得对应embedding评价。\u003c/p>\n\u003cp>概念上：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmover>\u003cmi>x\u003c/mi>\u003cmo accent=\"true\">̃\u003c/mo>\u003c/mover>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>p\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>,\u003c/mo>\u003cmi>+\u003c/mi>\u003cmsub>\u003cmi>∇\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmi>Δ\u003c/mi>\u003cmo stretchy=\"true\" form
