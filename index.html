<script id="atlas-data" type="application/json">{"articles":[{"id":"orientation","title":"从三个项目开始，建立学习地图","section":"start","summary":"把性能、数值可靠性和编译正确性放回同一条模型执行链。","prereq":[],"sources":["guide","qreadme","dfuzz","deepop"],"tags":["学习路线","证据","项目"],"level":1,"kind":"原理与推导","checks":[{"q":"为什么三类项目不能用同一个“加速比”评价？","a":"Qwen 性能实验比较时间、显存等；DFuzz 比较数值偏差和搜索命中率；DeepOpFuzz 比较已验证 bug 与固定预算下触达情况。它们的分子、分母和实验目标都不同。"}],"lab":null,"raw":"## 这不是一份名词清单\n语言模型的每个 token 都要经过张量计算。框架把计算交给编译器、GPU 和运行时；训练又引入反向传播、优化器和多卡通信。AI Infra 关心这条链能否**跑得动、跑得快、算得对**。三个目标有关联，却需要不同证据。\n\n本教程借鉴 AIInfraGuide 的分层学习形式，正文与例子按你的三个项目重新组织，不转载其文章。每篇先说明问题的来源，再推导数学与数据流，最后连接源码、实验和边界。\n\n\u003cdiv class=\"flow\">\u003cspan>模型数学\u003c/span>\u003cspan>Tensor / Autograd\u003c/span>\u003cspan>Compiler / Kernel\u003c/span>\u003cspan>GPU / Runtime\u003c/span>\u003cspan>数值与性能验证\u003c/span>\u003c/div>\n\n## 三个项目分别回答什么\n**Qwen3-Triton** 研究执行效率：相同模型计算如何减少布局复制、启动开销和训练状态驻留。其单卡推理、单卡训练、多卡分片是不同实验分支，不应编造成未经记录的线性研发历史。\n\n**DFuzz** 研究训练轨迹的数值偏差：同一优化开关的 ON/OFF 执行，在哪些配置与输入下产生显著不同的 loss 轨迹。Megatron-LM 是实际测试框架之一，不是仅供背景介绍的分布式知识。\n\n**DeepOpFuzz** 研究编译正确性：怎样构造条件，让编译器选择特定 operation 并观察生成产物，进一步检测输出、梯度或执行语义错误。\n\n## 怎样阅读\n零基础路线先读 [Tensor 与 stride](#article/tensor-layout)、[矩阵计算量](#article/gemm-flops) 和 [token 到 loss](#article/tokens-loss)，再进入 Transformer。Kernel 路线从模型算子走到 Triton 和 QK Fusion。训练路线从梯度、AdamW 的状态走到 collective 与 FSDP。Compiler 路线从 graph capture 走到 artifact 与两个真实 bug。\n\n不要跳过前置章节。一个词第一次出现时可能有一句定义，完整解释会在对应链接中展开。例如 GQA 不是“一个更快的 attention 函数”，而是 head 共享设计；CUDA Graph 不是让所有算子变成一个 kernel。\n\n## 网站怎样表达证据\n标为**原理与推导**的段落是教学解释，算式中的例子不等于项目实测。标为**源码与实验**的章节来自固定仓库版本或上传论文。标为**扩展知识**的部分不构成你的项目贡献。\n\nQwen 源码固定在 `10be3d87`；DeepOpFuzz 仓库固定在 `c69ead1b`。历史报告里的 2.5.1 推理环境、2.10 训练环境与 compiler 测试环境不同。本站没有在 GPU 上重新执行这些项目实验，性能数字按报告口径呈现。\n\n## 什么算真正掌握\n读完定义只是第一步。合格的理解是：给定一个具体 shape，能写出地址或计算量；给定一个优化，能说明它省了什么、增加了什么；给定一组数据，能判断是否足以支持结论。每篇末尾的折叠题和实践任务就是为此设计。\n\n网站不打包你的论文 PDF、简历、私有日志或模型权重。公开部署前仍应确认论文与研究结果可对外展示。\n","html":"\u003ch2 id=\"h01\">这不是一份名词清单\u003c/h2>\n\u003cp>语 数据本来就完全相同。"}],"lab":"labs/01_layout.py","raw":"## 为什么先学地址，而不是先写 kernel\nQwen 的布局优化和 DeepOpFuzz 的索引 bug，都依赖同一个事实：**shape 不是物理地址**。Tensor 通常由 storage、storage offset、shape、stride 和 dtype 共同描述。stride 的单位是元素，不是字节。\n\n若张量元素坐标为 $(i_0,\\ldots,i_{n-1})$，其元素偏移为\n\n$$o=o_0+\\sum_{k=0}^{n-1} i_k s_k.$$\n\n字节地址还要乘以元素大小。对连续 $2\\times3$ 的 FP32 矩阵，stride 是 $(3,1)$。元素 $(1,2)$ 的偏移是 $1\\cdot3+2=5$，距首元素 20 bytes。\n\n## transpose 为什么有时不搬数据\n原矩阵在内存中是 `[0,1,2,3,4,5]`。转置后 shape 变为 $(3,2)$，stride 变为 $(1,3)$。逻辑上的 $(2,1)$ 仍读 offset 5，没有必要生成新 storage。\n\n```python\nimport torch\nx = torch.arange(6).reshape(2, 3)\ny = x.t()\nprint(x.shape, x.stride())  # (2,3), (3,1)\nprint(y.shape, y.stride())  # (3,2), (1,3)\nprint(x.untyped_storage().data_ptr() == y.untyped_storage().data_ptr())\nz = y.contiguous()\nprint(z.stride())           # (2,1)，需要时物理复制\n```\n\n`contiguous()` 对已经连续的输入可能直接返回原张量，并不保证一定复制。`reshape` 在可行时产生 view，否则可能复制；不能无条件把它当免费操作。原地修改 view 可能影响 base，这就是 alias 关系的重要性。\n\n## stride-0 为什么合法，又为什么危险\n`u.shape=[B,1,H]` 扩展到 `[B,S,H]` 时，可以设置中间维 stride 为 0。于是所有序列位置读同一个物理向量。作为只读 broadcast view，这很节省内存；作为需要每个位置不同写入结果的输出，就可能无法表达语义。\n\nDeepOpFuzz 的 `slice_scatter` 案例正是相关输出 metadata 与实际需求不一致。不能由“functional op 返回新张量”进一步断言其输出一定 contiguous；关键是输出 layout 必须容纳正确的逐元素结果，而不是强制某一种连续顺序。\n\n## Qwen 的 BSHD 与 BHSD\n设 token 数为 $T$、head 数为 $h$、head dimension 为 $D$。连续 BSHD 的偏移是\n\n$$((bT+t)h+j)D+d.$$\n\n连续 BHSD 的偏移是\n\n$$((bh+j)T+t)D+d.$$\n\n两者改变的是谁在物理上相邻。一个 stride-aware kernel 可以按输入实际 stride 读，直接按目标布局写，避免先调用 transpose-copy。这需要明确支持哪些 stride，不能由一个实例推广到任意非连续张量。\n\n## 实践\n运行 `labs/01_layout.py`，观察 NumPy view 与复制的差异。然后对手里的 PyTorch Tensor 同时打印 shape、stride、storage_offset、data_ptr。不要只打印 `is_contiguous()`，因为它不足以描述所有地址关系。\n","html":"\u003ch2 id=\"h01\">为什么先学地址，而不是先写 kernel\u003c/h2>\n\u003cp>Qwen 的布局优化和 DeepOpFuzz 的索引 bug，都依赖同一个事实：\u003cstrong>shape 不是物理地址\u003c/strong>。Tensor 通常由 storage、storage offset、shape、stride 和 dtype 共同描述。stride 的单位是元素，不是字节。\u003c/p>\n\u003cp>若张量元素坐标为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.o  form=\"prefix\">(\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>T\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>h\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>D\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">((bT+t)h+j)D+d.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>连续 BHSD 的偏移是\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>h\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>T\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>D\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">((bh+j)T+t)D+d.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>两者改变的是谁在物理上相邻。一个 stride-aware kernel 可以按输入实际 stride 读，直接按目标布局写，避免先调用 transpose-copy。这需要明确支持哪些 stride，不能由一个实例推广到任意非连续张量。\u003c/p>\n\u003ch2 id=\"h05\">实践\u003c/h2>\n\u003cp>运行 \u003ccode>labs/01_layout.py\u003c/code>，观察 NumPy view 与复制的差异。然后对手里的 PyTorch Tensor 同时打印 shape、stride、storage_offset、data_ptr。不要只打印 \u003ccode>is_contiguous()\u003c/code>，因为它不足以描述所有地址关系。\u003c/p>\n","toc":[{"id":"h01","title":"为什么先学地址，而不是先写 kernel","level":2},{"id":"h02","title":"transpose 为什么有时不搬数据","level":2},{"id":"h03","title":"stride-0 为什么合法，又为什么危险","level":2},{"id":"h04","title":"Qwen 的 BSHD 与 BHSD","level":2},{"id":"h05","title":"实践","level":2}],"plain":"为什么先学地址，而不是先写 kernel Qwen 的布局优化和 DeepOpFuzz 的索引 bug，都依赖同一个事实： shape 不是物理地址 。Tensor 通常由 storage、storage offset、shape、stride 和 dtype 共同描述。stride 的单位是元素，不是字节。 若张量元素坐标为 ( i 0 , … , i n − 1 ) ，其元素偏移为 o = o 0 + ∑ k = 0 n − 1 i k s k . 字节地址还要乘以元素大小。对连续 2 × 3 的 FP32 矩阵，stride 是 ( 3 , 1 ) 。元素 ( 1 , 2 ) 的偏移是 1 ⋅ 3 + 2 = 5 ，距首元素 20 bytes。 transpose 为什么有时不搬数据 原矩阵在内存中是 [0,1,2,3,4,5] 。转置后 shape 变为 ( 3 , 2 ) ，stride 变为 ( 1 , 3 ) 。逻辑上的 ( 2 , 1 ) 仍读 offset 5，没有必要生成新 storage。 import torch x = torch.arange(6).reshape(2, 3) y = x.t() print(x.shape, x.stride()) # (2,3), (3,1) print(y.shape, y.stride()) # (3,2), (1,3) print(x.untyped_storage().data_ptr() == y.untyped_storage().data_ptr()) z = y.contiguous() print(z.stride()) # (2,1)，需要时物理复制 contiguous() 对已经连续的输入可能直接返回原张量，并不保证一定复制。 reshape 在可行时产生 view，否则可能复制；不能无条件把它当免费操作。原地修改 view 可能影响 base，这就是 alias 关系的重要性。 stride-0 为什么合法，又为什么危险 u.shape=[B,1,H] 扩展到 [B,S,H] 时，可以设置中间维 stride 为 0。于是所有序列位置读同一个物理向量。作为只读 broadcast view，这很节省内存；作为需要每个位置不同写入结果的输出，就可能无法表达语义。 DeepOpFuzz 的 slice_scatter 案例正是相关输出 metadata 与实际需求不一致。不能由“functional op 返回新张量”进一步断言其输出一定 contiguous；关键是输出 layout 必须容纳正确的逐元素结果，而不是强制某一种连续顺序。 Qwen 的 BSHD 与 BHSD 设 token 数为 T 、head 数为 h 、head dimension 为 D 。连续 BSHD 的偏移是 ( ( b T + t ) h + j ) D + d . 连续 BHSD 的偏移是 ( ( b h + j ) T + t ) D + d . 两者改变的是谁在物理上相邻。一个 stride-aware kernel 可以按输入实际 stride 读，直接按目标布局写，避免先调用 transpose-copy。这需要明确支持哪些 stride，不能由一个实例推广到任意非连续张量。 实践 运行 labs/01_layout.py ，观察 NumPy view 与复制的差异。然后对手里的 PyTorch Tensor 同时打印 shape、stride、storage_offset、data_ptr。不要只打印 is_contiguous() ，因为它不足以描述所有地址关系。","charCount":1312},{"id":"gemm-flops","title":"从一个点积推导 2MNK 与训练 6P","section":"foundations","summary":"不背计算量公式：逐个数乘法和加法，再推导反向传播。","prereq":["tensor-layout"],"sources":["nvidia-matmul","qconfig"],"tags":["FLOPs","GEMM","2MNK","6P"],"level":1,"kind":"原理与推导","checks":[{"q":"M=1,K=N=2048 的近似 FLOPs 是多少？","a":"2×1×2048²=8,388,608，约8.39 MFLOPs。"},{"q":"训练为什么不总是恰好 forward 的3倍？","a":"需要哪些梯度、attention成本、优化器、重算、稀疏路由与kernel实现都会改变实际工作量和时间。3倍只是典型Linear的矩阵乘法计数。"}],"lab":null,"raw":"## Linear 为什么是矩阵乘法\n设 $X\\in\\mathbb R^{M\\times K}$、$W\\in\\mathbb R^{K\\times N}$，输出 $Y=XW$。M 是输入行数；LLM 中常把 batch 和 token 两维展开为 M。K 是输入特征数，N 是输出特征数。数学右乘记法下 W 为 K×N；`nn.Linear` 存储的是 N×K。\n\n一个输出元素为\n\n$$Y_{ij}=\\sum_{k=1}^{K}X_{ik}W_{kj}.$$\n\n它包含 K 次乘法、K−1 次加法，精确的标量工作计数为 $MN(2K-1)$。工程中常将 multiply-accumulate 计为两个 FLOPs，于是使用\n\n$$F\\approx2MNK.$$\n\nFMA 可以是一条硬件指令，但仍按一次乘法加一次加法记为 2 FLOPs。**指令数不等于 FLOPs**。计数惯例不同必须注明。\n\n## 小例子与实际形状\n2×3 乘 3×2 产生 4 个输出，各用 3 乘 2 加，精确为20次；近似式给24。大型矩阵中少掉的 MN 次加法相对于 2MNK 很小。\n\nQwen 的示例 projection 若输入为 `[1,128,2048]`，展开后 M=128。若输出宽度为2048，则\n\n$$F\\approx2\\cdot128\\cdot2048^2=1{,}073{,}741{,}824.$$\n\n这约为1.074 GFLOPs，不能写成1.074 GFLOP/s。前者是工作量，后者需要再除以秒数。\n\n## backward 的两次矩阵乘法从哪里来\n令上游梯度 $G=\\partial L/\\partial Y$，形状为 M×N。微分满足 $dY=dXW+XdW$。将其代入标量损失的微分，可得\n\n$$\\frac{\\partial L}{\\partial X}=GW^T,\\qquad \\frac{\\partial L}{\\partial W}=X^TG.$$\n\n两个乘法都约为2MNK。因此一个需要输入与权重梯度的 Linear，forward+backward 约为6MNK。冻结权重、某些梯度不需要计算、重算等情况会改变成本。\n\n## 2P / 6P 何时能用\n对主要由 dense Linear 构成的模型，若一个 token 经过大部分矩阵权重，每个参数约参与一次乘加，则 forward/token 粗估为2P，训练约6P。这里不是从参数总数自动推导的定律：embedding lookup 不执行完整矩阵乘法，长序列 attention 的 score/PV 计算也不能忽略；MoE 应区分总参数和活跃参数；activation checkpointing 还增加重算。\n\n## 与项目怎么连接\nQK Fusion 主要减少 launch 和中间张量，并不显著降低 QKV Linear 的2MNK。FSDP 主要降低持久状态复制，也不会把同一训练样本所需的数学运算自动除以卡数。看见 latency 下降，应先问哪个成本变化，而不是直接说 FLOPs 降低。\n\n使用计算实验室改变 M，观察工作量与理想数据量；这是理论估算，不是GPU实测。\n","html":"\u003ch2 id=\"h01\">Linear 为什么是矩阵乘法\u003c/h2>\n\u003cp>设 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>X\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmsup>\u003cmi>ℝ\u003c/mi>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">X\\in\\mathbb R^{M\\times K}\u003c/annotation>\u003c/semantics>\u003c/math>、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>W\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmsup>\u003cmi>ℝ\u003c/mi>\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">W\\in\\mathbb R^{K\\times N}\u003c/annotation>\u003c/semantics>\u003c/math>，输出 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Y=XW\u003c/annotation>\u003c/semantics>\u003c/math>。M 是输入行数；LLM 中常把 batch 和 token 两维展开为 M。K 是输入特征数，N 是输出特征数。数学右乘记法下 W 为 K×N；\u003ccode>nn.Linear\u003c/code> 存储的是 N×K。\u003c/p>\n\u003cp>一个输出元素为\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>Y\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>K\u003c/mi>\u003c/munderover>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Y_{ij}=\\sum_{k=1}^{K}X_{ik}W_{kj}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>它包含 K 次乘法、K−1 次加法，精确的标量工作计数为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>K\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">MN(2K-1)\u003c/annotation>\u003c/semantics>\u003c/math>。工程中常将 multiply-accumulate 计为两个 FLOPs，于是使用\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>M\u003c/mi>\u003cmi>N\u003c/mi>\u003cmi>K\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">F\\approx2MNK.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>FMA 可以是一条硬件指令，但仍按一次乘法加一次加法记为 2 FLOPs。\u003cstrong>指令数不等于 FLOPs\u003c/strong>。计数惯例不同必须注明。\u003c/p>\n\u003ch2 id=\"h02\">小例子与实际形状\u003c/h2>\n\u003cp>2×3 乘 3×2 产生 4 个输出，各用 3 乘 2 加，精确为20次；近似式给24。大型矩阵中少掉的 MN 次加法相对于 2MNK 很小。\u003c/p>\n\u003cp>Qwen 的示例 projection 若输入为 \u003ccode>[1,128,2048]\u003c/code>，展开后 M=128。若输出宽度为2048，则\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>⋅\u003c/mo>\u003cmn>128\u003c/mn>\u003cmo>⋅\u003c/mo>\u003cmsup>\u003cmn>2048\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>073\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>741\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>824\u003c/mn>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">F\\approx2\\cdot128\\cdot2048^2=1{,}073{,}741{,}824.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>这约为1.074 GFLOPs，不能写成1.074 GFLOP/s。前者是工作量，后者需要再除以秒数。\u003c/p>\n\u003ch2 id=\"h03\">backward 的两次矩阵乘法从哪里来\u003c/h2>\n\u003cp>令上游梯度 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>∂\u003c/mi>\u003cmi>Y\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">G=\\partial L/\\partial Y\u003c/annotation>\u003c/semantics>\u003c/math>，形状为 M×N。微分满足 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>Y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>X\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dY=dXW+XdW\u003c/annotation>\u003c/semantics>\u003c/math>。将其代入标量损失的微分，可得\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>X\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>G\u003c/mi>\u003cmsup>\u003cmi>W\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmo>,\u003c/mo>\u003cmspace width=\"2.0em\">\u003c/mspace>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>X\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msup>\u003cmi>G\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{\\partial L}{\\partial X}=GW^T,\\qquad \\frac{\\partial L}{\\partial W}=X^TG.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>两个乘法都约为2MNK。因此一个需要输入与权重梯度的 Linear，forward+backward 约为6MNK。冻结权重、某些梯度不需要计算、重算等情况会改变成本。\u003c/p>\n\u003ch2 id=\"h04\">2P / 6P 何时能用\u003c/h2>\n\u003cp>对主要由 dense Linear 构成的模型，若一个 token 经过大部分矩阵权重，每个参数约参与一次乘加，则 forward/token 粗估为2P，训练约6P。这里不是从参数总数自动推导的定律：embedding lookup 不执行完整矩阵乘法，长序列 attention 的 score/PV 计算也不能忽略；MoE 应区分总参数和活跃参数；activation checkpointing 还增加重算。\u003c/p>\n\u003ch2 id=\"h05\">与项目怎么连接\u003c/h2>\n\u003cp>QK Fusion 主要减少 launch 和中间张量，并不显著降低 QKV Linear 的2MNK。FSDP 主要降低持久状态复制，也不会把同一训练样本所需的数学运算自动除以卡数。看见 latency 下降，应先问哪个成本变化，而不是直接说 FLOPs 降低。\u003c/p>\n\u003cp>使用计算实验室改变 M，观察工作量与理想数据量；这是理论估算，不是GPU实测。\u003c/p>\n","toc":[{"id":"h01","title":"Linear 为什么是矩阵乘法","level":2},{"id":"h02","title":"小例子与实际形状","level":2},{"id":"h03","title":"backward 的两次矩阵乘法从哪里来","level":2},{"id":"h04","title":"2P / 6P 何时能用","level":2},{"id":"h05","title":"与项目怎么连接","level":2}],"plain":"Linear 为什么是矩阵乘法 设 X ∈ ℝ M × K 、 W ∈ ℝ K × N ，输出 Y = X W 。M 是输入行数；LLM 中常把 batch 和 token 两维展开为 M。K 是输入特征数，N 是输出特征数。数学右乘记法下 W 为 K×N； nn.Linear 存储的是 N×K。 一个输出元素为 Y i j = ∑ k = 1 K X i k W k j . 它包含 K 次乘法、K−1 次加法，精确的标量工作计数为 M N ( 2 K − 1 ) 。工程中常将 multiply-accumulate 计为两个 FLOPs，于是使用 F ≈ 2 M N K . FMA 可以是一条硬件指令，但仍按一次乘法加一次加法记为 2 FLOPs。 指令数不等于 FLOPs 。计数惯例不同必须注明。 小例子与实际形状 2×3 乘 3×2 产生 4 个输出，各用 3 乘 2 加，精确为20次；近似式给24。大型矩阵中少掉的 MN 次加法相对于 2MNK 很小。 Qwen 的示例 projection 若输入为 [1,128,2048] ，展开后 M=128。若输出宽度为2048，则 F ≈ 2 ⋅ 128 ⋅ 2048 2 = 1 , 073 , 741 , 824 . 这约为1.074 GFLOPs，不能写成1.074 GFLOP/s。前者是工作量，后者需要再除以秒数。 backward 的两次矩阵乘法从哪里来 令上游梯度 G = ∂ L / ∂ Y ，形状为 M×N。微分满足 d Y = d X W + X d W 。将其代入标量损失的微分，可得 ∂ L ∂ X = G W T , ∂ L ∂ W = X T G . 两个乘法都约为2MNK。因此一个需要输入与权重梯度的 Linear，forward+backward 约为6MNK。冻结权重、某些梯度不需要计算、重算等情况会改变成本。 2P / 6P 何时能用 对主要由 dense Linear 构成的模型，若一个 token 经过大部分矩阵权重，每个参数约参与一次乘加，则 forward/token 粗估为2P，训练约6P。这里不是从参数总数自动推导的定律：embedding lookup 不执行完整矩阵乘法，长序列 attention 的 score/PV 计算也不能忽略；MoE 应区分总参数和活跃参数；activation checkpointing 还增加重算。 与项目怎么连接 QK Fusion 主要减少 launch 和中间张量，并不显著降低 QKV Linear 的2MNK。FSDP 主要降低持久状态复制，也不会把同一训练样本所需的数学运算自动除以卡数。看见 latency 下降，应先问哪个成本变化，而不是直接说 FLOPs 降低。 使用计算实验室改变 M，观察工作量与理想数据量；这是理论估算，不是GPU实测。","charCount":1004},{"id":"roofline","title":"Roofline：为什么 FLOPs 少也可能慢","section":"foundations","summary":"从数据量推导 compute-bound、memory-bound、launch-bound 与 Amdahl 定律。","prereq":["gemm-flops"],"sources":["nvidia-gpu","nvidia-matmul","a6000","qreplication"],"tags":["Roofline","memory-bound","compute-bound","launch-bound"],"level":1,"kind":"原理与推导","checks":[{"q":"减少FLOPs一定减少latency吗？","a":"不一定。引入额外访存、较差并行度或更多启动可能抵消收益。需要固定工作量的端到端测量。"},{"q":"optimizer占20%，它快4倍，整体快多少？","a":"1/(0.8+0.2/4)=1/0.85≈1.176倍。该估计假设其余成本不变且按串行加和。"}],"lab":null,"raw":"## 两个相同 FLOPs 的程序为什么速度不同\nGPU 必须先拿到数据才能计算。若每次读取只做少量运算，就可能先耗尽带宽；若同一份数据被反复复用，才更可能接近计算吞吐上限。于是定义算术强度\n\n$$AI=\\frac{F}{Q},$$\n\nF 是 FLOPs，Q 是穿过指定存储层的数据字节数。计算 HBM 级强度时，不能把寄存器访问也混进分母。\n\n## 对 GEMM 做一个理想估算\n忽略bias和额外workspace，假设输入与输出每元素b字节、X和W各读一次、Y写一次：\n\n$$Q_{ideal}=b(MK+KN+MN).$$\n\n于是 $AI_{ideal}=2MNK/Q_{ideal}$。FP16、K=N=2048 时，M=1 的强度约1 FLOP/Byte，M=128 约113.8。原因是同一份 W 被更多输入行复用。实际读写可能高于这个理想值，也可能受缓存驻留影响，所以它不是硬件 counter。\n\n## 两条上界怎样组合\n设硬件在当前精度下峰值计算能力为 C FLOP/s、带宽为 B Byte/s。搬运 Q 字节至少要 Q/B 秒，计算 F 至少要 F/C 秒。理想重叠情况下\n\n$$T\\ge\\max(F/C,Q/B),\\quad P\\le\\min(C,AI\\cdot B).$$\n\n两条上界在 $AI=C/B$ 相交，这叫 ridge point。低于它时可能 memory-bound，高于它时可能 compute-bound。一个程序也可能因并行度不足、同步或调度而远离两条上界。\n\n## 不要遗漏 launch-bound\n许多几微秒的小kernel串联时，Python dispatch 和提交间隙可能变成关键路径。CUDA Graph减少重复提交，而不是提高数学吞吐；fusion可能同时减少中间数据与提交次数。不能把“显存访问很多”和“带宽已经饱和”等同。\n\nRTX A6000 使用 GDDR6，并非 HBM。通用文献常写 HBM traffic；讨论本项目时更准确的说法是 global-memory / DRAM traffic。存储层名称与实际硬件要对齐。\n\n## Amdahl：局部改进为什么被稀释\n若原时间中某部分占比p，该部分获得s倍加速，其余不变：\n\n$$S_{total}=\\frac{1}{(1-p)+p/s}.$$\n\n例如optimizer占10%，加速2倍，整体仅为1/0.95≈1.053倍。反过来，若完整流程快很多而GPU kernel时间和变化不大，应检查调度、同步、缓存路径，不能声称算术吞吐突然翻倍。\n\n## 实验动作\n固定shape与dtype，分别测原版、只改变布局、只改变融合、组合版本。采集timeline定位空闲间隙，再在权限允许时采集kernel counter。你的仓库报告过性能计数器权限不足，因此不能写“已经证明 DRAM 利用率达到某百分比”。\n","html":"\u003ch2 id=\"h01\">两个相同 FLOPs 的程序为什么速度不同\u003c/h2>\n\u003cp>GPU 必须先拿到数据才能计算。若每次读取只做少量运算，就可能先耗尽带宽；若同一份数据被反复复用，才更可能接近计算吞吐上限。于是定义算术强度\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>F\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mfrac>\u003cmo>,\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">AI=\\frac{F}{Q},\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>F 是 FLOPs，Q 是穿过指定存储层的数据字节数。计算 HBM 级强度时，不能把寄存器访问也混进分母。\u003c/p>\n\u003ch2 id=\"h02\">对 GEMM 做一个理想估算\u003c/h2>\n\u003cp>忽略bias和额外workspace，假设输入与输出每元素b字节、X和W各读一次、Y写一次：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>b\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>M\u003c/mi>\u003cmi>K\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>K\u003c/mi>\u003cmi>N\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>M\u003c/mi>\u003cmi>N\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">Q_{ideal}=b(MK+KN+MN).\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>于是 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>M\u003c/mi>\u003cmi>N\u003c/mi>\u003cmi>K\u003c/mi>\u003cmi>/\u003c/mi>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">AI_{ideal}=2MNK/Q_{ideal}\u003c/annotation>\u003c/semantics>\u003c/math>。FP16、K=N=2048 时，M=1 的强度约1 FLOP/Byte，M=128 约113.8。原因是同一份 W 被更多输入行复用。实际读写可能高于这个理想值，也可能受缓存驻留影响，所以它不是硬件 counter。\u003c/p>\n\u003ch2 id=\"h03\">两条上界怎样组合\u003c/h2>\n\u003cp>设硬件在当前精度下峰值计算能力为 C FLOP/s、带宽为 B Byte/s。搬运 Q 字节至少要 Q/B 秒，计算 F 至少要 F/C 秒。理想重叠情况下\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>≥\u003c/mo>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>F\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>C\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmi>P\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmo>min\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">T\\ge\\max(F/C,Q/B),\\quad P\\le\\min(C,AI\\cdot B).\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>两条上界在 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>C\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">AI=C/B\u003c/annotation>\u003c/semantics>\u003c/math> 相交，这叫 ridge point。低于它时可能 memory-bound，高于它时可能 compute-bound。一个程序也可能因并行度不足、同步或调度而远离两条上界。\u003c/p>\n\u003ch2 id=\"h04\">不要遗漏 launch-bound\u003c/h2>\n\u003cp>许多几微秒的小kernel串联时，Python dispatch 和提交间隙可能变成关键路径。CUDA Graph减少重复提交，而不是提高数学吞吐；fusion可能同时减少中间数据与提交次数。不能把“显存访问很多”和“带宽已经饱和”等同。\u003c/p>\n\u003cp>RTX A6000 使用 GDDR6，并非 HBM。通用文献常写 HBM traffic；讨论本项目时更准确的说法是 global-memory / DRAM traffic。存储层名称与实际硬件要对齐。\u003c/p>\n\u003ch2 id=\"h05\">Amdahl：局部改进为什么被稀释\u003c/h2>\n\u003cp>若原时间中某部分占比p，该部分获得s倍加速，其余不变：\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>p\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">S_{total}=\\frac{1}{(1-p)+p/s}.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>例如optimizer占10%，加速2倍，整体仅为1/0.95≈1.053倍。反过来，若完整流程快很多而GPU kernel时间和变化不大，应检查调度、同步、缓存路径，不能声称算术吞吐突然翻倍。\u003c/p>\n\u003ch2 id=\"h06\">实验动作\u003c/h2>\n\u003cp>固定shape与dtype，分别测原版、只改变布局、只改变融合、组合版本。采集timeline定位空闲间隙，再在权限允许时采集kernel counter。你的仓库报告过性能计数器权限不足，因此不能写“已经证明 DRAM 利用率达到某百分比”。\u003c/p>\n","toc":[{"id":"h01","title":"两个相同 FLOPs 的程序为什么速度不同","level":2},{"id":"h02","title":"对 GEMM 做一个理想估算","level":2},{"id":"h03","title":"两条上界怎样组合","level":2},{"id":"h04","title":"不要遗漏 launch-bound","level":2},{"id":"h05","title":"Amdahl：局部改进为什么被稀释","level":2},{"id":"h06","title":"实验动作","level":2}],"plain":"两个相同 FLOPs 的程序为什么速度不同 GPU 必须先拿到数据才能计算。若每次读取只做少量运算，就可能先耗尽带宽；若同一份数据被反复复用，才更可能接近计算吞吐上限。于是定义算术强度 A I = F Q , F 是 FLOPs，Q 是穿过指定存储层的数据字节数。计算 HBM 级强度时，不能把寄存器访问也混进分母。 对 GEMM 做一个理想估算 忽略bias和额外workspace，假设输入与输出每元素b字节、X和W各读一次、Y写一次： Q i d e a l = b ( M K + K N + M N ) . 于是 A I i d e a l = 2 M N K / Q i d e a l 。FP16、K=N=2048 时，M=1 的强度约1 FLOP/Byte，M=128 约113.8。原因是同一份 W 被更多输入行复用。实际读写可能高于这个理想值，也可能受缓存驻留影响，所以它不是硬件 counter。 两条上界怎样组合 设硬件在当前精度下峰值计算能力为 C FLOP/s、带宽为 B Byte/s。搬运 Q 字节至少要 Q/B 秒，计算 F 至少要 F/C 秒。理想重叠情况下 T ≥ max ( F / C , Q / B ) , P ≤ min ( C , A I ⋅ B ) . 两条上界在 A I = C / B 相交，这叫 ridge point。低于它时可能 memory-bound，高于它时可能 compute-bound。一个程序也可能因并行度不足、同步或调度而远离两条上界。 不要遗漏 launch-bound 许多几微秒的小kernel串联时，Python dispatch 和提交间隙可能变成关键路径。CUDA Graph减少重复提交，而不是提高数学吞吐；fusion可能同时减少中间数据与提交次数。不能把“显存访问很多”和“带宽已经饱和”等同。 RTX A6000 使用 GDDR6，并非 HBM。通用文献常写 HBM traffic；讨论本项目时更准确的说法是 global-memory / DRAM traffic。存储层名称与实际硬件要对齐。 Amdahl：局部改进为什么被稀释 若原时间中某部分占比p，该部分获得s倍加速，其余不变： S t o t a l = 1 ( 1 − p ) + p / s . 例如optimizer占10%，加速2倍，整体仅为1/0.95≈1.053倍。反过来，若完整流程快很多而GPU kernel时间和变化不大，应检查调度、同步、缓存路径，不能声称算术吞吐突然翻倍。 实验动作 固定shape与dtype，分别测原版、只改变布局、只改变融合、组合版本。采集timeline定位空闲间隙，再在权限允许时采集kernel counter。你的仓库报告过性能计数器权限不足，因此不能写“已经证明 DRAM 利用率达到某百分比”。","charCount":1043},{"id":"floating-point","title":"有限精度：FP32、FP16、BF16 与舍入路径","section":"foundations","summary":"把正常浮点差异、算法近似和实现错误区分开。","prereq":["gemm-flops"],"sources":["accuracy","qadamw","qkernel"],"tags":["BF16","FP16","FMA","数值精度"],"level":1,"kind":"原理与推导","checks":[{"q":"FP32通信是否意味着参数梯度全程FP32计算？","a":"不是。通信dtype只规定传输/归约表示；梯度来源可能已舍入成BF16。"},{"q":"更精确的中间计算一定更符合原参考吗？","a":"不一定。原参考若在中间写回低精度，消除该舍入可能改变之后的执行结果。"}],"lab":"labs/04_precision.py","raw":"## 一个数为什么存不精确\n浮点数用符号、指数和有限尾数近似实数。FP32 有8位指数、23位显式尾数；FP16 是5与10；BF16 是8与7。BF16 的指数范围接近 FP32，但有效精度更粗。它不是“更精确的FP16”。\n\n以1附近的正规数为例，BF16相邻值间距约 $2^{-7}$，FP16约 $2^{-10}$。在1附近增加0.001，是否能保留，取决于格式、舍入方式和当前值；绝不能把BF16普通误差上界统一写成 $10^{-6}$。\n\n## 不结合律与 FMA\n实数里 $(a+b)+c=a+(b+c)$；浮点运算每一步都要舍入。取FP32的 $a=10^{20},b=-10^{20},c=3$，左式可得3，右式可能得0，因为b+c的小增量丢失。\n\nFMA将ab+c作为一个融合运算，在乘加后一次舍入；分离乘法与加法通常有两次舍入。FMA往往更接近实数结果，却不保证更接近某个固定参考执行路径。性能与数值契约需要分别确认。\n\n## accumulation dtype 与 storage dtype\nBF16输入可以提升到FP32求和，再写回BF16。这样提高中间精度，但最终输出仍被低精度存储量化。把BF16梯度转换为FP32再通信，也不能找回生成BF16梯度时已经丢失的位。\n\nQK Fusion 保留若干低精度cast边界；Triton AdamW的rounded路径处理beta补数、除法与FMA。两者都是保持参考执行语义的工程选择，不是所有输入逐位一致的数学证明。\n\n## 四种不同现象\n**舍入差异**：同一数学计算，不同执行顺序。**算法近似**：如exact GeLU变成tanh近似，函数本身改变。**实现错误**：stride、mask、漏项等破坏语义。**非确定性**：相同输入重复执行也可能因并发归约顺序不同而变化。差分出现异常后，要分辨是哪一种。\n\n量化是有意的近似表示，必须有质量评价；“argmax在几个输入相同”不能证明所有生成轨迹相同。\n\n## 可运行检查\n```python\nimport numpy as np\na, b, c = map(np.float32, [1e20, -1e20, 3.0])\nprint((a+b)+c, a+(b+c))\nprint(np.spacing(np.float32(1.0)))\nprint(np.spacing(np.float16(1.0)))\n```\n\n`labs/04_precision.py` 还包含BF16 round-to-nearest-even的CPU演示。它模拟数值存储，不模拟GPU指令或Tensor Core。\n","html":"\u003ch2 id=\"h01\">一个数为什么存不精确\u003c/h2>\n\u003cp>浮点数用符号、指数和有限尾数近似实数。FP32 有8位指数、23位显式尾数；FP16 是5与10；BF16 是8与7。BF16 的指数范围接近 FP32，但有效精度更粗。它不是“更精确的FP16”。\u003c/p>\n\u003cp>以1附近的正规数为例，BF16相邻值间距约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmi>−\u003c/mi>\u003cmn>7\u003c/mn>\u003c/mrow>\u003c/msup>\u003cannotation encoding=\"application/x-tex\">2^{-7}\u003c/annotation>\u003c/semantics>\u003c/math>，FP16约 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmi>−\u003c/mi>\u003cmn>10\u003c/mn>\u003c/mrow>\u003c/msup>\u003cannotation encoding=\"application/x-tex\">2^{-10}\u003c/annotation>\u003c/semantics>\u003c/math>。在1附近增加0.001，是否能保留，取决于格式、舍入方式和当前值；绝不能把BF16普通误差上界统一写成 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmi>−\u003c/mi>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/msup>\u003cannotation encoding=\"application/x-tex\">10^{-6}\u003c/annotation>\u003c/semantics>\u003c/math>。\u003c/p>\n\u003ch2 id=\"h02\">不结合律与 FMA\u003c/h2>\n\u003cp>实数里 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">(a+b)+c=a+(b+c)\u003c/annotation>\u003c/semantics>\u003c/math>；浮点运算每一步都要舍入。取FP32的 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>20\u003c/mn>\u003c/msup>\u003cmo>,\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>−\u003c/mi>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>20\u003c/mn>\u003c/msup>\u003cmo>,\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">a=10^{20},b=-10^{20},c=3\u003c/annotation>\u003c/semantics>\u003c/math>，左式可得3，右式可能得0，因为b+c的小增量丢失。\u003c/p>\n\u003cp>FMA将ab+c作为一个融合运算，在乘加后一次舍入；分离乘法与加法通常有两次舍入。FMA往往更接近实数结果，却不保证更接近某个固定参考执行路径。性能与数值契约需要分别确认。\u003c/p>\n\u003ch2 id=\"h03\">accumulation dtype 与 storage dtype\u003c/h2>\n\u003cp>BF16输入可以提升到FP32求和，再写回BF16。这样提高中间精度，但最终输出仍被低精度存储量化。把BF16梯度转换为FP32再通信，也不能找回生成BF16梯度时已经丢失的位。\u003c/p>\n\u003cp>QK Fusion 保留若干低精度cast边界；Triton AdamW的rounded路径处理beta补数、除法与FMA。两者都是保持参考执行语义的工程选择，不是所有输入逐位一致的数学证明。\u003c/p>\n\u003ch2 id=\"h04\">四种不同现象\u003c/h2>\n\u003cp>\u003cstrong>舍入差异\u003c/strong>：同一数学计算，不同执行顺序。\u003cstrong>算法近似\u003c/strong>：如exact GeLU变成tanh近似，函数本身改变。\u003cstrong>实现错误\u003c/strong>：stride、mask、漏项等破坏语义。\u003cstrong>非确定性\u003c/strong>：相同输入重复执行也可能因并发归约顺序不同而变化。差分出现异常后，要分辨是哪一种。\u003c/p>\n\u003cp>量化是有意的近似表示，必须有质量评价；“argmax在几个输入相同”不能证明所有生成轨迹相同。\u003c/p>\n\u003ch2 id=\"h05\">可运行检查\u003c/h2>\n\u003cpre class=\"python\">\u003ccode>import numpy as np\na, b, c = map(np.float32, [1e20, -1e20, 3.0])\nprint((a+b)+c, a+(b+c))\nprint(np.spacing(np.float32(1.0)))\nprint(np.spacing(np.float16(1.0)))\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>labs/04_precision.py\u003c/code> 还包含BF16 round-to-nearest-even的CPU演示。它模拟数值存储，不模拟GPU指令或Tensor Core。\u003c/p>\n","toc":[{"id":"h01","title":"一个数为什么存不精确","level":2},{"id":"h02","title":"不结合律与 FMA","level":2},{"id":"h03","title":"accumulation dtype 与 storage dtype","level":2},{"id":"h04","title":"四种不同现象","level":2},{"id":"h05","title":"可运行检查","level":2}],"plain":"一个数为什么存不精确 浮点数用符号、指数和有限尾数近似实数。FP32 有8位指数、23位显式尾数；FP16 是5与10；BF16 是8与7。BF16 的指数范围接近 FP32，但有效精度更粗。它不是“更精确的FP16”。 以1附近的正规数为例，BF16相邻值间距约 2 − 7 ，FP16约 2 − 10 。在1附近增加0.001，是否能保留，取决于格式、舍入方式和当前值；绝不能把BF16普通误差上界统一写成 10 − 6 。 不结合律与 FMA 实数里 ( a + b ) + c = a + ( b + c ) ；浮点运算每一步都要舍入。取FP32的 a = 10 20 , b = − 10 20 , c = 3 ，左式可得3，右式可能得0，因为b+c的小增量丢失。 FMA将ab+c作为一个融合运算，在乘加后一次舍入；分离乘法与加法通常有两次舍入。FMA往往更接近实数结果，却不保证更接近某个固定参考执行路径。性能与数值契约需要分别确认。 accumulation dtype 与 storage dtype BF16输入可以提升到FP32求和，再写回BF16。这样提高中间精度，但最终输出仍被低精度存储量化。把BF16梯度转换为FP32再通信，也不能找回生成BF16梯度时已经丢失的位。 QK Fusion 保留若干低精度cast边界；Triton AdamW的rounded路径处理beta补数、除法与FMA。两者都是保持参考执行语义的工程选择，不是所有输入逐位一致的数学证明。 四种不同现象 舍入差异 ：同一数学计算，不同执行顺序。 算法近似 ：如exact GeLU变成tanh近似，函数本身改变。 实现错误 ：stride、mask、漏项等破坏语义。 非确定性 ：相同输入重复执行也可能因并发归约顺序不同而变化。差分出现异常后，要分辨是哪一种。 量化是有意的近似表示，必须有质量评价；“argmax在几个输入相同”不能证明所有生成轨迹相同。 可运行检查 import numpy as np a, b, c = map(np.float32, [1e20, -1e20, 3.0]) print((a+b)+c, a+(b+c)) print(np.spacing(np.float32(1.0))) print(np.spacing(np.float16(1.0))) labs/04_precision.py 还包含BF16 round-to-nearest-even的CPU演示。它模拟数值存储，不模拟GPU指令或Tensor Core。","charCount":986},{"id":"autograd","title":"Autograd：从链式法则到一次真实训练更新","section":"foundations","summary":"解释梯度累加、叶子参数、no_grad、optimizer 与图的生命周期。","prereq":["tensor-layout","floating-point"],"sources":["autograd-doc","qbfsdp","qtied"],"tags":["autograd","反向传播","gradient"],"level":1,"kind":"原理与推导","checks":[{"q":"eval()会阻止梯度记录吗？","a":"不会。eval改变模块训练行为，no_grad/inference_mode控制求导记录，两者概念不同。"},{"q":"两次microbatch的loss.backward后step，会自动平均吗？","a":"不会。grad默认累加；需要根据loss reduction与有效样本/token权重进行正确缩放。"}],"lab":null,"raw":"## 为什么训练需要 backward\n模型预测错了，需要知道每个参数怎样影响loss。最简单例子为 $y=wx$、$L=(y-t)^2/2$。链式法则给出\n\n$$\\frac{\\partial L}{\\partial w}=(y-t)x,\\quad\\frac{\\partial L}{\\partial x}=(y-t)w.$$\n\n反向模式自动微分将上游梯度逐层乘以局部导数，避免对每个参数分别运行一次完整forward。面对数十亿参数、标量loss，这很重要。\n\n## 为什么共享参数的梯度必须相加\n若同一个w影响两条分支 $L=f(w)+g(w)$，则 $dL/dw=f'(w)+g'(w)$。因此多条反向路径不能简单覆盖同一grad。Qwen tied embedding/head需要收集两次使用的贡献；FSDP还要在不同rank之间汇总本地数据的贡献。它们是两种不同的“累加”。\n\n## PyTorch训练循环每一步干什么\n```python\noptimizer.zero_grad(set_to_none=True)\nlogits = model(inputs)\nloss = criterion(logits, targets)\nloss.backward()       # 写入/累加参数的 .grad\noptimizer.step()      # 用grad更新参数与optimizer状态\n```\n\n`backward()` 不自动清空旧梯度。`step()` 不自动重新运行forward。`model.eval()` 改变dropout等模块行为，不等于关闭autograd；`no_grad()` 控制是否记录求导图。推理通常同时需要适当的eval模式与禁用梯度记录。\n\n## 为什么 backward 需要保存中间值\n例如SiLU的导数依赖输入；矩阵乘法的dW依赖X。框架会保存求导所需的Tensor，不能在forward一结束就全部释放。保存得越多，activation显存越大；重新计算则用计算换存储。\n\n`detach()` 返回与原Tensor共享存储但脱离当前求导链的视图语义结果，不是复制。`clone()` 复制数据，但在有梯度上下文时仍可保留求导关系。需要独立数值与独立图时常用 `detach().clone()`，但不能机械套用。\n\n## 自定义 autograd.Function\n它允许明确写forward和backward的契约。backward必须返回各Tensor输入的梯度，正确处理None、shape、dtype与多分支贡献。你的TiedEmbedding在backward合并梯度；BlockFSDP在backward聚合参数、重算并reduce-scatter。一个是改变梯度的数据流，一个是管理分片生命周期。\n\n实际验证应同时看forward、输入梯度、全部参数梯度以及连续几步更新；只看loss接近会漏掉backward-only bug。\n","html":"\u003ch2 id=\"h01\">为什么训练需要 backward\u003c/h2>\n\u003cp>模型预测错了，需要知道每个参数怎样影响loss。最简单例子为 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>w\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y=wx\u003c/annotation>\u003c/semantics>\u003c/math>、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">L=(y-t)^2/2\u003c/annotation>\u003c/semantics>\u003c/math>。链式法则给出\u003c/p>\n\u003cdiv class=\"math display\">\u003cmath display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>w\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>x\u003c/mi>\u003cmo>,\u003c/mo>\u003cmspace width=\"1.0em\">\u003c/mspace>\u003cmfrac>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmi>w\u003c/mi>\u003cmi>.\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{\\partial L}{\\partial w}=(y-t)x,\\quad\\frac{\\partial L}{\\partial x}=(y-t)w.\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>\n\u003cp>反向模式自动微分将上游梯度逐层乘以局部导数，避免对每个参数分别运行一次完整forward。面对数十亿参数、标量loss，这很重要。\u003c/p>\n\u003ch2 id=\"h02\">为什么共享参数的梯度必须相加\u003c/h2>\n\u003cp>若同一个w影响两条分支 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>g\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">L=f(w)+g(w)\u003c/annotation>\u003c/semantics>\u003c/math>，则 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>/\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>w\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmi>′\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>g\u003c/mi>\u003cmi>′\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" form=\"prefix\">(\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"true\" form=\"postfix\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dL/dw=f&#39;(w)+g&#39;(w)\u003c/annotation>\u003c/semantics>\u003c/math>。因此多条反向路径不能简单覆盖同一grad。Qwen tied embedding/head需要收集两次使用的贡献；FSDP还要在不同rank之间汇总本地数据的贡献。它们是两种不同的“累加”。\u003c/p>\n\u003ch2 id=\"h03\">PyTorch训练循环每一步干什么\u003c/h2>\n\u003cpre class=\"python\">\u003ccode>optimizer.zero_grad(set_to_none=True)\nlogits = model(inputs)\nloss = criterion(logits, targets)\nloss.backward()       # 写入/累加参数的 .grad\noptimizer.step()      # 用grad更新参数与optimizer状态\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>backward()\u003c/code> 不自动清空旧梯度。\u003ccode>step()\u003c/code> 不自动重新运行forward。\u003ccode>model.eval()\u003c/code> 改变dropout等模块行为，不等于关闭autograd；\u003ccode>no_grad()\u003c/code> 控制是否记录求导图。推理通常同时需要适当的eval模式与禁用梯度记录。\u003c/p>\n\u003ch2 id=\"h04\">为什么 backward 需要保存中间值\u003c/h2>\n\u003cp>例如SiLU的导数依赖输入；矩阵乘法的dW依赖X。框架会保存求导所需的Tensor，不能在forward一结束就全部释放。保存得越多，activation显存越大；重新计算则用计算换存储。\u003c/p>\n\u003cp>\u003ccode>detach()\u003c/code> 返回与原Tensor共享存储但脱离当前求导链的视图语义结果，不是复制。\u003ccode>clone()\u003c/code> 复制数据，但在有梯度上下文时仍可保留求导关系。需要独立数值与独立图时常用 \u003ccode>detach().clone()\u003c/code>，但不能机械套用。\u003c/p>\n\u003ch2 id=\"h05\">自定义 autograd.Function\u003c/h2>\n\u003cp>它允许明确写forward和backward的契约。backward必须返回各Tensor输入的梯度，正确处理None、shape、dtype与多分支贡献。你的TiedEmbedding在backward合并梯度；BlockFSDP在backward聚合参数、重算并reduce-scatter。一个是改变梯度的数据流，一个是管理分片生命周期。\u003c/p>\n\u003cp>实际验证应同时看forward、输入梯度、全部参数梯度以及连续几步更新；只看loss接近会漏掉backward-only bug。\u003c/p>\n","toc":[{"id":"h01","title":"为什么训练需要 backward","level":2},{"id":"h02","title":"为什么共享参数的梯度必须相加","level":2},{"id":"h03","title":"PyTorch训练循环每一步干什么","level":2},{"id":"h04","title":"为什么 backward 需要保存中间值","level":2},{"id":"h05","title":"自定义 autograd.Function","level":2}],"plain":"为什么训练需要 backward 模型预测错了，需要知道每个参数怎样影响loss。最简单例子为 y = w x 、 L = ( y − t ) 2 / 2 。链式法则给出 ∂ L ∂ w = ( y − t ) x , ∂ L ∂ x = ( y − t ) w . 反向模式自动微分将上游梯度逐层乘以局部导数，避免对每个参数分别运行一次完整forward。面对数十亿参数、标量loss，这很重要。 为什么共享参数的梯度必须相加 若同一个w影响两条分支 L = f ( w ) + g ( w ) ，则 d L / d w = f ′ ( w ) + g ′ ( w ) 。因此多条反向路径不能简单覆盖同一grad。Qwen tied embedding/head需要收集两次使用的贡献；FSDP还要在不同rank之间汇总本地数据的贡献。它们是两种不同的“累加”。 PyTorch训练循环每一步干什么 optimizer.zero_grad(set_to_none=True) logits = model(inputs) loss = criterion(logits, targets) loss.backward() # 写入/累加参数的 .grad optimizer.step() # 用grad更新参数与optimizer状态 backward() 不自动清空旧梯度。 step() 不自动重新运行forward。 model.eval() 改变dropout等模块行为，不等于关闭autograd； no_grad() 控制是否记录求导图。推理通常同时需要适当的eval模式与禁用梯度记录。 为什么 backward 需要保存中间值 例如SiLU的导数依赖输入；矩阵乘法的dW依赖X。框架会保存求导所需的Tensor，不能在forward一结束就全部释放。保存得越多，activation显存越大；重新计算则用计算换存储。 detach() 返回与原Tensor共享存储但脱离当前求导链的视图语义结果，不是复制。 clone() 复制数据，但在有梯度上下文时仍可保留求导关系。需要独立数值与独立图时常用 detach().clone() ，但不能机械套用。 自定义 autograd.Function 它允许明确写forward和backward的契约。backward必须返回各Tensor输入的梯度，正确处理None、shape、dtype与多分支贡献。你的TiedEmbedding在backward合并梯度；BlockFSDP在backward聚合参数、重算并reduce-scatter。一个是改变梯度的数据流，一个是管理分片生命周期。 实际验证应同时看forward、输入梯度、全部参数梯度以及连续几步更新；只看loss接近会漏掉backward-only bug。","charCount":1080},{"id":"engineering","title":"工程底座：环境、数据、I/O与分布式故障排查","section":"foundations","summary":"把可复现运行放在调优之前，解释进程、版本、数据管道与故障边界。","prereq":["orientation","profiling","collectives"],"sources":["nccl","cuda-semantics","qreadme","qfsdp"],"tags":["Linux","DataLoader","I/O","NCCL debug","复现"],"level":1,"kind":"原理与推导","checks":[{"q":"容器能否保证所有数值与性能条件一致？","a":"不能。宿主driver、GPU、时钟、共享负载、数据和文件系统等仍有影响。"},{"q":"多卡中NCCL超时是否总是网络错误？","a":"不一定，某rank先OOM/退出或collective顺序不一致也会让其它rank等待。"}],"lab":null,"raw":"## 为什么“代码一样”仍可能结果不同\n模型权重、数据顺序、tokenizer、PyTorch/Triton/CUDA/driver、GPU型号、compiler options与随机状态共同决定运行条件。一个可复现实验至少需要环境清单、源码commit、输入/权重hash、运行命令和原始结果。只有截图不够。\n\n使用独立venv/Conda或容器，避免修改宿主系统Python。容器固定用户态依赖，不会自动固定宿主driver、GPU时钟、网络与文件系统。历史benchmark引用本机路径时先检查参数，不要盲目复制破坏已有checkpoint。\n\n## CPU数据管道如何拖慢GPU\nDataLoader可能等待磁盘、tokenization或CPU处理；pageable memory到GPU传输还涉及额外路径。Pinned memory和非阻塞传输可以为重叠创造条件，但前提是缓冲生命周期与stream依赖正确。更多worker不一定更快，可能增加内存、随机性和I/O竞争。\n\n看到GPU空闲，先区分数据未准备、CPU dispatch、同步等待、通信阻塞与真正kernel执行。不要仅凭utilization=0就重启一个正在CPU初始化大模型的任务。\n\n## Linux与进程基本功\n知道PID、退出码、stdout/stderr、工作目录、环境变量和文件权限。日志停止更新不自动说明进程死锁；可能在编译、加载或checkpoint写盘。监控应只读，不要因为“没新日志”擅自启动第二份作业写同一路径。\n\n```bash\n# 只读诊断示例，不杀进程、不改系统配置\nps -ef | grep python\nnvidia-smi\nnvidia-smi topo -m\ndf -h\n```\n\n## 多卡hang从collective契约排查\n先检查所有rank是否启动、设备绑定是否正确、输入shape/count与dtype是否匹配、collective顺序是否一致。有一张卡先抛OOM，其余卡可能表现为通信等待；表面NCCL超时不一定是网络根因。\n\n复现时保存各rank日志，不仅rank0。缩到小模型/小数据，保留通信模式。跨机还需检查路由、网卡、RDMA权限与容器环境，不在未确认前随意改系统驱动或关闭安全限制。\n\n## 部署与研究的边界\n一个多卡训练脚本不是集群调度平台。Kubernetes/Slurm负责资源和作业管理的一部分，GPU任务还要明确设备需求、持久存储、checkpoint与重试。Serving需要健康检查、超时、限流、模型版本与指标。本站只讲原理，不假装你的仓库实现了这些生产平台。\n\n实验目录应不可覆盖，失败结果保留；大模型state通常用pickle或类似序列化，不能加载不可信文件。公开网站不应包含私有语料、模型权重、凭据或未授权论文全文。\n","html":"\u003ch2 id=\"h01\">为什么“代码一样”仍可能结果不同\u003c/h2>\n\u003cp>模型权重、数据顺序、tokenizer、PyTorch/Triton/CUDA/driver、GPU型号、compiler options与随机状态共同决定运行条件。一个可复现实验至少需要环境清单、源码commit、输入/权重hash、运行命令和原始结果。只有截图不够。\u003c/p>\n\u003cp>使用独立venv/Conda或容器，避免修改宿主系统Python。容器固定用户态依赖，不会自动固定宿主driver、GPU时钟、网络与文件系统。历史benchmark引用本机路径时先检查参数，不要盲目复制破坏已有checkpoint。\u003c/p>\n\u003ch2 id=\"h02\">CPU数据管道如何拖慢GPU\u003c/h2>\n\u003cp>DataLoader可能等待磁盘、tokenization或CPU处理；pageable memory到GPU传输还涉及额外路径。Pinned memory和非阻塞传输可以为重叠创造条件，但前提是缓冲生命周期与stream依赖正确。更多worker不一定更快，可能增加内存、随机性和I/O竞争。\u003c/p>\n\u003cp>看到GPU空闲，先区分数据未准备、CPU dispatch、同步等待、通信阻塞与真正kernel执行。不要仅凭utilization=0就重启一个正在CPU初始化大模型的任务。\u003c/p>\n\u003ch2 id=\"h03\">Linux与进程基本功\u003c/h2>\n\u003cp>知道PID、退出码、stdout/stderr、工作目录、环境变量和文件权限。日志停止更新不自动说明进程死锁；可能在编译、加载或checkpoint写盘。监控应只读，不要因为“没新日志”擅自启动第二份作业写同一路径。\u003c/p>\n\u003cpre class=\"bash\">\u003ccode># 只读诊断示例，不杀进程、不改系统配置\nps -ef | grep python\nnvidia-smi\nnvidia-smi topo -m\ndf -h\u003c/code>\u003c/pre>\n\u003ch2 id=\"h04\">多卡
